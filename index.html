 "cat": "Pizza & Focaccia", "note": "", "detail": {"ingredienti": ["500g farina di tipo 0", "300ml acqua tiepida", "7g sale fino", "5g lievito di birra fresco", "350g zucca butternut", "150g gorgonzola dolce", "80g castagne tostate", "60g nocciole tostate", "30ml olio extravergine di oliva"], "procedimento": "Step 1: Impastare farina, acqua, sale e lievito fino a ottenere un composto omogeneo. Lasciare lievitare 2 ore coperto a temperatura ambiente.\nStep 2: Tagliare la zucca a cubetti, cuocerla al forno a 200°C per 20 minuti, quindi frullarla con olio fino a ottenere una crema liscia e densa.\nStep 3: Stendere l'impasto su carta da forno creando una base circolare uniforme, circa 30cm di diametro.\nStep 4: Spalmare la crema di zucca in modo omogeneo sulla base, lasciando 1cm di bordo.\nStep 5: Sgretolare il gorgonzola e distribuirlo uniformemente sulla zucca.\nStep 6: Tritare grossolanamente castagne e nocciole, mescolarle insieme e cospargere sulla pizza.\nStep 7: Cuocere a 250°C per 12-15 minuti fino a ottenere un bordo dorato e croccante.\nStep 8: Estrarre dal forno, aggiungere un filo di olio extravergine e servire calda."}}, {"id": 119, "title": "Crema/ fonduta di parmigiano, carciofo fritto/ giudea / croccante al forno e guanciale fine croccante", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["200g parmigiano reggiano a pezzetti", "100ml panna fresca", "50ml brodo di vegetale", "2 carciofi romani", "150g guanciale", "Olio di semi per friggere", "Sale e pepe q.b.", "Noce moscata q.b."], "procedimento": "Step 1: Pulire i carciofi romani eliminando le foglie esterne dure, tagliare a metà nel senso della lunghezza e rimuovere la peluria interna con un cucchiaio. Immergere in acqua con limone.\nStep 2: Rosolare il guanciale a fettine sottili in una padella antiaderente a fuoco medio fino a renderlo croccante, quindi trasferirlo su carta assorbente.\nStep 3: Scaldare la panna con il brodo in un pentolino a fuoco basso, aggiungere il parmigiano a pezzetti mescolando continuamente fino a ottenere una crema liscia e omogenea. Condire con sale, pepe e una grattugiata di noce moscata.\nStep 4: Asciugare i carciofi con carta assorbente, condire con sale e pepe, quindi friggerli in olio a 180°C per 8-10 minuti fino a renderli dorati e croccanti. Scolarli su carta assorbente.\nStep 5: Disporre la fonduta di parmigiano nel piatto, adagiare i carciofi fritti intorno, guarnire con il guanciale croccante e un'altra grattugiata di parmigiano fresco."}}, {"id": 120, "title": "Gnocco di cima di rapa acciughe peperoncino su cialda di pane croccante e acqua di provola", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["300g patate", "100g cima di rapa", "100g farina 00", "6 filetti di acciuga sott'olio", "1 peperoncino rosso fresco", "200ml latte di provola", "2 fette di pane casereccio", "Sale e pepe q.b."], "procedimento": "Step 1: Sbollentare la cima di rapa in acqua salata per 5 minuti, scolarla e tritarla finemente. Lessare le patate in acqua salata fino a cottura completa, quindi schiacciarle ancora calde.\nStep 2: Mescolare le patate schiacciate con la cima di rapa tritata, la farina e un pizzico di sale. Impastare delicatamente fino a ottenere un composto omogeneo.\nStep 3: Formare 8 gnocchi da 25g circa con le mani inumidite. Lessarli in acqua salata finché non risalgono in superficie e attendere 30 secondi in più.\nStep 4: Preparare l'acqua di provola frullando il latte di provola con un mixer fino a ottenere una schiuma leggera e cremosa.\nStep 5: Toastare le fette di pane in forno a 180°C per 8 minuti fino a renderle croccanti, quindi frazionarle in pezzetti irregolari.\nStep 6: Scaldare in padella gli acciughe in un filo d'olio con il peperoncino affettato per 2 minuti a fuoco basso.\nStep 7: Disporre gli gnocchi su un piatto con la schiuma di provola come base, aggiungere la miscela di acciughe e peperoncino.\nStep 8: Completare il piatto con i crostini di pane e servire immediatamente."}}, {"id": 121, "title": "Risotto anduja crema di provola affumicata e cedro/limone candito", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["160g riso Carnaroli", "150g salsiccia anduja", "100g provola affumicata", "500ml brodo di pollo caldo", "1 cedro candito (o limone candito)", "1 scalogno", "50ml vino bianco secco", "50g burro"], "procedimento": "Step 1: Tritare finemente lo scalogno e rosolare in un tegame con un po' di burro. Aggiungere l'anduja sbriciolata e farla cuocere per 2 minuti, mescolando bene.\nStep 2: Tostare il riso nel soffritto per 1 minuto, mescolando costantemente. Sfumare con il vino bianco e attendere che si assorba completamente.\nStep 3: Aggiungere il brodo caldo un mestolo alla volta, mantenendo il fuoco a intensità medio-alta. Mescolare frequentemente per circa 16-18 minuti, finché il riso non risulta cremoso ma ancora al dente.\nStep 4: Affettare sottilmente la provola affumicata e aggiungerla al risotto negli ultimi 2 minuti di cottura, mescolando delicatamente per creare una crema.\nStep 5: Completare la mantecatura con il burro rimasto e mescolare energicamente per ottenere una consistenza cremosa e brillante.\nStep 6: Distribuire il risotto nei piatti e guarnire con fettine di cedro candito tagliato fine e scaglie di provola affumicata grattugiata. Servire immediatamente."}}, {"id": 122, "title": "Perle di parmigiano con crema di asparagi", "cat": "Zuppe & Vellutate", "note": "", "detail": {"ingredienti": ["150g parmigiano reggiano grattugiato", "400g asparagi freschi", "200ml panna da cucina", "1 scalogno", "50g burro", "Sale e pepe q.b.", "1 limone", "Noce moscata q.b."], "procedimento": "Step 1: Pulire gli asparagi eliminando la parte più dura del gambo, quindi tagliarli in pezzi di 3-4cm e lessarli in acqua salata per 6-7 minuti fino a renderli teneri.\nStep 2: Preparare le perle di parmigiano: stendere il formaggio grattugiato su carta forno in piccoli mucchietti rotondi e cuocerli in forno a 180°C per 5-6 minuti fino a quando non diventano dorati e croccanti. Lasciar raffreddare leggermente.\nStep 3: Tritare finemente lo scalogno e farlo appassire in una padella con 25g di burro a fuoco dolce per 2 minuti.\nStep 4: Aggiungere gli asparagi cotti al soffritto di scalogno e versare la panna da cucina, cuocendo per 3 minuti a fuoco medio.\nStep 5: Frullare la crema di asparagi con un mixer a immersione fino a ottenere una consistenza vellutata, aggiustando di sale, pepe e una grattugia di noce moscata.\nStep 6: Mantecare la crema con il burro rimasto e il succo di mezzo limone per esaltare i sapori.\nStep 7: Distribuire la crema di asparagi nei piatti, disporre delicatamente le perle di parmigiano croccanti e servire immediatamente."}}, {"id": 123, "title": "Polpette asparagi ricotta e mayo piccante", "cat": "Secondi Piatti", "note": "", "detail": {"ingredienti": ["250g asparagi freschi", "200g ricotta", "100g pane grattugiato", "2 uova", "150g maionese", "1 cucchiaio di peperoncino in polvere", "50g parmigiano reggiano grattugiato", "Sale e pepe q.b."], "procedimento": "Step 1: Pulire gli asparagi eliminando la parte bianca e dura, quindi tagliarli a pezzi di 2cm e lessarli in acqua salata per 5 minuti. Scolarli e farli raffreddare.\nStep 2: In una ciotola mescolare la ricotta con il pane grattugiato, le uova, il parmigiano, sale e pepe fino a ottenere un composto omogeneo.\nStep 3: Aggiungere gli asparagi al composto e mescolare delicatamente fino a distribuirli uniformemente.\nStep 4: Con le mani umide, formare delle polpette della grandezza di una noce e disporle su un piatto.\nStep 5: Preparare la maionese piccante mescolando la maionese con il peperoncino in polvere in una ciotola.\nStep 6: Scaldare olio in una padella a fuoco medio-alto e friggere le polpette per 3-4 minuti per lato fino a doratura uniforme.\nStep 7: Scolare le polpette su carta assorbente.\nStep 8: Servire le polpette calde accompagnate dalla maionese piccante."}}, {"id": 124, "title": "Fiore di zucca aperto in tempera pomodorini  confit acciughe cantabrico", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["4 fiori di zucca freschi", "150g pomodorini ciliegia", "8 filetti di acciuga cantabrico", "100g farina 00", "150ml acqua frizzante", "30ml olio extravergine di oliva", "Sale e pepe q.b.", "1 spicchio d'aglio"], "procedimento": "Step 1: Preparare la tempura mescolando la farina con acqua frizzante fredda fino a ottenere un impasto omogeneo e leggermente liquido; aggiungere un pizzico di sale.\nStep 2: Pulire delicatamente i fiori di zucca eliminando il pistillo interno, aprirli a libro con le mani e asciugarli con carta assorbente.\nStep 3: Preparare i pomodorini confit: tagliarli a metà, disporli in una teglia con aglio schiacciato e olio, cuocere in forno a 120°C per 45 minuti fino a renderli morbidi e concentrati.\nStep 4: Immergere i fiori di zucca aperti nella pastella di tempura, tenendoli leggermente aperti per una cottura uniforme.\nStep 5: Friggere in olio a 180°C per 2-3 minuti fino a doratura, poi scolare su carta assorbente.\nStep 6: Disporre il fiore di zucca nel piatto, farcire con i pomodorini confit e 2 filetti di acciuga cantabrico per porzione.\nStep 7: Completare con un filo di olio extravergine, sale e pepe; servire immediatamente."}}, {"id": 125, "title": "Spaghetto mayo aglio peperoncino peperone crusco e spuma prezzemolo (olio) e limone (benedetto cavalieri)", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["160g spaghetti Benedetti Cavalieri", "2 spicchi aglio", "1 peperoncino rosso fresco", "1 peperone crusco", "100ml maionese", "1 mazzo prezzemolo fresco", "1 limone biologico", "60ml olio extravergine di oliva", "Sale q.b."], "procedimento": "Step 1: Tostare leggermente il peperone crusco in padella asciutta per 2-3 minuti, quindi ridurlo in polvere fine con un mortaio.\nStep 2: Preparare la maionese all'aglio: frullare insieme maionese, 1 spicchio d'aglio e un pizzico di sale fino a ottenere una crema omogenea.\nStep 3: Creare la spuma di prezzemolo: frullare prezzemolo fresco con 40ml di olio e il succo di mezzo limone, passare al setaccio e montare leggermente con una frusta.\nStep 4: Affettare finemente l'aglio rimanente e il peperoncino; rosolarli delicatamente in 20ml di olio per 1-2 minuti a fuoco basso.\nStep 5: Cuocere gli spaghetti in acqua salata fino a al dente (circa 9 minuti), scolarli mantenendo 100ml di acqua di cottura.\nStep 6: Mantecare gli spaghetti con la maionese all'aglio, aggiungendo un po' di acqua di cottura per ottenere una salsa cremosa.\nStep 7: Distribuire nei piatti, aggiungere l'aglio e peperoncino in olio, spolverare con peperone crusco.\nStep 8: Completare con una quenelle di spuma di prezzemolo, grattugiare limone benedetto e finire con filo di olio extravergine."}}, {"id": 126, "title": "Tonno cbt pomodorini confit cipolla agrodolce olive e lamelle di mandorla", "cat": "Dolci & Dessert", "note": "", "detail": {"ingredienti": ["320g tonno rosso fresco", "250g pomodorini ciliegini", "1 cipolla rossa media", "80g olive taggiasche", "40g mandorle pelate", "3 cucchiai olio extravergine di oliva", "2 cucchiai aceto di vino bianco", "sale e pepe nero q.b."], "procedimento": "Step 1: Mondare i pomodorini, tagliarli a metà e disporli in una teglia con 1 cucchiaio di olio, sale e pepe. Cuocere in forno a 120°C per 30 minuti fino a renderli leggermente confit.\nStep 2: Affettare sottilmente la cipolla rossa e metterla in una pentola con 2 cucchiai di aceto e 1 cucchiaio d'acqua. Cuocere a fuoco basso per 8-10 minuti fino a renderla morbida e agrodolce, aggiustare di sale.\nStep 3: Tostare leggermente le mandorle in una padella asciutta per 2 minuti, poi tagliarle in lamelle sottili.\nStep 4: Tagliare il tonno rosso in cubetti di circa 2cm, condire con 1 cucchiaio di olio, sale e pepe nero appena macinato.\nStep 5: Mondare le olive taggiasche e tagliarle a metà.\nStep 6: Assemblare i piatti: disporre il tonno al centro, circondarlo con i pomodorini confit, la cipolla agrodolce e le olive. Cospargere con le lamelle di mandorla tostate e un filo di olio a crudo. Servire subito."}}, {"id": 127, "title": "Cozze fritte con salsa di pecorino e menta", "cat": "Secondi Piatti", "note": "", "detail": {"ingredienti": ["500g cozze fresche", "100g farina 00", "1 uovo", "100ml latte", "80g pecorino romano grattugiato", "15g menta fresca", "Sale e pepe q.b.", "Olio di semi per friggere"], "procedimento": "Step 1: Pulire le cozze sotto acqua corrente con una spazzola, eliminare la barba e scartare quelle danneggiate o aperte.\nStep 2: Cuocere le cozze in una padella a fuoco alto per 2-3 minuti finché non si aprono, scolare e far raffreddare leggermente, quindi estrarre la polpa dal guscio.\nStep 3: Preparare la pastella mescolando farina, uovo, latte, sale e pepe fino a ottenere un composto omogeneo e cremoso.\nStep 4: Riscaldare abbondante olio di semi in una padella profonda fino a 170°C, immergere le cozze nella pastella e friggerle in piccoli lotti per 2-3 minuti fino a doratura.\nStep 5: Scolare le cozze fritte su carta assorbente per eliminare l'olio in eccesso.\nStep 6: Preparare la salsa mescolando pecorino romano grattugiato, menta fresca tritata finemente, un cucchiaio di olio di oliva, sale e pepe.\nStep 7: Disporre le cozze fritte su un piatto da portata e servire con la salsa di pecorino e menta a parte o versata sopra."}}, {"id": 128, "title": "Pizza crema di zucca cavolo nero ripassato mozzarella e lardo di colonnata", "cat": "Pizza & Focaccia", "note": "", "detail": {"ingredienti": ["500g impasto per pizza", "300g zucca butternut", "150g cavolo nero", "100g mozzarella di bufala", "50g lardo di Colonnata", "50ml panna fresca", "20g parmigiano reggiano", "Sale e pepe q.b."], "procedimento": "Step 1: Cuocere la zucca a cubetti in forno a 200°C per 20 minuti, poi frullarla con la panna fino a ottenere una crema liscia.\nStep 2: Pulire il cavolo nero, tagliarlo a striscioline e ripassarlo in padella con un filo d'olio per 5 minuti fino a renderlo croccante.\nStep 3: Stendere l'impasto su carta forno, spalmare la crema di zucca in modo uniforme, lasciando 2cm di bordo.\nStep 4: Distribuire il cavolo nero ripassato sulla crema e condire con sale e pepe.\nStep 5: Staccare il lardo di Colonnata in fettine sottili e disporle sulla pizza prima della cottura.\nStep 6: Cuocere in forno a 250°C per 12-15 minuti fino a doratura del bordo.\nStep 7: Sfornare, aggiungere la mozzarella strappata a pezzi e il parmigiano grattugiato.\nStep 8: Lasciare riposare 2 minuti prima di servire."}}, {"id": 129, "title": "Cozze pesto pecorino e pane carasau", "cat": "Secondi Piatti", "note": "", "detail": {"ingredienti": ["800g cozze fresche", "100g pane carasau", "80g basilico fresco", "60g pecorino romano grattugiato", "60ml olio extravergine di oliva", "3 spicchi aglio", "1 limone", "Sale e pepe nero q.b."], "procedimento": "Step 1: Pulire le cozze sotto acqua corrente fredda, eliminando barbette e incrostazioni con un coltello.\nStep 2: Preparare il pesto triturando il basilico con l'aglio, il pecorino romano e l'olio extravergine fino a ottenere una crema omogenea; regolare di sale e pepe.\nStep 3: In una padella ampia con coperchio, disporre le cozze a fuoco medio-alto e lasciarle aprire per circa 5-7 minuti, scartando quelle che non si aprono.\nStep 4: Aggiungere il pesto alle cozze ancora nel liquido di cottura, mescolando delicatamente per 2 minuti.\nStep 5: Rompere il pane carasau in frammenti irregolari e tostarlo leggermente in forno a 180°C per 3-4 minuti.\nStep 6: Distribuire le cozze al pesto in due ciotole, irrorare con il liquido di cottura e aggiungere una spruzzata di succo di limone fresco.\nStep 7: Guarnire con il pane carasau tostato e un filo di olio extravergine prima di servire."}}, {"id": 130, "title": "Frolla al cioccolato marmellata agrumi crema e frutti di bosco", "cat": "Dolci & Dessert", "note": "", "detail": {"ingredienti": ["150g farina 00", "80g burro freddo", "40g cacao in polvere", "1 uovo", "40g zucchero", "1 pizzico di sale", "100g marmellata di agrumi", "150g crema pasticcera", "100g frutti di bosco freschi (mirtilli, lamponi, fragole)"], "procedimento": "Step 1: Preparare la frolla: impastare farina, cacao, sale e zucchero. Aggiungere il burro freddo tagliato a dadini, sfregare con le dita fino a ottenere un impasto sabbioso. Unire l'uovo e amalgamare.\nStep 2: Avvolgere l'impasto nella pellicola e riposare in frigorifero per 30 minuti.\nStep 3: Stendere la frolla fra due fogli di carta forno, adagiarla in uno stampo da 20cm, bucare il fondo con una forchetta e cuocere a 180°C per 15 minuti.\nStep 4: Lasciar raffreddare completamente la base di frolla.\nStep 5: Spalmare sul fondo della frolla uno strato uniforme di marmellata di agrumi.\nStep 6: Distribuire la crema pasticcera sopra la marmellata livellando bene.\nStep 7: Decorare la superficie con i frutti di bosco freschi, disposti in modo ordinato e artistico.\nStep 8: Servire a temperatura ambiente o leggermente refrigerato."}}, {"id": 131, "title": "Ostrica vapore patata e friggitello", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["4 ostriche fresche", "300g patate a pasta gialla", "2 friggitelli rossi", "100ml vino bianco secco", "30g burro", "Sale e pepe q.b.", "1 limone"], "procedimento": "Step 1: Pulire le patate, tagliarle a dadini di circa 1cm e metterle in una pentola con acqua salata. Fare cuocere per 8-10 minuti fino a renderle tenere.\nStep 2: Lavare i friggitelli, eliminare i semi e tagliarli a strisce sottili di mezzo centimetro.\nStep 3: In una vaporiera o pentola con cestello, versare il vino bianco e un bicchiere d'acqua. Portare a ebollizione a fuoco medio-alto.\nStep 4: Aprire le ostriche con coltello apposito, mantenendo il liquido interno, e disporle nel cestello della vaporiera.\nStep 5: Aggiungere i dadini di patata e i friggitelli intorno alle ostriche. Condire con sale e pepe. Cuocere a vapore per 5-6 minuti.\nStep 6: Nel frattempo, far fondere il burro in una piccola padella a fuoco basso.\nStep 7: Trasferire il tutto in un piatto, distribuire il burro fuso sopra le ostriche e completare con una spruzzata di succo di limone fresco.\nStep 8: Servire immediatamente mentre ancora fumante."}}, {"id": 132, "title": "Chili vegetariano con fagioli neri e peperoni", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["2 peperoni rossi (circa 300g)", "1 cipolla media (150g)", "2 spicchi d'aglio", "300g fagioli neri (o 1 scatola da 400g)", "400g pomodori pelati", "2 cucchiai olio extravergine di oliva", "1 cucchiaino peperoncino in polvere", "Sale e pepe q.b."], "procedimento": "Step 1: Pulire i peperoni eliminando semi e filamenti bianchi, poi tagliarli a dadini. Tritare finemente la cipolla e l'aglio.\nStep 2: Scaldare l'olio in una pentola e fare rosolare la cipolla e l'aglio per 2-3 minuti fino a profumare.\nStep 3: Aggiungere i peperoni tagliati e cuocere per 5 minuti, mescolando occasionalmente.\nStep 4: Versare i pomodori pelati e il peperoncino in polvere, mescolare bene.\nStep 5: Aggiungere i fagioli neri (sciacquati e sgocciolati) e portare a ebollizione.\nStep 6: Ridurre il fuoco a medio-basso e lasciare sobbollire per 20-25 minuti, mescolando occasionalmente.\nStep 7: Assaggiare e correggere di sale e pepe secondo il gusto.\nStep 8: Servire caldo in ciotole, eventualmente con un filo di olio d'oliva a crudo."}}, {"id": 133, "title": "Pizza Bonci", "cat": "Pizza & Focaccia", "note": "https://blog.giallozafferano.it/dulcisinforno/pizza-bonci/", "detail": {"ingredienti": ["500g Farina 0", "400ml Acqua", "20ml Olio extravergine d'oliva", "10g Sale", "3g Lievito di birra fresco", "q.b. Semola di grano duro rimacinata"], "procedimento": "Step 1: Versa la farina in una ciotola e aggiungi l'acqua fredda o a temperatura ambiente.\nStep 2: Mescola con una forchetta fino a ottenere un impasto omogeneo con l'80% di idratazione.\nStep 3: Aggiungi il sale, l'olio extravergine d'oliva e il lievito di birra fresco, continuando a mescolare con la forchetta.\nStep 4: Trasferisci l'impasto in una teglia da forno (40x30 cm) infarinata con semola di grano duro.\nStep 5: Copri la teglia e riponila in frigorifero per 24 ore, dove avverrà la lievitazione e la maturazione.\nStep 6: Dopo 24 ore, estrai l'impasto dal frigorifero: sarà lievitato e pieno di bolle.\nStep 7: Cuoci in forno a 200°C per circa 20 minuti fino a quando la pizza risulta dorata."}}, {"id": 134, "title": "Zuppetta di fragole con zabaione al marsala e crumble al pepe di Sichuan.", "cat": "Dolci & Dessert", "note": "https://www.sicilianicreativiincucina.it/zuppetta-di-fragole-con-semifreddo-allo-zabaione-di-santin/", "detail": {"ingredienti": ["400g fragole fresche", "5 tuorli d'uovo", "100g zucchero", "100ml marsala secco", "80g burro", "60g farina", "40g mandorle tritate", "1 cucchiaino pepe di Sichuan"], "procedimento": "Step 1: Pulire le fragole, tagliarle a pezzi e disporle in coppette da dessert.\nStep 2: Preparare lo zabaione: montare i tuorli con lo zucchero a bagnomaria fino a ottenere una crema spumosa, quindi aggiungere il marsala continuando a montare.\nStep 3: Versare lo zabaione tiepido sulle fragole nelle coppette.\nStep 4: Preparare il crumble: mescolare la farina, il burro morbido, le mandorle tritate e il pepe di Sichuan fino a ottenere un composto sabbioso.\nStep 5: Tostare il crumble in forno a 180°C per 8-10 minuti fino a doratura.\nStep 6: Cospargere il crumble al pepe di Sichuan sulla zuppetta di fragole.\nStep 7: Servire subito la zuppetta ancora tiepida."}}, {"id": 135, "title": "Budino ai semi di chia", "cat": "Antipasti & Stuzzichini", "note": "https://www.fattoincasadabenedetta.it/ricetta/budino-ai-semi-di-chia/", "detail": {"ingredienti": ["200ml latte di mandorla", "100ml yogurt greco", "40g semi di chia", "15g miele", "5g vaniglia in polvere", "50g frutti di bosco freschi", "10g cocco grattugiato", "Pizzico di sale"], "procedimento": "Step 1: Versare il latte di mandorla e lo yogurt greco in una ciotola e mescolare bene.\nStep 2: Aggiungere i semi di chia, il miele e la vaniglia in polvere, mescolando accuratamente per evitare grumi.\nStep 3: Aggiungere un pizzico di sale e mescolare ancora fino a ottenere un composto omogeneo.\nStep 4: Versare il composto in bicchieri o ciotole singole e riporre in frigorifero per almeno 4 ore o durante la notte.\nStep 5: Prima di servire, mescolare delicatamente il budino per renderlo più cremoso.\nStep 6: Decorare il budino con frutti di bosco freschi e cocco grattugiato.\nStep 7: Servire freddo come dessert leggero e nutriente."}}, {"id": 136, "title": "Risotto ai carciofi e vongole", "cat": "Primi Piatti", "note": "https://blog.giallozafferano.it/cucinaconmiasorella/risotto-ai-carciofi-e-vongole/", "detail": {"ingredienti": ["180g riso Carnaroli", "200g carciofi puliti", "400g vongole", "1/2 bicchiere vino bianco secco", "1l brodo vegetale", "3 cucchiai olio extravergine d'oliva", "1 rametto prezzemolo", "Peperoncino secco q.b."], "procedimento": "Step 1: Pulire i carciofi, lavarli e ridurli a fettine. Rosolarli in padella con un filo d'olio, prezzemolo tritato e peperoncino per qualche istante, coprire con il coperchio e far cuocere per circa 10 minuti aggiungendo brodo se necessario.\nStep 2: Pulire le vongole sotto acqua corrente e batterle una ad una su un tagliere per verificare l'assenza di sabbia.\nStep 3: Aggiungere le vongole in padella, farle aprire, estrarle dalle valve e rimetterle insieme ai carciofi. Tenere da parte il sugo.\nStep 4: Tostare il riso in padella con un filo d'olio evo per circa 1 minuto, sfumare con il vino bianco, lasciare evaporare e aggiungere il brodo poco alla volta, mescolando spesso per 20-25 minuti. A metà cottura aggiungere il sugo di vongole e carciofi.\nStep 5: Una volta cotto il riso, spegnere il fuoco e manteccare con 2 cucchiai generosi di olio evo. Trasferire nei piatti e guarnire con peperoncino se gradito."}}, {"id": 137, "title": "SEPPIE CON CIME DI RAPA", "cat": "Antipasti & Stuzzichini", "note": "https://www.ciclistaaifornelli.it/seppie-con-cime-di-rapa/", "detail": {"ingredienti": ["800g seppie pulite", "500g cime di rapa", "3 spicchi d'aglio", "150ml vino bianco secco", "4 cucchiai olio extravergine d'oliva", "1 peperoncino rosso", "Sale e pepe q.b."], "procedimento": "Step 1: Pulire le seppie eliminando la pelle e tagliarle a strisce. Lavare le cime di rapa e tagliarle a pezzi.\nStep 2: In una pentola con olio caldo, rosolare l'aglio affettato e il peperoncino intero per 1 minuto.\nStep 3: Aggiungere le seppie e farle rosolare per 3-4 minuti, mescolando bene.\nStep 4: Versare il vino bianco e lasciare sfumare per 2 minuti.\nStep 5: Aggiungere le cime di rapa e mescolare, coprire con un coperchio e cuocere a fuoco medio per 15-20 minuti.\nStep 6: Aggiustare di sale e pepe a piacere e continuare la cottura fino a quando le seppie non risulteranno tenere.\nStep 7: Servire il piatto caldo, togliendo il peperoncino se preferite ridurre la piccantezza."}}, {"id": 138, "title": "Smoked Pork Chili Verde", "cat": "Antipasti & Stuzzichini", "note": "https://www.pinterest.com", "detail": {"ingredienti": ["800g spalla di maiale affumicata", "500g tomatillos verdi", "2 peperoni poblano", "1 cipolla grande", "3 spicchi d'aglio", "500ml brodo di carne", "2 cucchiai olio d'oliva", "Sale e pepe q.b."], "procedimento": "Step 1: Tagliare la spalla di maiale affumicata a cubetti di circa 2cm e riservare.\nStep 2: Arrostire i peperoni poblano sulla fiamma fino a carbonizzarli, poi metterli in un sacchetto per 10 minuti e pelarne la pelle.\nStep 3: Tritare finemente cipolla e aglio, quindi rosolarli in olio d'oliva in una pentola grande per 3-4 minuti.\nStep 4: Aggiungere i tomatillos tagliati a metà e i peperoni poblano a strisce, cuocere per 5 minuti mescolando.\nStep 5: Inserire i cubetti di maiale affumicato e il brodo di carne, portare a ebollizione.\nStep 6: Ridurre la fiamma e lasciare sobbollire per 45-60 minuti fino a quando la carne si ammorbidisce.\nStep 7: Assaggiare e regolare di sale e pepe secondo il gusto.\nStep 8: Servire caldo in ciotole profonde con pane tostato o tortillas."}}, {"id": 139, "title": "Polpo e patate: polpo in sous-vide con maionese di acqua di polpo", "cat": "Secondi Piatti", "note": "https://bluaragosta.it/2020/07/polpo-e-patate-polpo-in-sous-vide-con-maionese-di-acqua-di-polpo.html", "detail": {"ingredienti": ["800g polpo fresco", "400g patate a pasta gialla", "1 tuorlo d'uovo", "200ml olio di semi", "1 limone", "Sale e pepe q.b.", "2 spicchi aglio", "1 rametto rosmarino"], "procedimento": "Step 1: Pulire il polpo sotto acqua fredda, eliminare occhi e becco. Portare a ebollizione un pentolone d'acqua salata con aglio e rosmarino, immergere il polpo e cuocere 45 minuti fino a tenerezza.\nStep 2: Estrarre il polpo dall'acqua di cottura e lasciar raffreddare. Conservare 150ml dell'acqua di cottura per la maionese. Tagliare il polpo in pezzi regolari.\nStep 3: Preparare i sacchetti per il sous-vide: inserire il polpo tagliato con sale, pepe e un filo di olio. Sottovuoto e cuocere a 65°C per 20 minuti.\nStep 4: Nel frattempo, mondare le patate e tagliarle a dadini. Cuocerle in acqua salata per 12-15 minuti fino a cottura.\nStep 5: Preparare la maionese: montare il tuorlo con un pizzico di sale, aggiungere lentamente l'olio mentre si lavora con la frusta, incorporare gradualmente l'acqua di cottura del polpo precedentemente tiepidita per ottenere una maionese fluida e profumata.\nStep 6: Finire la maionese con succo di limone fresco, sale e pepe a piacere.\nStep 7: Estrarre il polpo dal sottovuoto e saltarlo 2 minuti in padella con un filo d'olio per ottenere una leggera crosticina.\nStep 8: Impiattare: disporre le patate, il polpo tiepido e accompagnare con la maionese di acqua di polpo a lato."}}, {"id": 140, "title": "cozze al Gorgonzola", "cat": "Antipasti & Stuzzichini", "note": "https://reportergourmet.com/it/news/5716-come-preparare-le-cozze-al-gorgonzola-la-ricetta-che-osa-di-helene-darroze", "detail": {"ingredienti": ["800g cozze fresche", "150g gorgonzola dolce", "100ml panna fresca", "1 scalogno", "100ml vino bianco secco", "2 cucchiai burro", "Sale e pepe q.b.", "Prezzemolo fresco"], "procedimento": "Step 1: Pulire le cozze sotto acqua corrente con una spazzola, eliminando i residui e il bisso (il filamento).\nStep 2: Tritare finemente lo scalogno e farlo rosolare in una padella con il burro a fuoco medio per 2 minuti.\nStep 3: Aggiungere le cozze nella padella e versare il vino bianco, coprire e cuocere a fuoco alto per 5-6 minuti finché le cozze non si aprono (scartare quelle che rimangono chiuse).\nStep 4: In una ciotola, mescolare il gorgonzola a temperatura ambiente con la panna fino a ottenere una crema omogenea.\nStep 5: Trasferire le cozze in una ciotola, filtrare il liquido di cottura e versarne 150ml nella padella insieme alla crema di gorgonzola, mescolando bene.\nStep 6: Aggiungere le cozze alla salsa, mescolare delicatamente, regolare di sale e pepe.\nStep 7: Distribuire in piatti hondo, guarnire con prezzemolo fresco tritato e servire subito."}}, {"id": 141, "title": "Pollo alla pizzaiola in vaso cottura", "cat": "Pizza & Focaccia", "note": "https://blog.giallozafferano.it/neltegamesulfuoco/pollo-alla-pizzaiola-in-vaso-cottura/", "detail": {"ingredienti": ["600g petto di pollo", "400g pomodori pelati", "150g mozzarella fresca", "2 spicchi aglio", "8-10 olive nere", "2 cucchiai olio extravergine", "Sale e pepe q.b.", "1 cucchiaino origano secco"], "procedimento": "Step 1: Tagliare il petto di pollo in 4 fettine regolari di circa 150g l'una, salare e pepare su entrambi i lati.\nStep 2: Scaldare l'olio in un vaso cottura a fuoco medio-alto e rosolare il pollo per 3-4 minuti per lato fino a dorare leggermente, poi trasferire in un piatto.\nStep 3: Nello stesso vaso, aggiungere l'aglio schiacciato e rosolare per 1 minuto, quindi versare i pomodori pelati schiacciati leggermente con le mani.\nStep 4: Aggiungere l'origano, mescolare e far cuocere a fuoco moderato per 5 minuti, quindi riposizionare il pollo nel sugo.\nStep 5: Distribuire le olive nere intorno al pollo, coprire il vaso e cuocere a fuoco medio-basso per 12-15 minuti fino a quando il pollo è cotto.\nStep 6: A cottura ultimata, adagiare la mozzarella fresca a fiocchi direttamente sul pollo, coprire per 2-3 minuti fino a che non si scioglie leggermente.\nStep 7: Assaggiare e correggere di sale e pepe se necessario, quindi servire caldo direttamente dal vaso."}}, {"id": 142, "title": "The Japanese Yuzu Whiskey Sour", "cat": "Antipasti & Stuzzichini", "note": "https://mybartender.com/drinks/japanese-cocktails/", "detail": {"ingredienti": ["90 ml whiskey giapponese (preferibilmente Yamazaki o Hibiki)", "45 ml succo di yuzu fresco", "30 ml sciroppo semplice", "15 ml albume d'uovo", "2 gocce di Angostura bitter", "Ghiaccio in cubetti", "1 fetta di yuzu per guarnire", "Schiuma di yuzu (facoltativo)"], "procedimento": "Step 1: Versare il whiskey giapponese, il succo di yuzu fresco e lo sciroppo semplice in uno shaker.\nStep 2: Aggiungere l'albume d'uovo e riempire lo shaker di ghiaccio.\nStep 3: Shakerare vigorosamente per 15 secondi per creare una schiuma vellutata.\nStep 4: Filtrare il cocktail in due bicchieri rocks riempiti con nuovo ghiaccio.\nStep 5: Aggiungere 1 goccia di Angostura bitter su ogni drink e mescolare delicatamente.\nStep 6: Guarnire con una fetta sottile di yuzu fresco sulla superficie.\nStep 7: Servire immediatamente e degustare l'equilibrio tra l'acidità agrumata dello yuzu e la morbidezza del whiskey."}}, {"id": 143, "title": "Polpo scottato con riso aromatico e crema di patate dolci", "cat": "Primi Piatti", "note": "https://gnambox.com/ricette/ingredienti/pasta-e-riso/polpo-scottato-riso-aromatico-crema-patate-dolci-al-curry/", "detail": {"ingredienti": ["600g polpo fresco", "150g riso Carnaroli", "300g patate dolci", "1 limone", "100ml panna fresca", "2 cucchiai olio extravergine", "Sale e pepe q.b.", "1 rametto rosmarino"], "procedimento": "Step 1: Pulire il polpo eliminando l'inchiostro, quindi bollirlo in acqua salata con limone e rosmarino per 35-40 minuti fino a renderlo tenero.\nStep 2: Nel frattempo, sbucciare e tagliare le patate dolci a pezzi, bollirle in acqua salata per 20 minuti, scolare e frullare con panna, 1 cucchiaio olio, sale e pepe fino a ottenere una crema vellutata.\nStep 3: Cuocere il riso in acqua salata bollente per 18 minuti, scolare al dente e mantecarlo con 1 cucchiaio olio, sale e pepe.\nStep 4: Tagliare il polpo raffreddato in pezzi da 4-5 cm, scaldare una padella antiaderente e cuocere il polpo a fuoco alto per 2-3 minuti per lato fino a scottarlo leggermente.\nStep 5: Comporre il piatto: distribuire la crema di patate dolci sul fondo del piatto, aggiungere il riso aromatico al centro e coronare con i pezzi di polpo scottato."}}, {"id": 144, "title": "RISOTTO AL LATTE DI COCCO CON GAMBERI PICCANTI", "cat": "Primi Piatti", "note": "https://www.contemporaneofood.com/risotto-al-latte-di-cocco-con-gamberi-piccanti-e-menta-fritta/", "detail": {"ingredienti": ["160g riso Carnaroli", "300ml latte di cocco", "250g gamberi freschi", "500ml brodo di pesce", "1 cipolla piccola", "2 spicchi d'aglio", "1 peperoncino rosso", "40g burro", "Sale e pepe q.b."], "procedimento": "Step 1: Pulire i gamberi, togliere il guscio e l'intestino, quindi farli rosolare in padella con 1 spicchio d'aglio e peperoncino per 2-3 minuti. Trasferirli in un piatto.\nStep 2: Scaldare il brodo di pesce in un pentolino e mantenerlo caldo durante tutto il processo.\nStep 3: In una casseruola, rosolare la cipolla tritata finemente con un filo d'olio fino a renderla trasparente, aggiungere il riso e tostarlo per 2 minuti, mescolando costantemente.\nStep 4: Iniziare ad aggiungere il brodo caldo un mestolo alla volta, mescolando frequentemente e aspettando che il riso assorba il liquido prima di aggiungerne altro.\nStep 5: Dopo 12-13 minuti, quando il riso è quasi cotto, aggiungere il latte di cocco e continuare la cottura per altri 3-4 minuti.\nStep 6: Quando il riso è al dente e cremoso, aggiungere il burro, sale e pepe, rimestando bene per ottenere una cremosità ottimale.\nStep 7: Disporre il risotto nei piatti e adagiare i gamberi in superficie, completando con una macinata di pepe e una spolverata di peperoncino fresco."}}, {"id": 145, "title": "Spaghettoni cacio, pepe, limone e acciughe", "cat": "Primi Piatti", "note": "https://www.youtube.com/watch?v=0xngiRKz2SY", "detail": {"ingredienti": ["400g spaghettoni", "200g pecorino romano grattugiato", "2 cucchiai di pepe nero macinato fresco", "8 filetti di acciughe sotto sale", "2 limoni biologici", "100ml acqua di cottura della pasta", "2 cucchiai di olio extra vergine di oliva", "Sale q.b."], "procedimento": "Step 1: Portare a ebollizione una pentola d'acqua salata e cuocere gli spaghettoni fino a raggiungere la cottura al dente.\nStep 2: Nel frattempo, sciacquare i filetti di acciughe sotto acqua fredda, asciugarli e tritarli finemente.\nStep 3: In una padella, scaldare l'olio e rosolare le acciughe tritate fino a farle sciogliere completamente.\nStep 4: Aggiungere il pepe nero macinato fresco e toastare per alcuni secondi, quindi spegnere il fuoco.\nStep 5: Scolare gli spaghettoni mantenendo 100ml di acqua di cottura e versarli nella padella con le acciughe.\nStep 6: Aggiungere il pecorino romano grattugiato e la scorza di limone finemente grattugiata, mescolando bene con l'acqua di cottura.\nStep 7: Aggiungere il succo di mezzo limone e mantecare a fuoco basso fino ad ottenere una crema uniforme.\nStep 8: Servire immediato, completando con una spolverata di pepe nero e una spruzzata di succo di limone fresco."}}, {"id": 146, "title": "La bisque di crostacei", "cat": "Antipasti & Stuzzichini", "note": "https://www.cucchiaio.it/ricetta/bisque-di-crostacei/", "detail": {"ingredienti": ["400g crostacei misti (gamberoni, aragoste, scampi), freschi", "1 cipolla media", "2 carote medie", "2 gambi di sedano", "500ml brodo di pesce", "200ml panna fresca", "2 cucchiai di cognac", "Sale e pepe q.b."], "procedimento": "Step 1: Pulire i crostacei, separare la testa dal corpo e le zampe. Triturare i gusci con un mortaio o frullatore per ottenere piccoli frammenti.\nStep 2: Tritare finemente cipolla, carote e sedano. In una pentola, rosolare i frammenti di guscio in olio caldo per 3-4 minuti, mescolando costantemente.\nStep 3: Aggiungere il soffritto di verdure e far rosolare ancora 2 minuti. Sfumare con il cognac e lasciar evaporare l'alcol.\nStep 4: Versare il brodo di pesce e portare a ebollizione, quindi abbassare il fuoco e lasciare sobbollire per 20 minuti.\nStep 5: Filtrare il brodo attraverso un colino a maglie fini, pressando bene i gusci per estrarre tutti i succhi. Scartare i residui solidi.\nStep 6: Cuocere la polpa dei crostacei in padella per 2-3 minuti, quindi aggiungere il brodo filtrato e far sobbollire per 5 minuti.\nStep 7: Aggiungere la panna fresca, mescolare bene e far scaldar tutto senza bollire. Regolare di sale e pepe.\nStep 8: Servire la bisque calda in ciotole, decorando con un filo di panna fresca e un gamberone intero se desiderato."}}, {"id": 147, "title": "chili con carne perfetto", "cat": "Antipasti & Stuzzichini", "note": "https://winedharma.com/ricette/come-preparare-il-chili-con-carne-perfetto-la-ricetta-messicana/", "detail": {"ingredienti": ["800g carne macinata di manzo", "200g carne macinata di maiale", "2 cipolle", "2 carote", "1 costa di sedano", "6 pomodori San Marzano", "200g fagioli secchi borlotti", "200g fagioli secchi neri", "1 peperoncino jalapeno", "2 cucchiai concentrato di pomodoro", "1 bicchiere vino bianco secco o birra", "1 cucchiaino peperoncino in polvere", "Sale e pepe q.b.", "80g formaggio Cheddar grattugiato"], "procedimento": "Step 1: La sera prima mettete i fagioli in ammollo. Al mattino fateli bollire con acqua salata e una foglia di alloro per 1 ora.\nStep 2: Lavate e sminuzzate carota, cipolle, peperoncino jalapeno e sedano. Fate stufare in 8 cucchiai di olio di oliva a fiamma dolce per 15 minuti.\nStep 3: Pelate i pomodori dopo averli immersi in acqua bollente per 15 secondi, tagliateli a pezzi ed eliminate i semi.\nStep 4: Aggiungete la carne macinata al soffritto, rimescolate e cuocete 5 minuti, poi sfumate con mezza birra e lasciate evaporare.\nStep 5: Aggiungete i pomodori pelati e i fagioli cotti. Condite con sale, peperoncino e pepe. Cuocete 30 minuti.\nStep 6: Versate il resto della birra e continuate a cuocere per 1 ora, rimescolando di tanto in tanto.\nStep 7: Aggiungete il concentrato di pomodoro e cuocete ancora 30 minuti. Se asciuga troppo, allungate con brodo.\nStep 8: Impiattate il chili, grattugiate formaggio Cheddar sopra e servite con tortillas, avocado o riso."}}, {"id": 148, "title": "Maionese di polpo", "cat": "Secondi Piatti", "note": "https://www.cookist.it/maionese-di-polpo/", "detail": {"ingredienti": ["300g polpo fresco", "1 tuorlo d'uovo", "100ml olio di oliva extravergine", "15ml aceto bianco", "1 spicchio aglio", "sale fino q.b.", "pepe nero q.b.", "1 limone"], "procedimento": "Step 1: Pulire il polpo eliminando la sabbia dalla sacca del nero, poi lessarlo in acqua salata con uno spicchio d'aglio per 45-50 minuti fino a quando risulti tenero.\nStep 2: Lasciar raffreddare completamente il polpo, quindi tagliarlo a dadini piccoli e passarlo al mixer fino a ottenere un composto cremoso e omogeneo.\nStep 3: In una ciotola, versare il tuorlo d'uovo a temperatura ambiente e iniziare a montarlo con una frusta, aggiungendo l'olio goccia a goccia mentre si continua a mescolare energicamente.\nStep 4: Una volta che il composto inizia ad addensarsi, aggiungere l'olio in filo sottile, continuando a montare per evitare che impazzi.\nStep 5: Quando la maionese avrà raggiunto la consistenza desiderata, aggiungere l'aceto bianco e il succo di limone per bilanciare i sapori.\nStep 6: Incorporare delicatamente il polpo tritato alla maionese, mescolando con cura per mantenerla aereata.\nStep 7: Regolare di sale e pepe nero macinato al momento secondo il gusto personale.\nStep 8: Servire fredda come accompagnamento per crostini, uova sode o come salsa per pesce."}}, {"id": 149, "title": "TAGLIATELLE AI FUNGHI PORCINI CON SALSICCE E SALSA DI CACIOCAVALLO", "cat": "Primi Piatti", "note": "https://blog.giallozafferano.it/martanoskitchen/tagliatelle-autunnali/", "detail": {"ingredienti": ["400g tagliatelle ai funghi porcini", "300g salsicce di maiale", "200g caciocavallo", "100ml latte intero", "30g burro", "10g farina 00", "2 rametti rosmarino", "1,5 spicchio aglio", "1,5 bicchiere vino bianco", "Olio di oliva q.b.", "Sale e pepe nero q.b."], "procedimento": "Step 1: Preparare la salsa di caciocavallo: sciogliere il burro in un pentolino, aggiungere la farina e mescolare con frusta fino a ottenere un roux color nocciola. Versare il latte continuando a girare, aggiungere il caciocavallo grattugiato e mescolare fino a ottenere una salsa liscia e senza grumi.\nStep 2: Sgranare le salsicce eliminando completamente il budello.\nStep 3: In una padella, scaldare un filo d'olio con mezzo spicchio d'aglio (senza germe), 2 rametti di rosmarino intero e le salsicce. Cuocere fino a metà cottura.\nStep 4: Aggiungere mezzo bicchiere di vino bianco alle salsicce, lasciare evaporare l'alcol e ridurre.\nStep 5: Nel frattempo, cuocere le tagliatelle ai funghi porcini in acqua salata per 5 minuti.\nStep 6: Scolare la pasta direttamente nella padella delle salsicce, togliere i rametti di rosmarino.\nStep 7: Aggiungere un mestolo d'acqua di cottura e 2 cucchiai di salsa di caciocavallo per manteccare, regolando a proprio gusto.\nStep 8: Impiattare, versare il resto della salsa, spolverare di pepe e decorare con un rametto di rosmarino."}}, {"id": 150, "title": "Pull Apart Meatball Sliders", "cat": "Antipasti & Stuzzichini", "note": "https://www.traeger.com/recipes/pull-apart-meatball-sliders", "detail": {"ingredienti": ["300g carne macinata mista (manzo e maiale)", "40g pangrattato", "1 uovo", "80g formaggio parmigiano grattugiato", "200ml salsa di pomodoro", "4 panini da burger piccoli", "100g mozzarella filante", "Sale, pepe e aglio in polvere q.b."], "procedimento": "Step 1: Impastare la carne macinata con pangrattato, uovo, 50g parmigiano, sale, pepe e aglio in polvere fino a ottenere un composto omogeneo.\nStep 2: Formare 12 polpettine della dimensione di una noce e sistemarle in una teglia rivestita di carta forno.\nStep 3: Cuocere in forno a 180°C per 12-15 minuti finché non sono dorate.\nStep 4: Togliere le polpettine dal forno e versarvi sopra la salsa di pomodoro, poi cospargere con il formaggio parmigiano rimanente e la mozzarella.\nStep 5: Infornare nuovamente a 200°C per 5 minuti finché il formaggio non sia fuso e filante.\nStep 6: Dividere i panini a metà orizzontalmente e tostare leggermente l'interno.\nStep 7: Distribuire le polpettine con la salsa e il formaggio fuso sui panini.\nStep 8: Chiudere i panini e servire immediatamente."}}, {"id": 151, "title": "Risotto con nduja", "cat": "Primi Piatti", "note": "https://www.chefincamicia.com/ricette/risotto-con-nduja", "detail": null}, {"id": 152, "title": "jalapeno jelly", "cat": "Antipasti & Stuzzichini", "note": "https://www.makingcentsmatter.com/how-to-make-jalapeno-jelly/", "detail": null}, {"id": 153, "title": "Stinco alla birra", "cat": "Antipasti & Stuzzichini", "note": "https://www.chefincamicia.com/ricette/stinco-alla-birra", "detail": null}, {"id": 154, "title": "Jalapeno Pepper Jam", "cat": "Antipasti & Stuzzichini", "note": "https://www.pinterest.com", "detail": null}, {"id": 155, "title": "Mojito shots - Gelatine morbide al Mojito", "cat": "Antipasti & Stuzzichini", "note": "https://blog.giallozafferano.it/lifferia/mojito-shots/", "detail": null}, {"id": 156, "title": "CECINA Toscana", "cat": "Antipasti & Stuzzichini", "note": "https://blog.gialloz : "http://lasalsaaurora.com/tag/rucola/", "detail": null}, {"id": 199, "title": "Baked Meatballs with Mozzarella! Italian", "cat": "Antipasti & Stuzzichini", "note": "http://www.southyourmouth.com/2015/05/baked-meatballs-with-mozzarella.html", "detail": null}, {"id": 200, "title": "Ravioli al nero con baccala mantecato e burro aromatico", "cat": "Primi Piatti", "note": "http://www.conunpocodizucchero.it/2009/12/ravioli-al-nero-con-baccala-mantecato-e-burro-aromatico.html", "detail": null}, {"id": 201, "title": "Ultra crispy baked potato", "cat": "Antipasti & Stuzzichini", "note": "https://www.dinneratthezoo.com/baked-potato-wedges/", "detail": null}, {"id": 202, "title": "Bayou Crab Chowder", "cat": "Zuppe & Vellutate", "note": "http://www.akitchenhoorsadventures.com/bayou-crab-chowder/", "detail": null}, {"id": 203, "title": "Summer mojitos", "cat": "Antipasti & Stuzzichini", "note": "http://pubx.co/qX5HbS", "detail": null}, {"id": 204, "title": "Spice-loaded meatballs with a Turkish inflection.", "cat": "Antipasti & Stuzzichini", "note": "https://cooking.nytimes.com/recipes/1019197-spiced-lamb-meatballs-with-yogurt-and-herbs", "detail": null}, {"id": 205, "title": "il risotto arachidi, nduja e cicoria", "cat": "Primi Piatti", "note": "http://www.gustoblog.it/post/228420/ricette-masterchef-8-il-risotto-arachidi-nduja-e-cicoria", "detail": null}, {"id": 206, "title": "Flank Steak Tacos with Cilantro Lime Yogurt Sauce", "cat": "Tacos & Street Food", "note": "http://www.thegarlicdiaries.com/flank-steak-tacos-with-cilantro-lime-yogurt-sauce/", "detail": null}, {"id": 207, "title": "Scalloped Hasselback Potatoes Recipe", "cat": "Antipasti & Stuzzichini", "note": "http://effen1.blogspot.jp/", "detail": null}, {"id": 208, "title": "Gnocchi di patate dolci con carciofi e crema di parmigiano reggiano", "cat": "Primi Piatti", "note": "https://blog.giallozafferano.it/ombraincucina/gnocchi-di-patate-dolci-con-carciofi-e-crema-di-parmigiano-reggiano/", "detail": {"ingredienti": ["ngredienti per 4 persone", "– 1 kg di patate dolci /Americane", "– 300 g di farina 00 piu q.b.", "– sale q.b.", "– 4 cuori di carciofo", "– olio evo q.b.", "– pepe q.b.", "– 1/2 bicchiere di vino bianco secco", "– 120 ml di latte", "– 30 gr di burro", "– 1 cucchiaio di farina", "– noce moscata q.b.", "– 60 gr di parmigiano reggiano grattuggiato il piu fine possibile"], "procedimento": "Lessare le patate in abbondante acqua salata\nQuando saranno tenere sbucciarle e schiacciarle con lo schiacciapatate ( senza farle raffreddare )\nMetterle in una ciotola aggiungere un pizzico di sale e la farina setacciata poco per volta\nRegolatevi se dovesse servire altra farina , il composto dovra essere comunque morbido\nInfarinare un piano di lavoro e formare dei serpentelli non troppo grossi\nTagliarli a pezzettini formando gli gnocchi .\nPreparare i carciofi\nEliminare le foglie esterne piu dure e la barba interna\nTagliarli a listerelle sottili\nTritare lo scalogno\nIn una capiente padella antiaderente mettere 2 cucchiai di olio evo , aggiungere lo scalogno e i carciofi\nCuocere 5 minuti sfumare con il vino coprire e portare a cottura ( dovranno rimaere croccanti )\nQuando saranno pronti aggiungere una macinata di pepe\nPreparare la crema di parmigiano reggiano\nSciogliere il burro in una casseruola a fiamma bassa .\nQuando sara’ sciolto versare la farina e mescolare\nAggiungere il latte a filo sempre mescolando per non formare grumi\nQuando il latte sara’ caldo ma prima che prenda il bollore aggiungere la noce moscata e il parmigiano reggiano\nFar addensare la crema\nLessare gli gnocchi , scolarli nella padella dei carciofi e far insaporire\nImpiattare aggiungendo la crema di parmigiano reggiano sul fondo del piatto e adagiare gli gnocchi"}}, {"id": 209, "title": "Dumpling and noodles", "cat": "Antipasti & Stuzzichini", "note": "https://www.pinterest.com", "detail": null}, {"id": 210, "title": "Il risotto con crema di carote e gorgonzola", "cat": "Primi Piatti", "note": "https://cucina.fidelityhouse.eu/primi-piatti/risotto-con-crema-di-carote-e-gorgonzola-200094.html", "detail": null}, {"id": 211, "title": "Il risotto con pere, scamorza affumicata e noci", "cat": "Primi Piatti", "note": "https://cucina.fidelityhouse.eu/primi-piatti/risotto-con-pere-scamorza-affumicata-e-noci-207222.html", "detail": null}, {"id": 212, "title": "Ham and Potato Corn Chowder", "cat": "Zuppe & Vellutate", "note": "http://www.closetcooking.com/2015/04/ham-and-potato-corn-chowder.html", "detail": null}, {"id": 213, "title": "ravioli al pecorino di fossa e ricotta", "cat": "Primi Piatti", "note": "http://www.cavolettodibruxelles.it/2005/11/ravioli-al-formaggio-di-fossa-con-salsa-di-pere-e-balsamico", "detail": null}, {"id": 214, "title": "Mashed potatoes", "cat": "Antipasti & Stuzzichini", "note": "http://tiphero.com/mashed-potato-cheese-bites/", "detail": null}, {"id": 215, "title": "Pop corn cavolfiore", "cat": "Antipasti & Stuzzichini", "note": "", "detail": null}, {"id": 216, "title": "Corn Ribs", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["Pannocchie", "Olio", "Paprika", "Sale"], "procedimento": "Sbollentare per 5 minuti le pannocchie, poi asciugarle tagliarle e cospargerle con olio sale e paprika. Cuocerle in forno per 20-25 minuti a 200 gradi"}}, {"id": 217, "title": "Pizza pesto di cavolo nero e nocciola con nduja", "cat": "Pizza & Focaccia", "note": "", "detail": null}, {"id": 218, "title": "Sgrafignoni Gnocchi di Pangrattato", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["120g di pangrattato", "60g di Parmigiano Reggiano grattugiato", "2 uova", "1 cucchiaio di farina", "1/2 cucchiaino di sale", "30g di burro", "2 o 3 cucchiai di latte"], "procedimento": "Mescolate tutti gli ingredienti, regolando il latte in modo da ottenere un impasto morbido (non preoccupatevi se appiccica un po’, il pangrattato lo asciugherà assorbendo l’eccesso).\nFate riposare per una ventina di minuti, poi ricavate delle palline ed affusolatele (oppure delle quenelle con 2 cucchiai).\nTuffate gli gnocchi in acqua bollente salata, sono pronti non appena vengono a galla.\nConditeli a piacere ripassandoli in padella con burro e salvia, oppure saltateli nel sugo e serviteli ancora bollenti"}}, {"id": 219, "title": "Risotto con polpo", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["PER IL RISOTTO", "Vino1 bicchiere", "Saleq.b.", "Riso160 g", "PER LA CREMA DI BURRO", "Pomodori10", "Capperiq.b.", "Oliveq.b.", "Pepeq.b.", "Saleq.b.", "Burro40 g", "PER IL POLPO", "Tentacoli4"], "procedimento": "Tostare il riso in una padella antiaderente senza grassi aggiunti, salare e sfumare con il vino bianco. Evaporato il vino aggiungere il brodo e portare il riso a cottura.\nSTEP 2\nFrullare il burro con i pomodorini, capperi, olive, pepe e sale. Aggiungere la crema al riso a fine cottura e mantecare.\nSTEP 3\nCon l'aiuto di un coppa pasta impiattare il risotto e aggiungere il polpo precedentemente bollito e insaporito con sale e olio."}}, {"id": 220, "title": "TONNO MARINATO MIELE E BIRRA", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["x4 persone", "200/300 g di trancio di tonno (abbattuto)", "mezzo mango", "2 cucchiaini colmi di miele", "2 cucchiai di salsa di solida", "30ml di birra chiara", "mezzo avocado", "1 cucchiaio di succo di limone", "200ml di salsa teriyaki", "semi di sesamo neri per decorare", "scorza di limone (facoltativa)", "salsa sriracha (facoltativa)", "sale", "olio evo"], "procedimento": "Come prima cosa passate il tonno velocemente sotto l’acqua fredda, tamponatelo bene e iniziate a preparare la marinatura. In una ciotola mettete miele, birra, 1 cucchiaio di olio e la salsa di soia, mescolate tutto e immergete il tonno (potete se non vi piace il tonno, sostituirlo con per esempio del salmone). Coprite con della pellicola e lasciate riposare in frigorifero per almeno 1 ora. Nel mentre tagliate il mango facendo delle fettine il più sottili possibile, se avete una mandolina potete aiutarvi con quella. Tagliato il mango, preparate il dip di avocado, molto semplicemente con una forchetta (se volete potete usare anche un mixer), schiacciate fino a creare una purea, aggiungete succo di limone, 1 cucchiaio di olio e aggiustate di sale. Ora mettete sul fuoco una padella antiaderente, fuoco medio alto e fate scaldare. Tirate fuori il tonno e scottate in padella per 1 secondo da entrambi i lati, non deve starci di più. Tagliate il tonno a fette sottili, sempre il più possibile e impiattate(in base a quante fettine vi vengono dividete per le quattro porzioni): salsa teriyaki sul fondo, fettine di mango, tonno, dip di avocado su ogni fettina di tonno, una puntina di salsa sriracha (se vi piace), scorza di limone, semi di sesamo e servite"}}, {"id": 221, "title": "Risotto stracciatella gamberi lamponi", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["https://pin.it/1LS3e0QyA", "Gamberi rossi: 6", "Olio evo: q.b.", "Sale: q.b.", "Pepe: q.b.", "Gusci di gamberi rossi: 8", "Cipolla piccola: 1", "Carota: 1", "Prezzemolo: q.b.", "Pomodorini: 2-3", "Vino bianco: 1 bicchiere", "Acqua: 250-300 ml", "Olio evo: q.b.", "Sale: q.b.", "Olio evo: q.b.", "Scalogno: 1 piccolo", "Lamponi: 125 g", "Zucchero: 25 g", "Acqua: 25 g", "Agar Agar: 1 g", "Riso carnaroli: 160 g", "Burrata: 130 g", "Gamberi rossi: 6", "Burro: 30 g", "Vino bianco: mezzo bicchiere", "Lamponi ghiacciati: 6", "Salsa ai lamponi: q.b."], "procedimento": "In una casseruola unire l’olio, lo scalogno tritato finemente, i lamponi, lo zucchero e coprire con acqua; Far cuocere finché i lamponi si saranno completamente sfaldati, successivamente filtrare con un colino a maglie strette e versare in una casseruola portando al primo bollore, quindi versare l’agar agar, mescolare bene, e far raffreddare;\n2\nSgusciare i gamberi tenendo da parte i gusci e le teste per il brodo, ed eliminare l’intestino; Tagliare a tocchetti e condire con olio; extravergine d’oliva, sale e qualche fogliolina di menta. Lasciar marinare per 30 minuti;\n3\nIn una pentola riunire l’olio, la cipolla e la carota tritate finemente, gli scarti dei gamberi, e far rosolare qualche minuto; Quando gli scarti avranno preso colore sfumare con il vino bianco, e far evaporare l’alcool; Aggiungere il prezzemolo, i pomodorini, e l’acqua, e far cuocere un’ora; Infine filtrare con un colino a maglie strette, riportare sul fuoco il brodo, e aggiungere il sale;\n4\nMettere i lamponi in freezer la sera prima, o almeno qualche ora prima; Tagliare il burro per la mantecatura a cubetti, e metterlo in freezer; Tostare il riso a secco, e iniziare la cottura con il brodo bollente, aggiungendolo gradualmente man mano che viene assorbito, mescolando spesso; Trascorsi i minuti di cottura del riso aggiungere la stracciatella; Mantecare aggiungendo il burro freddo a dadini;\n5\nImpiattare il risotto con i gamberi crudi a tocchetti, i lamponi ghiacciati e la loro salsa, qualche fogliolina di menta e fiorellino edibile."}}, {"id": 222, "title": "Linguine agrumi e gamberi", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["https://pin.it/5OlTaLNOR", "Linguine agli agrumi con gamberi rosa,bisque e polvere di liquirizia", "Pasta e cereali", "360 g Linguine", "Birra, vino e liquori", "50 ml Brandy", "Altro", "Arancie", "600 g Gamberi", "Mandarini", "Olio", "Pepe nero", "Pepe rosa", "Polvere di liquirizia", "Pompelmo rosa", "1 Spicchio aglio"], "procedimento": "Puliamo bene i gamberi sciacquandoli e togliendo teste e carapaci. Realizziamo una bisque a freddo. Prendiamo gli scarti eliminando gli occhi e mettiamoli in un contenitore alto, con olio, un pizzico di sale, pepe rosa e acqua fredda. Frulliamo tutto e passiamo al setaccio. Teniamo da parte\nSTEP 2\nIniziamo a cuocere le linguine. In una pentola aggiungiamo acqua, portiamola a bollore e poi saliamola leggermente. Caliamo la pasta\nSTEP 3\nSoffriggiamo uno spicchio d’aglio e peperoncino in una padella. Appena l'aglio si sarà imbiondito togliamolo dalla padella ed aggiungiamo i gamberi. Cuociamo per un paio di minuti da entrambi i lati. Aggiungiamo il brandy e il succo degli agrumi. Continuiamo a cuocere per 2-3 minuti ancora. Non oltre 5 minuti. Togliamo i gamberi\nSTEP 4\nScoliamo le linguine molto al dente direttamente nella padella del condimento e terminiamo la cottura risottando la pasta. Aggiungiamo i gamberi e amalgamiamo con olio evo a filo\nSTEP 5\nVersiamo la bisque in un pentolino e facciamola ridurre\nSTEP 6\nSul fondo di un piatto disponiamo la bisque di gamberi, le linguine, i gamberi e, per un tocco in più, polvere di liquirizia"}}, {"id": 223, "title": "Linguine gambero arancia e asparagi", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["500g linguine aromatizzate all’arancia", "250g asparagi verdi pugliesi da produzione integrata", "2 arance biologiche", "20 gamberi rossi", "15 gamberi rossi più piccoli", "1 noce di burro", "2cucchiai friscous Salentino Petramarè al pepe nero", "q.b. Olio evo ( in questa ricetta ho utilizzato un olio verace della Tenuta Pesare di Manduria prodotto con due varietà di olive: Cellina e Oliarola )", "q.b. Sale"], "procedimento": "molto sottili e teneri, non occorrerà privarli dei filamenti. Teniamo da parte le puntarelle e tagliamo a metà i gambi privandoli della parte inferiore più coriacea. Prepariamo un brodo vegetale con i gambi degli asparagi, la cipolla e la carota. Utilizzeremo il brodo per risottare la pasta e frulleremo e passeremo al setaccio i gambi, una volta cotti nel brodo, per ottenerne la polpa che utilizzeremo in fase di mantecatura della pasta.\nFase 2\nRipassiamo in pentola le puntarelle degli asparagi rosolandoli velocemente in una noce di burro, devono rimanere croccanti. Rimuoviamoli dalla pentola e teniamoli da parte\nFase 3\nDedichiamoci alla pulizia dei gamberi, rimuovendo il carapace e l’intestino, facendo attenzione a non disperdere il contenuto delle teste, il corallo del gambero, che raccoglieremo in un bicchiere del mixer, schiacciando le teste, per preparare una “maionese di mare” (ovviamente senza l’utilizzo dell’uovo) con l’aggiunta di olio evo, succo di arancia e qualche piccolo gamberetto che donerà colore. Mettiamo a marinare i gamberi ripuliti, con succo di arancia e olio evo e teniamoli al fresco Mettiamo a bollire l’acqua e caliamo la pasta per qualche minuto perchè ultimeremo la cottura risottando la pasta in un’altra pentola e utilizzando il brodo vegetale preparato, il succo di arancia e l’estratto setacciato di asparago. Quando è quasi pronta la pasta aggiungiamo in pentola parte della “maionese di mare” e lasciamo che tutti i profumi si fondano nel piatto in un gusto unico ed equilibrato. Aggiungiamo della scorza di arancia biologica prima di impiattare"}}, {"id": 224, "title": "Polpette tofu e patate", "cat": "Secondi Piatti", "note": "", "detail": {"ingredienti": ["https://pin.it/6RsSbUYzD", "Polpette di patate e tofu in salsa curry", "Prodotti da frigo", "360 g Di tofu", "Ingredienti in polvere", "2 Cucchiaino di garam masala", "Bevande", "200 ml Di latte di cocco in brick", "Altro", "1 Cipolla", "½ cucchiaino di curcuma", "1 Cucchiaino di semi di finocchietto", "½ cucchiaino di zenzero in polvere", "1 Cucchiaio di succo di limone", "25 g Di amido di mais", "30 g Di anacardi al naturale", "600 g Di patate", "400 g Di polpa di pomodoro", "1 Pizzico di peperoncino", "1 Pizzico di sale", "1 Presa di sale"], "procedimento": "Pelate, tagliate a cubetti e lessate le patate fino a che non saranno morbide. Schiacciatele con lo schiaccia patate e lasciatele raffreddare.\nFormiamo le polpette\nTamponate il tofu con della carta assorbente in modo da eliminare quanta più acqua possibile, poi tagliatelo a cubetti e mettetelo nel tritatutto; frullatelo fino ad ottenere una crema morbida, unendo poi anche le patate, il garam masala, il succo di limone, il sale e l’amido di mais. Formate 24 polpette, spennellatele di olio e infornate in forno preriscaldato a 200°C per 30 minuti. Prepariamo la salsa al curry\nTritate la cipolla, scaldate un goccio d’olio con le spezie, unite la cipolla e un pizzico di sale e lasciate soffriggere qualche minuto. Aggiungete gli anacardi, la polpa di pomodoro e il latte di cocco e lasciate cuocere la salsa per 20 minuti senza coperchio. Trasferite il sugo nel frullatore o nel bicchiere alto del minipimer e frullate fino ad ottenere una salsa fluida.\nCompletiamo il piatto\nVersate la salsa al curry nuovamente nella padella, unite le polpette e lasciate insaporire un paio di minuti. Completate il piatto con un goccio di latte di cocco e un pizzico di prezzemolo e servite."}}, {"id": 225, "title": "Polpette di tofu profumate", "cat": "Secondi Piatti", "note": "", "detail": {"ingredienti": ["Per 8-10 polpette", "150 gr. di tofu naturale", "1 cucchiaio di farina di ceci250 gr. di passata di pomodoro", "1 spicchio di aglio", "15 capperi sotto sale", "rosmarino, timo, maggiorana q.b.", "(fresche o essiccate a seconda della disponibilità)", "olio extra vergine di oliva q.b.", "sale q.b.", "pepe nero q.b."], "procedimento": "Frullare il tofu con la farina di ceci e un cucchiaio di olio extra vergine di oliva fino ad ottenere un composto omogeneo e malleabile.\nInsaporire con sale e pepe nero.\nFormare le polpette di tofu e farle riposare in frigorifero per mezz’ora coperte con pellicola trasparente.\nNel frattempo preparare il sugo di pomodoro scaldando due cucchiai di olio extra vergine di oliva con uno spicchio di aglio in camicia.\nAggiungere la passata di pomodoro, profumare a piacere con le erbette aromatiche, insaporire con in capperi precedentemente dissalati e cuocere a fiamma media per circa quindici minuti.\nAggiustare di sale se necessario.\nSistemare in padella le polpette di tofu e cuocerle a fiamma dolce cinque minuti per lato (girandole a metà cottura con molta delicatezza aiutandosi con una spatola). Far riposare per qualche minuto e spolverizzare con una macinata di pepe nero."}}, {"id": 226, "title": "Risotto peperone e crema di pecorino", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["Ingredienti per 2 persone", "– 160 g di riso carnaroli", "– 100 g di peperone rosso", "– 1 cipollina bianca piccola", "– 30 g di formaggio pecorino fresco del Caseificio Artigianale Dragone Talsano (Ta)", "– olio extra vergine di olive leccine", "– 20 g di burro di panna di masseria pugliese", "– 20 g di parmigiano reggiano", "– foglie di origano fresco", "– sale"], "procedimento": "Lavare, asciugare e tagliare a piccoli pezzi il peperone. Rosolarlo in padella con 1 cucchiaio d’olio, la cipollina tritata e il sale. Cuocere con coperchio per 15 minuti. Unire se necessario un mestolino di acqua bollente. Quando cotto frullare e tenere in caldo.\nFrullare il pecorino fresco con qualche cucchiaio di acqua tiedipa. Dovrà risultare un composto cremoso.\nTostare il riso con 2 cucchiai di olio, risottarlo quindi con acqua bollente salata. A 2 minuti dal termine della cottura, aggiungere la crema di peperone ed amalgamare con cura. A cottura ultimata, togliere dal fuoco e mantecare con burro e parmigiano.\nImpiattare e rifinire con la crema di pecorino e le foglioline di origano fresco. Servire subito."}}, {"id": 227, "title": "Risotto melograno e pere", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["https://pin.it/7z79BoQJZ", "Risotto con melograno e pere", "Ingredienti", "200 g riso Carnaroli", "1 pera", "1 melograno", "60 ml vino rosso", "1 cucchiaino zucchero", "1 cucchiaino amido di mais", "q.b. sale", "q.b. pepe", "100 g formaggio spalmabile", "Qualche foglia menta"], "procedimento": "Con l’aiuto di uno spremiagrumi estraiamo il succo dal melograno, lo filtriamo con un colino e versiamo il vino rosso nel recipiente. Aggiungiamo ora lo zucchero, il sale, il pepe e l’amido di mais, mescoliamo bene per evitare la formazione di grumi, versiamo il tutto in una casseruola.\nFacciamo cuocere sul fuoco mescolando finché il composto non si addenserà. Passiamo ora alla preparazione del risotto. Tostiamo bene il riso in un tegame, quando sarà ben caldo aggiungiamo il brodo e lasciamo cuocere lentamente.\nNel frattempo tagliamo la pera a cubetti, ci servirà tra poco. Versiamo la pera tagliata nel riso e proseguiamo la cottura. Una volta pronto aggiungiamo il formaggio spalmabile, giusto il tempo di sciogliersi ed il risotto è pronto per essere impiattato. Utilizziamo la salsa preparata e aggiungiamo alcuni chicchi di melograno e alcune foglie di menta per completare.\nhttps://blog.giallozafferano.it/dilettasecco/ricetta-risotto-con-melograno-e-pere/?utm_source=Pinterest&utm_medium=organic"}}, {"id": 228, "title": "Sofficini senza glutine", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["Acqua 250g", "Olio 1 cucchiaio", "Farina di riso 200g", "Sale 1 pizzico"], "procedimento": "In un pentolino, porta a bollore acqua + olio + sale. Appena bolle, spegni il fuoco e aggiungi la farina tutta insieme. Mescola energicamente con un cucchiaio di legno fino ad ottenere un impasto compatto e senza grumi. Lascia intiepidire leggermente, impasta stendi con un mattarello e forma dei dischi. Metti al centro il ripieno scelto, chiudi a mezzaluna sigillando bene i bordi. Cuoci in padella calda antiaderente 2/3 minuti per lato."}}, {"id": 229, "title": "Noodle spaziali", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["100 g noodles", "2 tuorli", "1 cucchiaio abbondante kewpie mayo", "1 cucchiaio gochujang", "1 cucchiaio cipollotto fresco", "1 cucchiaio salsa di soia", "1 cucchiaio grande acqua di cottura", "chilli crisp", "cipollotto", "semi di sesamo", "(facoltativo) aglio fritto"], "procedimento": "In una ciotola unire tuorli, kewpie, gochujang, salsa di soia e cipollotto. Cuocere i noodles e trasferirli direttamente nella ciotola appena scolati e leggermente al dente. Aggiungere un cucchiaio abbondante di acqua di cottura dei noodles e mescolare velocemente fino a ottenere una crema super liscia. Trasferire tutto in padella e saltare per circa 1/2 minuti, cercando di non far rapprendere troppo la salsa ma abbastanza da cuocerla leggermente"}}, {"id": 230, "title": "Chutney Mango", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["240 g", "di cipolle rosse", "1", "mango maturo", "3 cucchiai", "di zucchero greggio", "1 cucchiaio", "d'acqua", "1 dl", "di succo di mango", "2 cucchiai", "d'aceto di vino bianco", "1 cucchiaino", "di sale", "pepe"], "procedimento": "Taglia le cipolle ad anelli. Pela il mango. Stacca la polpa dal nocciolo e tagliala a dadini.\nMetti lo zucchero e l’acqua in una pentola. Fai bollire a fuoco alto, finché lo zucchero comincia a caramellare. Bagna con il succo di mango e l’aceto. Aggiungi le cipolle e lascia sobbollire per ca. 5 minuti.\nUnisci i dadini di mango e lascia sobbollire il tutto per ca. 15 minuti, mescolando di tanto in tanto, finché il chutney si addensa un po’. Condisci con sale e pepe.\nVersa il chutney di mango e cipolla in vasetti sterilizzati fino al bordo e chiudi immediatamente. Ottimo con formaggio e carne arrostita, ad es. hamburger."}}, {"id": 231, "title": "Salsa Agro-Piccante", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["2 peperoncini circa (dipenderà da quanto la vorremo piccante)", "5 g di sale", "150 ml di acqua", "75 g di zucchero", "55 ml di aceto di vino", "1-2 cucchiai di amido di mais sciolto in acqua"], "procedimento": "Prepariamo i peperoncini: taglieremo il picciolo, li incideremo a metà e toglieremo i semi. Li taglieremo grossolanamente con il coltello per facilitare il lavoro al mixer. Frulliamo: metteremo i peperoncini nel mixer con l'acqua e frulleremo finché il composto non diventerà rosso vivo e uniforme. Cottura: trasferiremo il tutto in un pentolino. Aggiungeremo sale, zucchero e aceto e porteremo lentamente a bollore. Addensiamo: verseremo l'amido sciolto in acqua nella salsa bollente, continuando a mescolare con la frusta finché non otterremo la densità desiderata. Ricorderemo che da fredda si addenserà ancora un po'."}}, {"id": 232, "title": "Involtini di pesce spada con salsa al mango", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["Pesce spada (8 fettine) 480 g", "Pane casereccio mollica 100 g", "Scorza di limone (da grattugiare) 1", "Basilico q.b.", "Olio extravergine d'oliva 10 g", "Sale fino q.b.", "Pepe nero q.b.", "Mango maturo 1", "Zenzero fresco 30 g", "Olio extravergine d'oliva 10 g", "Sale fino q.b.", "Pepe nero q.b."], "procedimento": "Per preparare gli involtini, inizia realizzando la salsa al mango: sbuccia il frutto e taglialo a pezzi, poi frullalo insieme allo zenzero fresco grattugiato, olio extravergine, sale e pepe fino a ottenere una crema liscia. Passa quindi al ripieno tritando nel mixer il pane fresco senza crosta con le foglie di basilico, la scorza di limone, olio e un pizzico di sale e pepe, lavorando il tutto fino a ottenere delle briciole fini. Procedi con l'assemblaggio stendendo le fettine di pesce spada e distribuendo su ciascuna un cucchiaio di composto, lasciando liberi i bordi; ripiega i lati lunghi verso l'interno e arrotola dal basso verso l'alto per sigillare il ripieno. Infine, passa alla cottura: scalda una padella antiaderente con un filo d'olio e adagia gli involtini con la chiusura rivolta verso il basso. Cuoci a fiamma medio-alta per circa un minuto per sigillarli, poi falli dorare uniformemente su tutti i lati per un totale di 2-3 minuti. Servi gli involtini guarnendoli con la salsa al mango e le foglioline di basilico fresco."}}];
const CATS = ["Antipasti & Stuzzichini", "Pizza & Focaccia", "Dolci & Dessert", "Primi Piatti", "Panini & Piadine", "Tacos & Street Food", "Zuppe & Vellutate", "Secondi Piatti"];

tColor\" stroke-width=\"1.5\" opacity=\".4\" fill=\"none\"/>"}, "Tacos & Street Food": {"emoji": "🌮", "color": "#B05A1A", "svg": "<path d=\"M16 40 Q16 24 32 20 Q48 24 48 40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><line x1=\"16\" y1=\"40\" x2=\"48\" y2=\"40\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><circle cx=\"26\" cy=\"34\" r=\"2.5\" fill=\"currentColor\" opacity=\".5\"/><circle cx=\"36\" cy=\"31\" r=\"2\" fill=\"currentColor\" opacity=\".5\"/>"}, "Dolci & Dessert": {"emoji": "🍮", "color": "#D45A8A", "svg": "<path d=\"M22 42 L24 28 Q32 20 40 28 L42 42 Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><ellipse cx=\"32\" cy=\"42\" rx=\"10\" ry=\"4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M32 20 Q34 14 32 10\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" fill=\"none\"/>"}, "Zuppe & Vellutate": {"emoji": "🍲", "color": "#1A8099", "svg": "<path d=\"M18 34 Q18 46 32 46 Q46 46 46 34 L44 28 L20 28 Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><line x1=\"14\" y1=\"28\" x2=\"50\" y2=\"28\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><path d=\"M26 24 Q26 18 28 16\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M36 24 Q36 18 38 16\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" fill=\"none\"/>"}};

function svgForCat(cat) {
  const m = META[cat];
  return `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" style="color:${m.color}">${m.svg}</svg>`;
}

function buildNav() {
  const nav = document.getElementById('catNav');
  const allBtn = document.createElement('button');
  allBtn.className = 'cat-tab active';
  allBtn.textContent = 'Tutte';
  allBtn.onclick = () => showCat('all', allBtn);
  nav.appendChild(allBtn);
  CATS.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-tab';
    btn.textContent = cat;
    btn.onclick = () => showCat(cat, btn);
    nav.appendChild(btn);
  });
}

function buildSections() {
  const main = document.getElementById('main');
  const allSec = document.createElement('div');
  allSec.className = 'cat-block visible';
  allSec.dataset.cat = 'all';
  CATS.forEach(cat => {
    const recipes = RECIPES.filter(r => r.cat === cat);
    if (recipes.length) allSec.appendChild(buildCatBlock(cat, recipes));
  });
  main.appendChild(allSec);
  CATS.forEach(cat => {
    const recipes = RECIPES.filter(r => r.cat === cat);
    if (!recipes.length) return;
    const sec = document.createElement('div');
    sec.className = 'cat-block';
    sec.dataset.cat = cat;
    sec.appendChild(buildCatBlock(cat, recipes));
    main.appendChild(sec);
  });
}

function buildCatBlock(cat, recipes) {
  const m = META[cat];
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="cat-heading">
      <svg class="cat-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" style="color:${m.color}">${m.svg}</svg>
      <span class="cat-name">${cat}</span>
      <span class="cat-n">${recipes.length} ricette</span>
    </div>`;
  const ul = document.createElement('ul');
  ul.className = 'recipe-list';
  recipes.forEach((r, i) => {
    const li = document.createElement('li');
    li.className = 'recipe-row';
    li.dataset.title = r.title.toLowerCase();
    li.dataset.cat = r.cat.toLowerCase();
    const hasContent = r.detail || (r.note && r.note.trim());
    li.innerHTML = `
      <span class="recipe-num">${String(i+1).padStart(2,'0')}</span>
      <span class="recipe-name">${r.title}</span>
      ${hasContent ? '<span class="recipe-badge">RICETTA</span>' : ''}
      <svg class="recipe-arrow" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;
    li.onclick = () => openModal(r);
    ul.appendChild(li);
  });
  wrap.appendChild(ul);
  return wrap;
}

function showCat(cat, btn) {
  document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.cat-block').forEach(s => s.classList.toggle('visible', s.dataset.cat === cat));
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('.recipe-row').forEach(r => r.style.display = '');
  document.getElementById('noResults').classList.remove('visible');
}

function filterRecipes(val) {
  const q = val.toLowerCase();
  let found = 0;
  document.querySelectorAll('.cat-block').forEach(s => s.classList.toggle('visible', s.dataset.cat === 'all'));
  document.querySelectorAll('.cat-tab').forEach((b,i) => b.classList.toggle('active', i===0));
  document.querySelectorAll('.recipe-row').forEach(row => {
    const match = !q || row.dataset.title.includes(q) || row.dataset.cat.includes(q);
    row.style.display = match ? '' : 'none';
    if (match) found++;
  });
  document.getElementById('noResults').classList.toggle('visible', found === 0);
}

function openModal(r) {
  const m = META[r.cat];
  document.getElementById('modalIcon').innerHTML = m.svg;
  document.getElementById('modalIcon').style.color = m.color;
  document.getElementById('modalCat').textContent = r.cat.toUpperCase();
  document.getElementById('modalTitle').textContent = r.title;
  const noteEl = document.getElementById('modalNote');
  if (r.detail) {
    let html = '';
    if (r.detail.ingredienti && r.detail.ingredienti.length > 0) {
      html += '<p class="modal-section-title">Ingredienti</p><ul class="modal-ingredienti">';
      r.detail.ingredienti.forEach(ing => {
        html += `<li>${ing.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</li>`;
      });
      html += '</ul>';
    }
    if (r.detail.procedimento) {
      html += '<p class="modal-section-title">Procedimento</p>';
      html += `<p class="modal-procedimento">${r.detail.procedimento.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</p>`;
    }
    noteEl.innerHTML = html;
  } else if (r.note && r.note.trim()) {
    noteEl.innerHTML = `<div class="modal-note">${r.note.trim().replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>`;
  } else {
    noteEl.innerHTML = `<p class="modal-empty">Nessuna nota aggiunta.</p>`;
  }
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalDirect(); });

buildNav();
buildSections();
</script>
