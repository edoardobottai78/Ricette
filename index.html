<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Mie Ricette</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #F7F4EF;
  --ink: #1C1A17;
  --muted: #9A948A;
  --border: #DDD8D0;
  --accent: #C4853A;
  --surface: #EFEBE4;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Cormorant Garamond', Georgia, serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* HEADER */
.site-header {
  padding: 64px 48px 48px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 24px;
}
.header-left h1 {
  font-size: clamp(3rem, 7vw, 6rem);
  font-weight: 300;
  line-height: 0.9;
  letter-spacing: -2px;
  color: var(--ink);
}
.header-left h1 em {
  font-style: italic;
  color: var(--accent);
}
.header-meta {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-top: 16px;
}
.header-right {
  text-align: right;
}
.total-count {
  font-size: 5rem;
  font-weight: 300;
  color: var(--border);
  line-height: 1;
  letter-spacing: -3px;
}
.total-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 3px;
  text-transform: uppercase;
}

/* SEARCH */
.search-wrap {
  padding: 24px 48px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 16px;
}
.search-wrap input {
  background: none;
  border: none;
  outline: none;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.2rem;
  color: var(--ink);
  width: 100%;
  font-style: italic;
}
.search-wrap input::placeholder { color: var(--muted); }
.search-icon { color: var(--muted); flex-shrink: 0; }

/* NAV */
.cat-nav {
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--border);
  padding: 0 48px;
}
.cat-nav::-webkit-scrollbar { display: none; }
.cat-tab {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 16px 0;
  margin-right: 32px;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  transition: color .2s, border-color .2s;
  flex-shrink: 0;
}
.cat-tab:hover { color: var(--ink); }
.cat-tab.active { color: var(--ink); border-bottom-color: var(--accent); }

/* MAIN */
.main { padding: 0 48px 80px; }

/* CATEGORY BLOCK */
.cat-block { display: none; }
.cat-block.visible { display: block; }
.cat-heading {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 48px 0 24px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 0;
}
.cat-icon {
  width: 48px;
  height: 48px;
  flex-shrink: 0;
}
.cat-name {
  font-size: 2.4rem;
  font-weight: 300;
  letter-spacing: -1px;
}
.cat-n {
  margin-left: auto;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 2px;
}

/* RECIPE LIST */
.recipe-list { list-style: none; }
.recipe-row {
  display: flex;
  align-items: baseline;
  padding: 18px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .15s;
  position: relative;
}
.recipe-row:hover { background: var(--surface); margin: 0 -48px; padding: 18px 48px; }
.recipe-num {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  width: 36px;
  flex-shrink: 0;
}
.recipe-name {
  font-size: 1.35rem;
  font-weight: 400;
  flex: 1;
  line-height: 1.3;
}
.recipe-badge {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--accent);
  letter-spacing: 1px;
  margin-left: 12px;
  flex-shrink: 0;
  opacity: 0;
  transition: opacity .2s;
}
.recipe-row:hover .recipe-badge { opacity: 1; }
.recipe-arrow {
  color: var(--muted);
  margin-left: 12px;
  flex-shrink: 0;
  transition: transform .2s, color .2s;
}
.recipe-row:hover .recipe-arrow { transform: translateX(4px); color: var(--accent); }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(28,26,23,.7);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  opacity: 0; pointer-events: none;
  transition: opacity .25s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  width: 100%; max-width: 600px;
  max-height: 85vh;
  overflow-y: auto;
  transform: translateY(16px);
  transition: transform .25s;
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-header {
  padding: 40px 40px 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}
.modal-icon {
  width: 56px; height: 56px;
  flex-shrink: 0;
  opacity: .6;
}
.modal-close {
  background: none; border: none;
  font-size: 1.5rem; color: var(--muted);
  cursor: pointer; line-height: 1;
  transition: color .2s;
  padding: 4px;
}
.modal-close:hover { color: var(--ink); }
.modal-body { padding: 24px 40px 40px; }
.modal-cat {
  font-family: 'DM Mono', monospace;
  font-size: 10px; color: var(--muted);
  letter-spacing: 2px; text-transform: uppercase;
  margin-bottom: 12px;
}
.modal-title {
  font-size: 2.2rem;
  font-weight: 300;
  line-height: 1.1;
  letter-spacing: -1px;
  margin-bottom: 28px;
}
.modal-divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 0 0 24px;
}
.modal-note {
  font-size: 1.05rem;
  line-height: 1.8;
  color: #4A4540;
  white-space: pre-wrap;
  font-style: italic;
}
.modal-empty {
  font-size: 1rem;
  color: var(--muted);
  font-style: italic;
}
.modal-section-title {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
  margin-top: 24px;
}
.modal-section-title:first-child { margin-top: 0; }
.modal-ingredienti {
  list-style: none;
  margin-bottom: 8px;
}
.modal-ingredienti li {
  font-size: 1.05rem;
  line-height: 1.8;
  color: #4A4540;
  padding-left: 16px;
  position: relative;
}
.modal-ingredienti li::before {
  content: '—';
  position: absolute;
  left: 0;
  color: var(--accent);
}
.modal-procedimento {
  font-size: 1.05rem;
  line-height: 1.8;
  color: #4A4540;
  white-space: pre-wrap;
}

/* NO RESULTS */
.no-results {
  display: none;
  padding: 80px 0;
  text-align: center;
  color: var(--muted);
  font-style: italic;
  font-size: 1.3rem;
}
.no-results.visible { display: block; }

@media (max-width: 600px) {
  .site-header, .search-wrap, .cat-nav, .main { padding-left: 24px; padding-right: 24px; }
  .recipe-row:hover { margin: 0 -24px; padding: 18px 24px; }
  .modal-header, .modal-body { padding-left: 24px; padding-right: 24px; }
  .site-header { padding-top: 40px; flex-direction: column; align-items: flex-start; }
  .header-right { text-align: left; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-left">
    <h1>Le Mie<br><em>Ricette</em></h1>
    <p class="header-meta">Collezione personale &nbsp;·&nbsp; Sempre aggiornata</p>
  </div>
  <div class="header-right">
    <div class="total-count">232</div>
    <div class="total-label">ricette</div>
  </div>
</header>

<div class="search-wrap">
  <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
  <input type="text" id="searchInput" placeholder="Cerca una ricetta…" oninput="filterRecipes(this.value)">
</div>

<nav class="cat-nav" id="catNav"></nav>

<main class="main" id="main"></main>
<div class="no-results" id="noResults">Nessuna ricetta trovata.</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <svg class="modal-icon" id="modalIcon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"></svg>
      <button class="modal-close" onclick="closeModalDirect()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="modal-cat" id="modalCat"></div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <hr class="modal-divider">
      <div id="modalNote"></div>
    </div>
  </div>
</div>

<script>
const RECIPES = [{"id": 1, "title": "Tonno marinato", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["400g tonno fresco (filetto)", "150ml olio extravergine di oliva", "100ml aceto bianco", "2 limoni", "1 cipolla rossa", "2 spicchi aglio", "Sale e pepe q.b.", "Peperoncino fresco q.b."], "procedimento": "Step 1: Tagliare il tonno a fette di circa 1cm di spessore. Disporle in un piatto da portata leggermente sovrapposte.\nStep 2: Affettare finemente la cipolla rossa e gli spicchi d'aglio. Distribuirli uniformemente sul tonno.\nStep 3: Spremere i limoni e versarne il succo su tutto il pesce. Aggiungere l'aceto bianco in modo che il liquido copra completamente il tonno.\nStep 4: Versare l'olio extravergine di oliva uniformemente. Cospargere di sale, pepe e peperoncino fresco a piacere.\nStep 5: Coprire con pellicola trasparente e lasciar riposare in frigorifero per almeno 2 ore, girando delicatamente le fette dopo 1 ora.\nStep 6: Mescolare con cura prima di servire, assicurandosi che ogni fetta sia ben impregnata della marinata.\nStep 7: Portare in tavola freddo, eventualmente aggiungendo un filo di olio fresco e un pizzico di sale marino grosso."}}, {"id": 2, "title": "Sformatini vari (parmigiano, carote amaretti salvia, peperoni fiori di zucca curry)", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["300ml latte intero", "3 uova", "80g parmigiano reggiano grattugiato", "40g burro", "25g farina 00", "Sale e pepe q.b.", "150g carote", "30g amaretti", "8 foglie di salvia fresca", "200g peperoni rossi", "100g fiori di zucca", "1 cucchiaio curry in polvere"], "procedimento": "Step 1: Preparare la besciamella base: sciogliere il burro in un tegame, aggiungere la farina e cuocere per 2 minuti, versare il latte tiepido mescolando continuamente fino a ottenere una crema liscia e omogenea.\nStep 2: Dividere la besciamella in tre ciotole uguali e farla intiepidire leggermente, aggiungendo in ognuna 1 tuorlo d'uovo e mescolando bene.\nStep 3: Nella prima ciotola aggiungere il parmigiano e un pizzico di pepe; nella seconda grattugiare le carote crude, tritare gli amaretti e aggiungere la salvia; nella terza aggiungere i peperoni tagliati finemente e il curry.\nStep 4: Montare a neve i 3 albumi d'uovo con un pizzico di sale e incorporare delicatamente un terzo in ogni preparazione con movimenti dal basso verso l'alto.\nStep 5: Riempire per metà tre stampini da sformatino imburrati versando 2 cucchiai di composto di parmigiano, poi aggiungere un fiore di zucca intero e completare con il composto.\nStep 6: Ripetere l'operazione con gli altri due composti negli altri stampini.\nStep 7: Cuocere a bagnomaria in forno a 180°C per 20-25 minuti fino a quando gli sformatini risultano gonfi e appena dorati in superficie.\nStep 8: Estrarre dal forno, lasciar riposare 2 minuti e sfornare delicatamente su piatto da portata."}}, {"id": 3, "title": "Focaccia integrale pomodorini", "cat": "Pizza & Focaccia", "note": "", "detail": {"ingredienti": ["300g farina integrale", "150ml acqua tiepida", "7g sale", "5g lievito di birra secco", "30ml olio extravergine di oliva", "200g pomodorini ciliegia", "5g rosmarino fresco", "2g pepe nero"], "procedimento": "Step 1: Sciogliere il lievito in acqua tiepida e lasciar riposare 5 minuti. In una ciotola versare la farina integrale con il sale e creare una fontana.\nStep 2: Aggiungere l'acqua con lievito al centro e iniziare ad impastare, incorporando la farina gradualmente. Continuare fino a ottenere un impasto omogeneo, circa 8 minuti.\nStep 3: Aggiungere 20ml di olio all'impasto e continuare a lavorare finché non diventa morbido e elastico. Formare una palla, metterla in una ciotola oleata e coprire con un panno umido. Far lievitare 2 ore fino al raddoppio del volume.\nStep 4: Trasferire l'impasto in una teglia 20x30cm precedentemente unta. Stendere delicatamente con i polpastrelli, creando fossette sulla superficie.\nStep 5: Distribuire i pomodorini tagliati a metà sulle fossette, pressarli leggermente. Cospargere di rosmarino, pepe nero e versare il restante olio. Far lievitare 45 minuti.\nStep 6: Cuocere in forno preriscaldato a 200°C per 25-30 minuti fino a doratura. La focaccia deve risultare croccante fuori e morbida dentro.\nStep 7: Estrarre dal forno e lasciar raffreddare 10 minuti sulla teglia prima di servire."}}, {"id": 4, "title": "Torta cipolle, bacon, uva caramellata", "cat": "Dolci & Dessert", "note": "", "detail": {"ingredienti": ["250g pasta sfoglia", "400g cipolle rosse", "100g bacon affumicato", "150g uva bianca", "50g zucchero", "100ml panna fresca", "80g formaggio grana padano", "Sale e pepe q.b."], "procedimento": "Step 1: Affettare finemente le cipolle rosse e farle rosolare in padella con un filo d'olio per 15 minuti a fuoco medio fino a renderle dolci e appassite.\nStep 2: In una pentola separata, caramellare l'uva con lo zucchero e 2 cucchiai d'acqua per 5 minuti fino a formare un glassato denso.\nStep 3: Tagliare il bacon a dadini e cuocerlo in padella fino a renderlo croccante, poi unirlo alle cipolle insieme alla panna fresca e il grana grattugiato.\nStep 4: Stendere la pasta sfoglia in una teglia da 20cm di diametro, riempire con il composto di cipolle e bacon, livellare bene.\nStep 5: Cuocere in forno preriscaldato a 200°C per 20-25 minuti fino a doratura.\nStep 6: Estrarre dal forno, lasciar riposare 5 minuti, distribuire l'uva caramellata in superficie e servire tiepida."}}, {"id": 5, "title": "Caponata di tonno", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["300g tonno fresco o in scatola", "1 melanzana media", "2 pomodori maturi", "1 cipolla rossa piccola", "50g olive nere denocciolate", "3 cucchiai di olio extravergine d'oliva", "2 cucchiai di aceto di vino rosso", "Sale e pepe q.b."], "procedimento": "Step 1: Tagliare la melanzana a dadini piccoli, salare e lasciar riposare 10 minuti, poi strizzare con le mani per eliminare l'acqua in eccesso.\nStep 2: Rosolare i dadini di melanzana in una padella con 2 cucchiai d'olio a fuoco medio-alto fino a renderli dorati e croccanti, circa 8-10 minuti.\nStep 3: Aggiungere la cipolla rossa finemente tritata e i pomodori tagliati a dadini, cuocere per altri 5 minuti mescolando delicatamente.\nStep 4: Aggiungere le olive nere tagliate a metà, l'aceto di vino rosso e cuocere ancora 2-3 minuti a fuoco lento.\nStep 5: Incorporare il tonno sbriciolato, mescolare con delicatezza per non disgregarlo, e cuocere per 2 minuti.\nStep 6: Condire con il rimanente olio extravergine, sale e pepe, mescolare con cura.\nStep 7: Lasciar raffreddare completamente e servire a temperatura ambiente."}}, {"id": 6, "title": "Gamberi pasta kalataifi al forno", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["250g pasta fresca (tagliatelle o fettuccine)", "300g gamberi freschi", "100g pasta fillo (o kalataifi)", "60g burro", "150ml panna da cucina", "1 spicchio d'aglio", "Sale e pepe", "30g parmigiano reggiano grattugiato"], "procedimento": "Step 1: Pulire i gamberi eliminando il carapace e l'intestino, lavarli e asciugarli con carta da cucina.\nStep 2: Rosolare i gamberi in un tegame con 20g di burro e aglio tritato fino a quando non diventano rosa, quindi condirli con sale e pepe.\nStep 3: Aggiungere la panna al tegame e lasciar ridurre il sugo a fuoco medio per 3-4 minuti.\nStep 4: Cuocere la pasta fresca in acqua salata per 3-4 minuti, scolarla e versarla nel tegame con i gamberi e la panna.\nStep 5: Spezzettare la pasta fillo e croccantizzarla in una padella con 20g di burro fino a diventare dorata e croccante.\nStep 6: Trasferire la pasta con gamberi in una teglia, cospargere la pasta fillo croccante in superficie, aggiungere il parmigiano e grattugiare il restante burro.\nStep 7: Infornare a 200°C per 8-10 minuti fino a doratura.\nStep 8: Estrarre dal forno e servire subito."}}, {"id": 7, "title": "Cous cous di pesce", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["250g cous cous", "400g pesce misto (branzino, orata, scampi)", "1 cipolla media", "2 pomodori pelati", "400ml brodo di pesce", "3 cucchiai olio extravergine d'oliva", "Sale e pepe q.b.", "1 spicchio aglio"], "procedimento": "Step 1: Pulire il pesce, elimare le squame e tagliarlo a pezzi regolari. Tritare finemente la cipolla e lo spicchio d'aglio.\nStep 2: In una pentola, riscaldare l'olio e rosolare la cipolla e l'aglio per 2 minuti fino a profumo.\nStep 3: Aggiungere il pesce e farlo rosolare per 3 minuti, mescolando delicatamente, quindi salare e pepare.\nStep 4: Versare i pomodori pelati e il brodo di pesce, portare a ebollizione e cuocere per 8 minuti.\nStep 5: In una ciotola, versare il cous cous e coprirlo con 400ml di brodo bollente dalla pentola, coprire con un coperchio e lasciare riposare 5 minuti.\nStep 6: Sgranare il cous cous con una forchetta, distribuirlo nei piatti e versare il pesce con il suo sugo sopra."}}, {"id": 8, "title": "Focaccia normale", "cat": "Pizza & Focaccia", "note": "", "detail": {"ingredienti": ["500g farina tipo 0", "300ml acqua tiepida", "7g sale fino", "5g lievito di birra fresco", "60ml olio extravergine di oliva", "10g sale grosso", "Rosmarino fresco q.b."], "procedimento": "Step 1: Sciogliere il lievito in 100ml di acqua tiepida e lasciare riposare 5 minuti.\nStep 2: In una ciotola mescolare la farina con il sale fino, aggiungere il lievito sciolto e l'acqua rimanente, impastare fino a ottenere un composto omogeneo.\nStep 3: Aggiungere 30ml di olio all'impasto e continuare a lavorare per 10 minuti fino a quando diventa morbido ed elastico.\nStep 4: Porre l'impasto in una ciotola oliata, coprire con un panno umido e lasciare lievitare 1 ora a temperatura ambiente.\nStep 5: Trasferire l'impasto in una teglia rettangolare oliata, stendere delicatamente con i polpastrelli creando fossette sulla superficie.\nStep 6: Spennellare con l'olio rimanente, cospargere di sale grosso e rosmarino fresco.\nStep 7: Coprire e lasciare lievitare 30 minuti.\nStep 8: Infornare a 220°C per 20-25 minuti fino a doratura."}}, {"id": 9, "title": "Cornetti salati ripieni", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["320g pasta sfoglia", "150g ricotta", "100g prosciutto cotto tritato", "80g formaggio grana grattugiato", "1 uovo", "30g burro", "Sale e pepe q.b.", "Noce moscata q.b."], "procedimento": "Step 1: Preparare il ripieno mescolando ricotta, prosciutto cotto, grana grattugiato, sale, pepe e una presa di noce moscata in una ciotola.\nStep 2: Stendere la pasta sfoglia su un piano di lavoro e tagliarla in quadrati di circa 10x10 cm.\nStep 3: Distribuire un cucchiaio di ripieno al centro di ogni quadrato e arrotolare a forma di cornetto ripiegando gli angoli verso il centro.\nStep 4: Disporre i cornetti su una teglia rivestita di carta forno, spennellare con uovo sbattuto e cuocere in forno preriscaldato a 200°C per 20-25 minuti fino a doratura.\nStep 5: Sfornare i cornetti e servire ancora tiepidi come antipasto o snack salato."}}, {"id": 10, "title": "Torta rustica", "cat": "Dolci & Dessert", "note": "", "detail": {"ingredienti": ["300g farina 00", "150g ricotta fresca", "100g zucchine", "80g formaggio grattugiato", "1 uovo", "50ml olio extravergine di oliva", "1 cipolla piccola", "Sale e pepe q.b."], "procedimento": "Step 1: Tritare finemente la cipolla e le zucchine, quindi rosolarle in padella con 2 cucchiai d'olio per 5 minuti finché non diventano morbide.\nStep 2: In una ciotola mescolare la ricotta con l'uovo, il formaggio grattugiato, sale e pepe fino a ottenere un composto omogeneo.\nStep 3: Aggiungere le verdure soffritte al composto di ricotta e mescolare bene.\nStep 4: In un'altra ciotola impastare la farina con l'uovo, 3 cucchiai d'olio e un pizzico di sale fino a formare una pasta liscia e compatta.\nStep 5: Stendere metà dell'impasto in una teglia rettangolare da 20x30cm precedentemente unta.\nStep 6: Versare il ripieno sulla base e pareggiare con un cucchiaio.\nStep 7: Stendere l'altra metà dell'impasto e coprire il ripieno, sigillando bene i bordi.\nStep 8: Cuocere in forno a 180°C per 35-40 minuti fino a doratura, quindi lasciar riposare 5 minuti prima di servire."}}, {"id": 11, "title": "Focaccia burrata alici e capperi", "cat": "Pizza & Focaccia", "note": "", "detail": {"ingredienti": ["300g farina di tipo 0", "150ml acqua tiepida", "7g sale fino", "5g lievito di birra fresco", "30ml olio extravergine di oliva", "150g burrata", "80g alici sott'olio", "40g capperi sotto sale"], "procedimento": "Step 1: Sciogliere il lievito in acqua tiepida, aggiungere farina e sale, impastare per 10 minuti fino a ottenere un impasto liscio. Aggiungere gradualmente l'olio e lavorare ancora 5 minuti.\nStep 2: Posizionare l'impasto in una ciotola oleata, coprire con un panno umido e lasciare lievitare 1 ora a temperatura ambiente fino al raddoppio del volume.\nStep 3: Trasferire l'impasto su una teglia rettangolare oleata da 20x30cm, appiattire delicatamente con le dita creando le caratteristiche fossette della focaccia.\nStep 4: Cospargere con un filo di olio extravergine e lasciare riposare altri 30 minuti.\nStep 5: Cuocere in forno preiscaldato a 220°C per 15-18 minuti fino a doratura uniforme.\nStep 6: Sciacquare i capperi sotto sale per eliminare l'eccesso di sale. Sfaldare leggermente le alici.\nStep 7: Estrarre la focaccia dal forno, distribuire la burrata strappata a pezzi sulla superficie, aggiungere alici e capperi.\nStep 8: Finire con un leggero filo di olio extravergine, servire ancora tiepida."}}, {"id": 12, "title": "Cappellacci anatra e salsa alle pere e balsamico", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["250g farina di tipo 00", "3 uova", "150g anatra arrosto (petto)", "80g ricotta fresca", "30g parmigiano reggiano grattugiato", "2 pere mature", "50ml aceto balsamico tradizionale", "40g burro", "Sale e pepe q.b."], "procedimento": "Step 1: Impastare la farina con 2 uova intere e 1 tuorlo, aggiungere un pizzico di sale. Lavorare fino a ottenere un impasto liscio ed elastico, riposare 30 minuti avvolto in film.\nStep 2: Tritare finemente l'anatra arrosto e mescolarla con ricotta, parmigiano, sale e pepe per ottenere il ripieno omogeneo.\nStep 3: Stendere la pasta con il mattarello fino a 2mm di spessore, ricavare quadrati di 8x8cm con la rotella.\nStep 4: Disporre un cucchiaio di ripieno al centro di ogni quadrato, piegare a triangolo e poi unire le due punte per formare il cappellaccio classico.\nStep 5: Pelate le pere, tagliarle a dadini e farle rosolare in un tegame con 20g di burro per 3 minuti, aggiungere l'aceto balsamico e cuocere 2 minuti.\nStep 6: Portare a ebollizione acqua salata, immergere i cappellacci e cuocere per 3-4 minuti dal galleggiamento.\nStep 7: Scolare delicatamente i cappellacci con il cucchiaio forato e trasferirli in una padella con il burro restante, far saltare dolcemente.\nStep 8: Impiattare i cappellacci, versare sopra la salsa alle pere e balsamico, completare con una macinata di pepe nero."}}, {"id": 13, "title": "Lasagne croccanti caprino besciamella al praga e verdure", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["200g pasta per lasagne", "250g caprino fresco", "300ml besciamella", "150g verdure miste (zucchine, melanzane, peperoni)", "80g parmigiano reggiano grattugiato", "30g burro", "Sale e pepe q.b.", "50g pangrattato"], "procedimento": "Step 1: Pulire e tagliare le verdure a dadini piccoli, quindi saltarle in padella con il burro per 5 minuti fino a renderle tenere.\nStep 2: In una ciotola, mescolare il caprino fresco con metà del parmigiano, aggiungere le verdure saltate e condire con sale e pepe.\nStep 3: Preparare uno strato di besciamella sul fondo di una piccola pirofila, quindi alternare strati di pasta, composto di caprino-verdure e besciamella fino a riempire il recipiente.\nStep 4: Cospargere il pangrattato mischiato con il parmigiano rimasto sulla superficie.\nStep 5: Infornare a 200°C per 25-30 minuti fino a ottenere una crosticina dorata e croccante in superficie.\nStep 6: Estrarre dal forno e lasciar riposare 5 minuti prima di servire."}}, {"id": 14, "title": "Gnocchi patate carciofi e fonduta di parmigiano", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["400g patate", "2 carciofi freschi", "100g farina", "1 uovo", "150g parmigiano reggiano", "50ml panna fresca", "30g burro", "Sale e pepe q.b."], "procedimento": "Step 1: Lessare le patate in acqua salata per 20 minuti, scolarle e schiacciarle mentre sono ancora calde.\nStep 2: Pulire i carciofi eliminando le foglie esterne dure, affettarli sottilmente e rosolarli in padella con burro per 8 minuti, salare e pepare.\nStep 3: Impastare le patate schiacciate con l'uovo e la farina fino a ottenere un impasto omogeneo, formare cilindri e tagliare gli gnocchi.\nStep 4: Cuocere gli gnocchi in acqua salata finché non risalgono a galla, lasciarli cuocere altri 2 minuti e scolarli delicatamente.\nStep 5: Grattugiare il parmigiano e scaldarlo in un pentolino con la panna a fuoco basso, mescolando continuamente fino a ottenere una salsa cremosa e omogenea.\nStep 6: Saltare gli gnocchi in padella con i carciofi per 2 minuti, aggiungere la fonduta di parmigiano e amalgamare delicatamente.\nStep 7: Dividere il piatto in due porzioni, guarnire con una macinata di pepe nero e servire immediatamente."}}, {"id": 15, "title": "Spaghetti pomodoro peperoncino cozze", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["320g spaghetti", "400g cozze fresche", "400g pomodori pelati", "2 spicchi aglio", "1 peperoncino rosso fresco", "3 cucchiai olio extravergine di oliva", "Sale e pepe q.b.", "Prezzemolo fresco per guarnire"], "procedimento": "Step 1: Pulire le cozze sotto acqua fredda corrente, eliminando le impurità e il bisso con un coltellino; scartare quelle danneggiate o aperte.\nStep 2: In una padella ampia, fare appassire l'aglio affettato e il peperoncino sminuzzato in olio caldo per 2 minuti, quindi aggiungere i pomodori pelati e un pizzico di sale; lasciare cuocere a fuoco medio per 10 minuti.\nStep 3: Aggiungere le cozze alla salsa di pomodoro, coprire e cuocere per 5-7 minuti finché tutte le cozze non si aprono; scartare eventuali cozze rimaste chiuse.\nStep 4: Portare a ebollizione una pentola d'acqua salata e cuocere gli spaghetti secondo le istruzioni sulla confezione; scolare al dente, conservando un bicchiere di acqua di cottura.\nStep 5: Versare gli spaghetti nella padella con le cozze e il sugo; mescolare delicatamente aggiungendo un po' di acqua di cottura se necessario per mantenerlo cremoso.\nStep 6: Mantecare per 1 minuto a fuoco vivo, aggiustare di sale e pepe, quindi servire in piatti caldi guarnito con prezzemolo fresco."}}, {"id": 16, "title": "Panino crema parmigiano, crema carciofi, nocciole e prosciutto", "cat": "Panini & Piadine", "note": "", "detail": {"ingredienti": ["2 panini ciabatta o rosette", "150g crema di parmigiano reggiano", "200g crema di carciofi", "80g nocciole tostate e tritate", "150g prosciutto di Parma affettato", "50g rucola fresca", "2 cucchiai olio extravergine di oliva", "Sale e pepe q.b."], "procedimento": "Step 1: Tostare leggermente le nocciole in padella a fuoco medio per 2-3 minuti, quindi tritarle grossolanamente e farle raffreddare.\nStep 2: Preparare la crema di parmigiano mescolando 150g di parmigiano reggiano grattugiato con 3 cucchiai di burro morbido fino a ottenere una crema omogenea.\nStep 3: Aprire i panini nel senso della lunghezza e distribuire sulla base la crema di carciofi in strato uniforme.\nStep 4: Aggiungere sopra la crema di parmigiano, quindi disporre il prosciutto di Parma in pieghe eleganti.\nStep 5: Cospargere generosamente con le nocciole tritate e aggiungere un pizzico di pepe nero macinato fresco.\nStep 6: Adagiare la rucola fresca sul prosciutto e drizzare con un filo di olio extravergine di oliva.\nStep 7: Coprire con il coperchio del panino e pressare leggermente per amalgamare i sapori.\nStep 8: Servire subito i panini, eventualmente avvolti in carta da forno per mantenere la forma."}}, {"id": 17, "title": "Panino pat olive stracciatella bresaola e fiori di zucca", "cat": "Panini & Piadine", "note": "", "detail": {"ingredienti": ["2 panini tipo ciabatta (80g ciascuno)", "150g bresaola di qualità", "150g stracciatella di bufala", "80g patè di olive nere", "4 fiori di zucca freschi", "2 cucchiai di olio extravergine di oliva", "Sale e pepe q.b.", "Rucola fresca (una manciata)"], "procedimento": "Step 1: Pulire delicatamente i fiori di zucca, rimuovere gli stami interni con le mani, lavare con acqua fredda e asciugare tamponando con carta assorbente.\nStep 2: Scaldare un cucchiaio di olio extravergine in una padella antiaderente a fuoco medio, saltare i fiori di zucca per 2-3 minuti per lato fino a renderli leggermente croccanti, salare e pepare.\nStep 3: Tagliare i panini a metà in senso orizzontale e tostare leggermente le superfici interne per 1 minuto in padella o nel tostapane.\nStep 4: Spalmare il patè di olive sulla base inferiore di ciascun panino con il dorso di un cucchiaio.\nStep 5: Disporre la bresaola in fette sottili sulla base del panino, poi aggiungere la stracciatella in dollopi generosi.\nStep 6: Posizionare i fiori di zucca saltati sul ripieno e completare con un pizzico di rucola fresca.\nStep 7: Drizzare un filo di olio extravergine sulla parte superiore del panino e chiudere.\nStep 8: Servire subito, ancora tiepido, avvolto in carta da panino se desiderato."}}, {"id": 18, "title": "Panino/ focaccia cicoria ripassata, pecorino romano e mortadella", "cat": "Pizza & Focaccia", "note": "", "detail": {"ingredienti": ["300g farina tipo 0", "150ml acqua tiepida", "7g sale", "3g lievito di birra secco", "15ml olio extravergine di oliva", "300g cicoria ripassata", "150g pecorino romano", "150g mortadella affettata"], "procedimento": "Step 1: Sciogliere il lievito nell'acqua tiepida, aggiungere la farina, il sale e l'olio. Impastare fino a ottenere un composto omogeneo e lasciare riposare 30 minuti coperto.\nStep 2: Stendere l'impasto su una teglia, creare piccole fossette con le dita e lasciar lievitare altri 20 minuti.\nStep 3: Cuocere la focaccia in forno preriscaldato a 220°C per 12-15 minuti fino a doratura.\nStep 4: Nel frattempo, saltare la cicoria in padella con un filo d'olio per 5 minuti, regolando di sale e pepe.\nStep 5: Tagliare la focaccia a metà orizzontalmente.\nStep 6: Distribuire la cicoria ripassata sulla base, aggiungere fette di mortadella e scaglie di pecorino romano.\nStep 7: Coprire con la parte superiore della focaccia.\nStep 8: Servire caldo o a temperatura ambiente."}}, {"id": 19, "title": "Panino burrata alici e puntarelle", "cat": "Panini & Piadine", "note": "", "detail": {"ingredienti": ["2 panini tipo rosetta o michetta, 150g", "200g burrata fresca", "8-10 filetti di alici sotto sale", "200g puntarelle romane", "3 cucchiai di olio extravergine di oliva", "1 limone", "Sale e pepe nero q.b.", "1 spicchio d'aglio"], "procedimento": "Step 1: Pulire le puntarelle eliminando le foglie esterne, lavarle e tagliarle a listarelle. Metterle in acqua fredda per 15 minuti in modo che si arriccino naturalmente.\nStep 2: Sciacquare i filetti di alici sotto acqua corrente fredda per eliminare l'eccesso di sale, asciugarli con carta assorbente e affettarli finemente.\nStep 3: Preparare un'emulsione con 2 cucchiai di olio extravergine, il succo di mezzo limone, uno spicchio d'aglio schiacciato, sale e pepe. Amalgamare bene gli ingredienti.\nStep 4: Scolare le puntarelle e condirle con l'emulsione preparata al passaggio precedente. Mescolare delicatamente.\nStep 5: Affettare i panini a metà e ungere leggermente l'interno con il cucchiaio di olio rimasto.\nStep 6: Disporre la burrata fresca all'interno del panino, aggiungere le puntarelle condite e i filetti di alici sopra.\nStep 7: Chiudere il panino delicatamente e servire subito, ancora caldo, accompagnando con una spremuta di limone fresco."}}, {"id": 20, "title": "Tacos pollo finto fritto, mayonese al chipotle/ coriandolo cipolla caramellata piccante e guacamole", "cat": "Tacos & Street Food", "note": "", "detail": {"ingredienti": ["300g petto di pollo", "100g pangrattato", "2 uova", "100ml maionese", "1 peperoncino chipotle in adobo", "2 cipolle rosse medie", "2 avocado maturo", "1 limone", "30g coriandolo fresco", "Sale e pepe q.b.", "Olio di semi per friggere"], "procedimento": "Step 1: Taglia il petto di pollo in strisce sottili, salalo e pepalo. Prepara tre piatti: uno con farina, uno con uova sbattute e uno con pangrattato. Passa ogni striscia di pollo nei tre piatti in sequenza, premendo delicatamente.\nStep 2: Riscalda l'olio a 170°C in una padella profonda. Friggi le strisce di pollo per 3-4 minuti fino a doratura, poi scola su carta assorbente.\nStep 3: Prepara la maionese al chipotle frullando la maionese con il peperoncino chipotle e succo di limone. Regola di sale.\nStep 4: Affetta le cipolle rosse a fette sottili. Cuocile in una padella con un po' d'olio a fuoco medio per 15-20 minuti, mescolando spesso, fino a caramellizzazione. Aggiungi un pizzico di peperoncino rosso negli ultimi 2 minuti.\nStep 5: Taglia gli avocado a metà, togli il nocciolo e schiaccia la polpa in una ciotola con succo di limone, sale e pepe. Aggiungi coriandolo fresco tritato.\nStep 6: Scalda leggermente le tortillas in una padella per pochi secondi per lato.\nStep 7: Monta i tacos: distribuisci la maionese al chipotle sulla tortilla, aggiungi il pollo fritto, la cipolla caramellata e il guacamole. Completa con altro coriandolo fresco."}}, {"id": 21, "title": "Crocchetta baccala e formaggio tenero di capra", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["250g baccalà già dissalato", "200g patate", "100g formaggio di capra tenero", "1 uovo", "50g pangrattato", "30g farina", "Sale e pepe q.b.", "Olio di semi per friggere"], "procedimento": "Step 1: Lessare le patate in acqua salata per circa 15 minuti fino a renderle tenere, quindi scolarle e farle intiepidire.\nStep 2: Cuocere il baccalà in acqua per 10 minuti, sgocciolarlo bene e sminuzzarlo finemente con una forchetta, eliminando eventuali spine.\nStep 3: Schiacciare le patate ancora tiepide e mescolarle con il baccalà, il formaggio di capra sbriciolato, sale e pepe fino a ottenere un impasto omogeneo.\nStep 4: Formare 6-8 crocchette dalle dimensioni di un uovo e farle riposare in frigorifero per 30 minuti.\nStep 5: Preparare tre piatti: uno con la farina, uno con l'uovo leggermente sbattuto e uno con il pangrattato.\nStep 6: Passare ogni crocchetta prima nella farina, poi nell'uovo e infine nel pangrattato, pressando leggermente.\nStep 7: Scaldare l'olio a 170°C e friggere le crocchette per 3-4 minuti fino a doratura uniforme, girandole a metà cottura.\nStep 8: Scolare su carta assorbente e servire calde."}}, {"id": 22, "title": "Patate fritte tartufo e parmigiano", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["500g patate a pasta gialla", "1 tartufo nero fresco (20g) o 15ml olio di tartufo", "80g parmigiano reggiano", "1 litro olio di arachide per friggere", "10g sale fino", "5g pepe nero macinato fresco", "5g prezzemolo fresco tritato"], "procedimento": "Step 1: Lavare le patate sotto acqua fredda e asciugarle bene con un canovaccio pulito. Tagliarle a bastoncini di circa 0,5cm di spessore e 6-7cm di lunghezza.\nStep 2: Immergere i bastoncini in acqua fredda per 30 minuti per eliminare l'amido in eccesso, poi asciugarli accuratamente con carta assorbente.\nStep 3: Scaldare l'olio a 160°C in una pentola alta e profonda. Tuffare le patate in piccole porzioni per 8-10 minuti fino a quando diventano morbide ma non colorate.\nStep 4: Aumentare la temperatura a 190°C e friggerle nuovamente per 2-3 minuti fino a doratura croccante. Scolarle su carta assorbente e salare immediatamente.\nStep 5: Trasferire le patate in una ciotola. Se usando tartufo fresco, grattugiarlo generosamente; se usando olio, versarne 15ml e mescolare.\nStep 6: Aggiungere il parmigiano reggiano grattugiato a scaglie fini, il pepe nero e il prezzemolo. Mescolare delicatamente per distribuire uniformemente.\nStep 7: Servire immediatamente in piatti caldi, completando con qualche scaglia di tartufo fresco in superficie."}}, {"id": 23, "title": "Cheese burger roll", "cat": "Panini & Piadine", "note": "", "detail": {"ingredienti": ["320g pasta sfoglia", "200g carne macinata di manzo", "100g formaggio cheddar a fette", "1 cipolla piccola", "2 cucchiai di salsa ketchup", "1 uovo", "Sale e pepe q.b.", "30g burro"], "procedimento": "Step 1: Tritare finemente la cipolla e farla rosolare in padella con il burro per 2 minuti, aggiungere la carne macinata e cuocere a fuoco medio per 5-6 minuti, condire con sale e pepe.\nStep 2: Stendere la pasta sfoglia su un piano di lavoro, distribuire la carne cotta uniformemente lasciando 1 cm di bordo, spolverare il formaggio cheddar a pezzetti sopra la carne.\nStep 3: Aggiungere una leggera linea di salsa ketchup lungo la carne, quindi arrotolare la pasta sfoglia su se stessa con movimenti delicati.\nStep 4: Sigillare i bordi del rotolo pressandoli leggermente con le dita inumidite, quindi trasferire su una teglia rivestita di carta forno.\nStep 5: Battere l'uovo e spennellare il rotolo per ottenere una doratura uniforme durante la cottura.\nStep 6: Infornare a 200°C per 20-25 minuti fino a quando il rotolo non risulta dorato in superficie.\nStep 7: Estrarre dal forno, lasciare riposare 3-4 minuti, quindi affettare e servire ancora caldo."}}, {"id": 24, "title": "Cupcake", "cat": "Dolci & Dessert", "note": "", "detail": {"ingredienti": ["100g farina 00", "80g zucchero", "1 uovo", "50ml latte", "40g burro", "1 cucchiaino lievito per dolci", "1 pizzico sale", "50g frosting (burro e zucchero a velo)"], "procedimento": "Step 1: Preriscalda il forno a 180°C e posiziona 6 pirottini in una teglia per muffin.\nStep 2: Sciogli il burro a bagnomaria e mescola con lo zucchero fino a ottenere una crema omogenea.\nStep 3: Aggiungi l'uovo e mescola bene, poi incorpora il latte.\nStep 4: Setaccia la farina con il lievito e il sale, quindi uniscili al composto mescolando delicatamente con una spatola.\nStep 5: Versa l'impasto nei pirottini fino a 2/3 dell'altezza.\nStep 6: Cuoci per 18-20 minuti finché non risultano dorati e uno stuzzicadenti inserito al centro esce asciutto.\nStep 7: Estrai dal forno e lascia raffreddare completamente su una griglia.\nStep 8: Decora ogni cupcake con frosting cremoso creando una piccola cupola sulla superficie."}}, {"id": 25, "title": "Chowder grab", "cat": "Zuppe & Vellutate", "note": "", "detail": {"ingredienti": ["300g polpa di granchio fresco", "2 patate medie", "1 cipolla", "200ml brodo di pesce", "200ml panna da cucina", "50g burro", "Sale e pepe q.b.", "Prezzemolo fresco"], "procedimento": "Step 1: Sbucciare e tagliare le patate a cubetti piccoli. Tritare finemente la cipolla.\nStep 2: Fare rosolare la cipolla tritata nel burro per 3 minuti a fuoco medio, quindi aggiungere le patate a cubetti.\nStep 3: Versare il brodo di pesce e cuocere per 15 minuti fino a quando le patate sono tenere.\nStep 4: Aggiungere la polpa di granchio sbriciolata e mescolare delicatamente per 2 minuti.\nStep 5: Versare la panna da cucina e portare a leggero bollore per altri 3 minuti.\nStep 6: Condire con sale e pepe secondo il gusto e aggiustare la consistenza con brodo se troppo densa.\nStep 7: Servire in ciotole calde, guarnendo con prezzemolo fresco tritato."}}, {"id": 26, "title": "Tapas formaggio di capra con marmellata fragole", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["200g formaggio di capra fresco", "150g marmellata di fragole", "8 fette di pane tostato", "2 cucchiai di miele", "30g noci tritate", "1 rametto di timo fresco", "Sale e pepe q.b.", "1 cucchiaio di olio extravergine d'oliva"], "procedimento": "Step 1: Tostare leggermente le fette di pane in forno a 180°C per 3-4 minuti fino a renderle croccanti.\nStep 2: Spalmare il formaggio di capra fresco su ogni fetta di pane tostato in uno strato uniforme di circa mezzo centimetro.\nStep 3: Aggiungere sopra il formaggio un cucchiaio di marmellata di fragole, distribuidola in modo omogeneo.\nStep 4: Cospargere le noci tritate su ogni tapas e aggiungere un pizzico di sale e pepe.\nStep 5: Drizzare leggermente con olio extravergine d'oliva e posizionare un piccolo rametto di timo fresco al centro.\nStep 6: Completare versando mezza cucchiaino di miele su ogni tapas.\nStep 7: Servire immediatamente a temperatura ambiente su un piatto da portata."}}, {"id": 27, "title": "Jarret du porc", "cat": "Secondi Piatti", "note": "", "detail": {"ingredienti": ["800g stinco di maiale", "2 carote", "2 gambi di sedano", "1 cipolla", "500ml brodo di carne", "2 cucchiai olio extravergine d'oliva", "Sale e pepe q.b.", "2 foglie di alloro"], "procedimento": "Step 1: Asciugare lo stinco di maiale con carta assorbente e condirlo con sale e pepe su tutti i lati.\nStep 2: Scaldare l'olio in una pentola grande a fuoco medio-alto e rosolare lo stinco per 4-5 minuti per lato fino a dorarlo bene.\nStep 3: Pulire le carote, il sedano e la cipolla, tagliarli a pezzi grandi e aggiungerli nella pentola insieme alle foglie di alloro.\nStep 4: Versare il brodo di carne fino a coprire a metà lo stinco, portare a ebollizione, poi coprire con un coperchio.\nStep 5: Ridurre il fuoco a medio-basso e cuocere per 90 minuti circa, girandolo di tanto in tanto.\nStep 6: Verificare la cottura: la carne deve essere molto tenera e quasi cadere dall'osso.\nStep 7: Trasferire lo stinco su un piatto, scolare il brodo e filtrarlo, scartando le verdure.\nStep 8: Servire lo stinco caldo con il brodo ridotto e verdure di contorno."}}, {"id": 28, "title": "Bocconcini di pollo marinati soia e zenzero, finto fritto con mayo al wasabi", "cat": "Secondi Piatti", "note": "", "detail": {"ingredienti": ["400g petto di pollo", "3 cucchiai salsa di soia", "20g zenzero fresco", "2 cucchiai olio di sesamo", "100g pangrattato", "100g maionese", "1 cucchiaio wasabi in polvere", "2 cucchiai acqua"], "procedimento": "Step 1: Tagliare il petto di pollo a bocconcini di circa 3cm. Sbucciare e grattugiare lo zenzero fresco.\nStep 2: Preparare la marinatura mescolando salsa di soia, zenzero grattugiato e olio di sesamo. Immergere i bocconcini di pollo e lasciare riposare in frigo per almeno 30 minuti.\nStep 3: Scolare i bocconcini dalla marinatura e tamponarli con carta assorbente. Passarli nel pangrattato, pressando bene affinché aderisca.\nStep 4: Disporre i bocconcini su una teglia rivestita di carta forno e cuocere in forno a 200°C per 18-20 minuti fino a doratura croccante.\nStep 5: Preparare la mayo al wasabi sciogliendo il wasabi in polvere con l'acqua, quindi amalgamarlo con la maionese.\nStep 6: Estrarre i bocconcini dal forno e lasciarli intiepidire per 2 minuti.\nStep 7: Impiattare i bocconcini caldi e servire con la mayo al wasabi in una ciotola a parte."}}, {"id": 29, "title": "Zuppetta patate vongole cozze e fasolari", "cat": "Zuppe & Vellutate", "note": "", "detail": {"ingredienti": ["300g patate a dadini", "300g vongole veraci", "200g cozze", "150g fasolari", "1 cipolla media tritata", "3 spicchi aglio", "400ml brodo di pesce", "3 cucchiai olio extravergine d'oliva", "Sale e pepe q.b.", "Prezzemolo fresco tritato", "Peperoncino q.b."], "procedimento": "Step 1: Pulire i molluschi sotto acqua fredda corrente, scartando quelli aperti o danneggiati. Lasciarli in ammollo in acqua salata per 30 minuti per eliminare la sabbia.\nStep 2: In una pentola riscaldare l'olio con aglio tritato e cipolla, rosolare brevemente fino a profumo.\nStep 3: Aggiungere le patate a dadini e farle rosolare per 2-3 minuti, mescolando delicatamente.\nStep 4: Versare il brodo di pesce caldo e portare a ebollizione, cuocere le patate per 8-10 minuti fino a quasi ammorbidite.\nStep 5: Aggiungere vongole, cozze e fasolari nella pentola, coprire con un coperchio e cuocere per 5-6 minuti finché tutti i molluschi si aprono.\nStep 6: Scartare i molluschi rimasti chiusi, regolare di sale e pepe, aggiungere il peperoncino secondo il gusto.\nStep 7: Servire la zuppetta ben calda in ciotole profonde, cospargendo con prezzemolo fresco tritato."}}, {"id": 30, "title": "Filetto di maialino sus vid con salsa al mango piccante e insalata di cavolo cappuccio", "cat": "Secondi Piatti", "note": "", "detail": {"ingredienti": ["400g filetto di maiale", "2 mango maturi", "1 peperoncino rosso fresco", "300g cavolo cappuccio rosso", "3 cucchiai olio extravergine di oliva", "2 cucchiai aceto di riso", "Sale e pepe q.b.", "1 lime"], "procedimento": "Step 1: Pulire il filetto di maiale eliminando la membrana esterna, quindi salare e pepare generosamente su entrambi i lati.\nStep 2: Scaldare 2 cucchiai di olio in una padella antiaderente a fuoco medio-alto e rosolare il filetto per 3-4 minuti per lato fino a doratura, quindi cuocere nel forno a 180°C per 8-10 minuti.\nStep 3: Sbucciare i mango, estrarre la polpa e frullarla con il peperoncino piccato finemente, 1 cucchiaio di olio, succo di mezzo lime e un pizzico di sale per ottenere la salsa.\nStep 4: Affettare finemente il cavolo cappuccio, condirlo con aceto di riso, succo di lime rimasto, 1 cucchiaio di olio, sale e pepe, quindi lasciar riposare 5 minuti.\nStep 5: Estrarre il filetto dal forno e farlo riposare 3 minuti, quindi affettarlo.\nStep 6: Impiattare le fette di maiale, guarnire con la salsa al mango e servire con l'insalata di cavolo cappuccio a lato."}}, {"id": 31, "title": "Polenta scamorza acciughe arancia candita", "cat": "Secondi Piatti", "note": "", "detail": {"ingredienti": ["200g polenta", "150g scamorza affumicata", "8 filetti di acciuga sotto sale", "50g arancia candita", "500ml brodo vegetale", "50ml latte", "30g burro", "Sale e pepe q.b."], "procedimento": "Step 1: Riscaldare il brodo vegetale in un pentolino e versarlo lentamente nella polenta mescolando costantemente per evitare grumi, cuocere per 30 minuti girando frequentemente.\nStep 2: Nel frattempo, dissalare i filetti di acciuga in acqua fredda per 10 minuti, asciugarli e tagliarli a pezzetti.\nStep 3: Tagliare la scamorza a dadini e l'arancia candita a piccoli pezzi.\nStep 4: A polenta cotta, aggiungere il burro e il latte, mescolare bene fino a renderla cremosa e regolare di sale e pepe.\nStep 5: Versare la polenta in un piatto fondo, disporre i dadini di scamorza sulla superficie.\nStep 6: Aggiungere i filetti di acciuga e l'arancia candita come tocco finale.\nStep 7: Servire immediatamente mentre la polenta è ancora calda e la scamorza inizia a fondere."}}, {"id": 32, "title": "Crostino nduja e gorgonzola", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["8 fette di pane toscano", "80g 'nduja calabrese", "60g gorgonzola dolce", "30g burro", "1 cucchiaio di miele", "1 pizzico di pepe nero", "2 noci sgusciate", "1 rametto di rosmarino fresco"], "procedimento": "Step 1: Tostare leggermente le fette di pane in forno a 200°C per 2-3 minuti fino a renderle croccanti ai bordi ma ancora morbide al centro.\nStep 2: Spalmare la 'nduja direttamente sui crostini ancora caldi, usando circa 10g per fetta, aiutandosi con un coltello.\nStep 3: Aggiungere sopra la 'nduja una generosa porzione di gorgonzola (circa 8g per crostino), che si ammorbidirà al contatto con il pane caldo.\nStep 4: Tritare finemente le noci e cospargerne un pizzico su ogni crostino.\nStep 5: Versare poche gocce di miele su ogni crostino per bilanciare la piccantezza della 'nduja con la dolcezza.\nStep 6: Grattugiare un pizzico di pepe nero fresco su ogni crostino.\nStep 7: Passare il rametto di rosmarino sulla fiamma e posizionarlo sopra i crostini per aromatizzarli.\nStep 8: Servire subito, ancora caldi, su un tagliere di legno."}}, {"id": 33, "title": "Bun pulled pork, maionese, mela verde, radicchio", "cat": "Panini & Piadine", "note": "", "detail": {"ingredienti": ["500g spalla di maiale", "2 panini morbidi (bun)", "100g maionese", "1 mela verde Granny Smith", "100g radicchio rosso", "2 cucchiai aceto di mele", "1 cucchiaio zucchero di canna", "sale e pepe q.b."], "procedimento": "Step 1: Cuocere la spalla di maiale in pentola a pressione con acqua, sale e pepe per 60 minuti fino a renderla molto tenera e facilmente sfilacciabile.\nStep 2: Scolare il maiale e sfilacciarlo con due forchette, condire con aceto di mele, zucchero di canna, sale e pepe, mescolare bene.\nStep 3: Tagliare la mela verde a julienne sottile e il radicchio a strisce, condire con un pizzico di sale per insaporire.\nStep 4: Tostare leggermente i panini nel tostapane o in padella per renderli croccanti esternamente.\nStep 5: Spalmare la maionese su entrambe le metà dei panini.\nStep 6: Disporre il pulled pork caldo sui panini, aggiungere il radicchio e la mela verde.\nStep 7: Chiudere i bun e servire immediatamente mentre il maiale è ancora caldo."}}, {"id": 34, "title": "Spaghetti crema di pistacchio con tartare di tonno marinato lime e menta", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["160g spaghetti", "80g pistacchio sgusciato", "200g tonno rosso fresco", "1 lime", "10 foglie di menta fresca", "100ml panna fresca", "30g burro", "Sale e pepe q.b."], "procedimento": "Step 1: Tritare finemente i pistacchi e farli tostare leggermente in padella a fuoco basso per 2 minuti, quindi versarli in un frullatore con la panna e frullare fino a ottenere una crema omogenea e vellutata.\nStep 2: Tagliare il tonno fresco a dadini regolari di circa 1cm, trasferirlo in una ciotola e condirlo con il succo e la zest di mezzo lime, sale, pepe e metà della menta tritata finemente.\nStep 3: Portare a ebollizione una pentola d'acqua salata e cuocere gli spaghetti al dente secondo i tempi indicati sulla confezione.\nStep 4: In una padella large, stemperare il burro a fuoco medio e aggiungere la crema di pistacchio, mantenendola tiepida e omogenea senza farla bollire.\nStep 5: Scolare la pasta conservando un bicchiere d'acqua di cottura, versarla nella padella con la crema di pistacchio e mantecare aggiungendo l'acqua di cottura per raggiungere la consistenza desiderata.\nStep 6: Distribuire gli spaghetti nei piatti, adagiare il tartare di tonno marinato al centro, completare con foglie di menta fresca e una spolverata di pistacchio tritato."}}, {"id": 35, "title": "Zuppetta di fragole cremoso al pistacchio croccante al pistacchio e financiere al pistacchio", "cat": "Dolci & Dessert", "note": "", "detail": {"ingredienti": ["250g fragole fresche", "50g pistacchio sgusciato", "100ml panna fresca", "40g zucchero", "20g burro", "1 uovo", "30g farina", "1 cucchiaio miele"], "procedimento": "Step 1: Pulire le fragole, tagliarle a metà e farle riposare con 20g di zucchero per 30 minuti affinché rilascino il loro succo.\nStep 2: Preparare la crema al pistacchio: tritare finemente 30g di pistacchio, mescolare con panna fresca, 10g di zucchero e miele, quindi frullare fino a ottenere una crema liscia.\nStep 3: Preparare i financier al pistacchio: mescolare 20g di farina, 10g di pistacchio tritato, l'uovo, il burro sciolto e 10g di zucchero; versare in piccoli stampi e cuocere a 180°C per 12 minuti.\nStep 4: Tritare grossolanamente i restanti 20g di pistacchio e tostarli in padella asciutta per 3 minuti fino a renderli croccanti.\nStep 5: Filtrare il succo delle fragole e riscaldarlo dolcemente, poi versarlo nelle ciotole insieme alle fragole.\nStep 6: Aggiungere la crema al pistacchio nelle ciotole formando una nuvola al centro della zuppetta.\nStep 7: Posizionare il financier ancora tiepido accanto alla crema.\nStep 8: Completare il piatto cospargendo il pistacchio croccante toastato in superficie e servire subito."}}, {"id": 36, "title": "Schiacciata scarola ripassata salamella e mayonese alla paprika", "cat": "Pizza & Focaccia", "note": "", "detail": {"ingredienti": ["500g scarola fresca", "200g pasta sfoglia", "150g salamella italiana", "100g maionese", "1 cucchiaio di paprika dolce", "2 spicchi d'aglio", "Sale e pepe q.b.", "2 cucchiai di olio d'oliva"], "procedimento": "Step 1: Pulire la scarola eliminando le parti esterne danneggiate, lavarla e tagliarla grossolanamente. Lessarla in acqua salata per 8 minuti, scolarla bene e farla asciugare su carta assorbente.\nStep 2: Preparare la maionese alla paprika mescolando i 100g di maionese con la paprika dolce e un pizzico di sale.\nStep 3: In una padella con olio d'oliva, rosolare l'aglio tagliato sottile, aggiungere la salamella sbriciolata e farla cuocere per 3-4 minuti a fuoco medio.\nStep 4: Aggiungere la scarola lessata alla salamella, mescolare bene e rosolare per 2-3 minuti. Condire con sale e pepe.\nStep 5: Stendere la pasta sfoglia su carta da forno, distribuire il ripieno di scarola e salamella sulla metà, aggiungere cucchiaiate di maionese alla paprika.\nStep 6: Piegare la sfoglia a metà e sigillare i bordi pressando con le dita. Cuocere in forno preriscaldato a 200°C per 20 minuti fino a doratura.\nStep 7: Estrarre dal forno, lasciar riposare 2 minuti e tagliare in 2 porzioni."}}, {"id": 37, "title": "Risotto asiago e speck", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["160g riso Carnaroli", "80g speck affumicato", "100g Asiago DOP", "1/2 cipolla bianca", "500ml brodo di carne", "100ml vino bianco secco", "40g burro", "Sale e pepe q.b."], "procedimento": "Step 1: Affettare lo speck e tagliarlo a striscioline, quindi rosolare in una padella ampia per 2-3 minuti fino a renderlo croccante. Trasferire su un piatto.\nStep 2: Nello stesso tegame aggiungere il burro, tritare finemente la cipolla e farla rosolare per 2 minuti fino a renderla trasparente.\nStep 3: Aggiungere il riso e tostarlo per 1-2 minuti, mescolando costantemente, quindi sfumare con il vino bianco.\nStep 4: Riscaldare il brodo in un pentolino e versarlo nel riso un mestolo alla volta, mescolando frequentemente e aspettando che ogni mestolo si assorba prima di aggiungerne uno nuovo (circa 18-20 minuti totali).\nStep 5: Quando il riso è quasi cotto e cremoso, aggiungere il burro e l'Asiago grattugiato, mantecare bene per 1 minuto.\nStep 6: Aggiungere lo speck croccante e mescolare delicatamente, assaggiare e correggere di sale e pepe.\nStep 7: Servire subito il risotto in piatti caldi, aggiungendo una grattugia di Asiago fresco in superficie."}}, {"id": 38, "title": "Panino mozzarella carciofi pomodori secchi gamberi e valeriana", "cat": "Panini & Piadine", "note": "", "detail": {"ingredienti": ["2 panini morbidi da 100g l'uno", "150g mozzarella di bufala", "150g gamberi freschi", "80g carciofi sott'olio", "60g pomodori secchi sott'olio", "60g valeriana fresca", "2 cucchiai di maionese", "Sale e pepe q.b."], "procedimento": "Step 1: Pulire i gamberi eliminando il carapace e l'intestino, lavarli e asciugarli con carta assorbente.\nStep 2: Scaldare un'ampia padella antiaderente a fuoco medio-alto, rosolare i gamberi per 2-3 minuti per lato condendoli con sale e pepe fino a quando non diventano rosa intenso.\nStep 3: Tagliare i panini a metà orizzontalmente e tostare leggermente i lati interni per 1 minuto circa.\nStep 4: Spalmare un cucchiaio di maionese su ciascuna metà inferiore dei panini.\nStep 5: Distribuire la valeriana fresca sulla maionese, seguita dai carciofi tagliati a pezzetti.\nStep 6: Aggiungere i pomodori secchi tagliati a strisce e adagiare i gamberi ancora caldi.\nStep 7: Posizionare la mozzarella di bufala a fette sopra i gamberi.\nStep 8: Chiudere i panini con la metà superiore e servire subito mentre il calore della mozzarella consente una leggera fusione."}}, {"id": 39, "title": "Pizza bianca stracciatella puntarelle e acciughe", "cat": "Pizza & Focaccia", "note": "", "detail": {"ingredienti": ["300g farina tipo 00", "150ml acqua tiepida", "5g lievito di birra secco", "5g sale", "250g stracciatella di bufala", "150g puntarelle", "6 filetti di acciuga sotto sale", "3 cucchiai olio extravergine d'oliva"], "procedimento": "Step 1: Sciogliere il lievito in acqua tiepida, unire la farina e il sale, impastare per 10 minuti fino a ottenere un impasto liscio e elastico.\nStep 2: Lasciar lievitare l'impasto coperto per 2 ore a temperatura ambiente fino a raddoppio del volume.\nStep 3: Stendere l'impasto su una teglia rettangolare leggermente oleata, creare una pizza spessa circa 1 cm.\nStep 4: Cuocere in forno preriscaldato a 250°C per 10-12 minuti finché la base non risulta dorata e croccante.\nStep 5: Estrarre la pizza dal forno e condire subito con stracciatella distribuita a mucchietti, acciughe tagliate a pezzetti e puntarelle crude tagliate grossolanamente.\nStep 6: Drizzare con olio extravergine d'oliva e una macinata di pepe nero.\nStep 7: Servire immediatamente ancora tiepida."}}, {"id": 40, "title": "Pizza bianca pecorino grattugiato mortadella e broccolo ripassato", "cat": "Pizza & Focaccia", "note": "", "detail": {"ingredienti": ["500g farina di tipo 0", "300ml acqua tiepida", "7g lievito di birra secco", "10g sale fino", "15ml olio extravergine di oliva", "150g mortadella affettata", "100g pecorino romano grattugiato", "300g broccolo ripassato in padella con aglio"], "procedimento": "Step 1: Sciogliere il lievito in acqua tiepida, aggiungere farina e sale, impastare per 10 minuti fino a ottenere un composto omogeneo. Incorporare l'olio e continuare a lavorare per 5 minuti.\nStep 2: Dividere l'impasto in due palle, metterle in ciotola oleata, coprire con un panno umido e far lievitare 2 ore a temperatura ambiente.\nStep 3: Preriscaldare il forno a 250°C. Stendere ogni palla di impasto su carta da forno, creando due dischi da pizza bianca (senza pomodoro).\nStep 4: Distribuire la mortadella a pezzetti su tutta la superficie delle pizze.\nStep 5: Aggiungere il broccolo ripassato in modo uniforme, cospargendo infine il pecorino romano grattugiato.\nStep 6: Cuocere in forno per 12-15 minuti fino a doratura della base e formazione di bollicine sulla superficie.\nStep 7: Togliere dal forno, lasciare riposare 2 minuti e servire caldo."}}, {"id": 41, "title": "Pizza bianca brie/ stracchino carciofini e prosciutto cotto", "cat": "Pizza & Focaccia", "note": "", "detail": {"ingredienti": ["500g farina tipo 00", "300ml acqua tiepida", "7g lievito di birra secco", "10g sale fino", "15ml olio extravergine d'oliva", "200g brie o stracchino", "200g carciofini sott'olio", "150g prosciutto cotto"], "procedimento": "Step 1: Sciogliere il lievito in acqua tiepida, aggiungere farina e sale, impastare fino a ottenere un impasto liscio e elastico.\nStep 2: Aggiungere l'olio all'impasto e continuare a lavorare per 5 minuti, poi lasciar lievitare coperto per 2 ore fino al raddoppio del volume.\nStep 3: Stendere l'impasto su una teglia rettangolare, condire con un filo d'olio e far lievitare altri 30 minuti.\nStep 4: Tappezzare la base con il brie o stracchino sbriciolato in piccoli pezzi, distribuire i carciofini ben scolati e il prosciutto cotto a pezzi irregolari.\nStep 5: Infornare a 220°C per 12-15 minuti fino a quando la pizza risulta dorata e il formaggio fuso.\nStep 6: Sfornare, aggiustare di sale e pepe, un filo d'olio a crudo, e servire calda."}}, {"id": 42, "title": "Torta castagne ricotta coulis di cachi", "cat": "Dolci & Dessert", "note": "", "detail": {"ingredienti": ["150g farina di castagne", "200g ricotta fresca", "80g zucchero", "2 uova", "50ml latte", "30g burro fuso", "1 bustina lievito per dolci", "3 cachi maturi"], "procedimento": "Step 1: Sbattere le uova con lo zucchero fino a ottenere un composto spumoso e chiaro.\nStep 2: Incorporare delicatamente la ricotta setacciata, il latte e il burro fuso mescolando con movimenti dal basso verso l'alto.\nStep 3: Unire la farina di castagne e il lievito setacciati insieme, amalgamando il tutto con cura.\nStep 4: Versare l'impasto in uno stampo imburrato e infarinato da 18cm, livellandolo con una spatola.\nStep 5: Cuocere in forno preriscaldato a 180°C per 25-30 minuti, finché uno stuzzicadenti inserito esce pulito.\nStep 6: Far raffreddare la torta, quindi toglierla dallo stampo e metterla su un piatto.\nStep 7: Frullare i cachi con 2 cucchiai di acqua fino a ottenere un coulis liscio e omogeneo.\nStep 8: Servire la torta tiepida o a temperatura ambiente con il coulis di cachi colato sopra o a lato."}}, {"id": 43, "title": "Crema di carciofi, fonduta di parmigiano e gamberi rossi", "cat": "Zuppe & Vellutate", "note": "", "detail": {"ingredienti": ["4 carciofi romani", "200g parmigiano reggiano grattugiato", "100ml panna fresca", "8 gamberi rossi medi", "50ml vino bianco secco", "2 spicchi aglio", "Sale e pepe q.b.", "30g burro"], "procedimento": "Step 1: Pulire i carciofi eliminando le foglie esterne dure, tagliare a metà e rimuovere la barba interna. Affettarli sottilmente e immergere in acqua con limone.\nStep 2: Rosolare l'aglio in una pentola con 20g di burro, aggiungere i carciofi sgocciolati e cuocere a fuoco medio per 10 minuti, sfumando con vino bianco. Aggiungere 200ml di acqua e proseguire la cottura per 15 minuti fino a renderli molto teneri.\nStep 3: Frullare i carciofi con la loro acqua di cottura fino a ottenere una crema liscia e omogenea. Passare al setaccio se necessario. Regolare di sale e pepe.\nStep 4: In un'altra pentola, scaldare a fuoco basso la panna con il parmigiano grattugiato e 10g di burro, mescolando costantemente fino a sciogliere completamente il formaggio. Ottenere una fonduta cremosa.\nStep 5: Pulire i gamberi e cuocerli in padella con poco burro per 2-3 minuti per lato a fuoco vivo, salare e pepare.\nStep 6: Impiattare la crema di carciofi al centro del piatto, versare la fonduta di parmigiano sopra e completare con i gamberi rossi."}}, {"id": 44, "title": "Tortelli con farcia cacio e pepe, crema di pere, pecorino e aceto balsamico", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["200g farina tipo 00", "2 uova", "150g pecorino romano", "50g burro", "300g pere mature", "30ml aceto balsamico tradizionale", "Sale e pepe nero q.b.", "100ml panna fresca"], "procedimento": "Step 1: Impasta la farina con le uova e un pizzico di sale fino a ottenere un impasto liscio e omogeneo. Riposa per 30 minuti avvolto nella pellicola.\nStep 2: Prepara la farcia grattugiando finemente il pecorino romano e mescolando con 25g di burro, sale e pepe nero macinato al momento.\nStep 3: Stendi l'impasto con il mattarello fino a 2mm di spessore. Ricava 12 dischi con un coppapasta da 8cm. Riempi ogni disco con un cucchiaino di farcia, chiudi a mezzaluna e sigilla i bordi.\nStep 4: Taglia le pere a dadini piccoli e cuocili in padella con il burro rimanente per 8 minuti a fuoco medio, aggiungendo infine la panna e l'aceto balsamico. Cuoci ancora 2 minuti fino a ottenere una crema densa.\nStep 5: Cuoci i tortelli in acqua salata bollente finché non salgono a galla, poi ancora 2 minuti.\nStep 6: Manteca i tortelli nella crema di pere, impiatta distribuendo la salsa e completando con scaglie di pecorino fresco e qualche goccia di balsamico."}}, {"id": 45, "title": "Tartare di salmone con cipollotto caramellato su stracciatella di buratta e sale/ olio al tartufo", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["250g salmone fresco di prima qualità", "2 cipollotti", "30g burro", "200g buratta", "15ml olio extravergine di oliva", "3g tartufo nero fresco grattugiato", "sale marino fino", "pepe nero macinato fresco"], "procedimento": "Step 1: Tagliare il salmone a dadini regolari di 5mm, riporlo in ciotola con ghiaccio e conservare in frigo fino al momento di servire.\nStep 2: Pulire i cipollotti, tagliarli in rondelle spesse 1cm e rosolarli a fuoco dolce in padella con 20g di burro per 12 minuti fino a caramellizzazione dorata.\nStep 3: Preparare l'olio al tartufo emulsionando in una ciotola l'olio extravergine con il tartufo grattugiato e un pizzico di sale marino.\nStep 4: Strapazzare la buratta con le mani direttamente nei piatti, creando una base irregolare.\nStep 5: Comporre il piatto distribuendo la tartare di salmone sopra la stracciatella, aggiungere i cipollotti caramellizzati.\nStep 6: Condire con sale marino, pepe nero e versare l'olio al tartufo intorno al piatto.\nStep 7: Decorare con una grattugia finale di tartufo nero e foglioline di cipollotto fresco."}}, {"id": 46, "title": "Paccheri fritti con ripieno di stracciatella/burrata alici serviti con salsa di pomodoro", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["200g paccheri", "250g stracciatella di bufala", "8 filetti di alici sott'olio", "400g pomodori pelati", "2 spicchi d'aglio", "100ml olio di oliva extravergine", "sale e pepe q.b.", "origano secco q.b."], "procedimento": "Step 1: Preparare la salsa di pomodoro: soffriggere uno spicchio d'aglio in 50ml di olio, aggiungere i pomodori pelati, sale, pepe e origano, cuocere a fuoco medio per 15 minuti.\nStep 2: Tritare finemente 4 filetti di alici e mescolarli delicatamente con la stracciatella in una ciotola, aggiustare di sale e pepe.\nStep 3: Cuocere i paccheri in acqua salata per 8 minuti, fino a renderli al dente, scolarli e farli raffreddare leggermente su un piatto.\nStep 4: Farcire ogni pacchero con un cucchiaio di ripieno di stracciatella e alici, inserendo mezzo filetto di alicia all'interno.\nStep 5: Scaldaré l'olio rimanente in una padella a fuoco medio-alto, disporre i paccheri farciti e friggerli 2 minuti per lato fino a dorare leggermente.\nStep 6: Disporre i paccheri fritti nel piatto, versare intorno la salsa di pomodoro calda e servire immediatamente."}}, {"id": 47, "title": "Spaghetti in carrozza (spaghetti coppati e fritti) con acciughe e salsa di pomodoro", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["200g spaghetti", "4 filetti di acciughe sotto sale", "400g polpa di pomodoro", "2 uova", "100g pangrattato", "50g parmigiano reggiano grattugiato", "1 litro olio di semi per friggere", "Sale e pepe q.b."], "procedimento": "Step 1: Cuocere gli spaghetti in abbondante acqua salata fino a cottura al dente, quindi scolarli e farli raffreddare su un vassoio.\nStep 2: Preparare la salsa di pomodoro rossolandola a fuoco medio in una padella per 10 minuti, aggiungendo le acciughe snocciolate e tritamente fino a farle sciogliere completamente.\nStep 3: Disporre gli spaghetti freddi in nidi compatti e appiattiti, creando forme rettangolari di circa 8x6 cm e spessore di 2 cm.\nStep 4: Preparare una stazione di panatura: sbattere le uova in una ciotola, mescolare pangrattato e parmigiano in un'altra ciotola.\nStep 5: Passare ogni nido di spaghetti prima nell'uovo e poi nel pangrattato, pressando leggermente per far aderire bene il pangrattato.\nStep 6: Scaldare l'olio a 170°C in una padella profonda e friggere i nidi di spaghetti per 2-3 minuti per lato fino a doratura croccante.\nStep 7: Scolare gli spaghetti fritti su carta assorbente e salare leggermente.\nStep 8: Disporre i nidi fritti nel piatto, condire con la salsa di pomodoro e acciughe calda, servire immediatamente."}}, {"id": 48, "title": "Financiere/ biscuit pistacchio, cremoso maracuja e pera candita", "cat": "Dolci & Dessert", "note": "", "detail": {"ingredienti": ["60g farina di mandorle", "40g pistacchio tritato finemente", "2 uova", "50g zucchero", "30g burro fuso", "100ml polpa di maracuja", "50ml panna fresca", "80g pera candita tagliata a dadini"], "procedimento": "Step 1: Montare gli albumi a neve ferma, aggiungere gradualmente lo zucchero e i tuorli uno per uno, continuando a montare fino a ottenere una massa soffice e piumosa.\nStep 2: Setacciare la farina di mandorle con il pistacchio tritato e incorporare delicatamente al composto insieme al burro fuso mescolando dal basso verso l'alto.\nStep 3: Versare in due stampini rettangolari imburrati e infarinati, aggiungere alcuni dadini di pera candita sulla superficie e infornare a 180°C per 12-14 minuti.\nStep 4: Nel frattempo, riscaldare la polpa di maracuja a bagnomaria, aggiungere la panna fresca e mescolare fino a ottenere una crema omogenea e luminosa.\nStep 5: Estrarre i biscuit dal forno quando sono dorati e lasciar raffreddare leggermente, quindi far riposare il cremoso di maracuja in frigorifero per 15 minuti.\nStep 6: Disporre il biscuit al pistacchio nel piatto, distribuire il cremoso di maracuja attorno e completare con pezzi di pera candita a decorazione."}}, {"id": 49, "title": "Risotto cacio e pepe con carciofo croccante", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["160g riso Carnaroli", "500ml brodo vegetale", "100g pecorino romano grattugiato", "2 carciofi romaneschi", "40g burro", "1 cipolla piccola", "10g pepe nero in grani", "sale e olio EVO"], "procedimento": "Step 1: Scaldare il brodo vegetale in un pentolino. Nel frattempo, pulire i carciofi eliminando le foglie esterne dure, tagliare a fettine sottili e farle rosolare in padella con olio EVO fino a renderle croccanti e dorate, salare e tenere da parte.\nStep 2: Tritare finemente la cipolla e farla appassire in una pentola con il burro per 2 minuti a fuoco medio.\nStep 3: Aggiungere il riso e tostarlo per 1-2 minuti, mescolando continuamente fino a farlo diventare trasparente ai bordi.\nStep 4: Iniziare ad aggiungere il brodo caldo mestolo per mestolo, aspettando che il riso assorba il liquido prima di aggiungerne altro, per circa 18-20 minuti.\nStep 5: Nel frattempo, macinare grossolanamente il pepe nero in un mortaio.\nStep 6: Quando il riso è cremoso al dente, spegnere il fuoco e aggiungere il pecorino grattugiato e il pepe macinato, mantecare vigorosamente per 30 secondi.\nStep 7: Distribuire il risotto nei piatti e decorare con i carciofi croccanti in superficie e una macinata di pepe fresco."}}, {"id": 50, "title": "Pizza squaquerone fiori di zucca e alici", "cat": "Pizza & Focaccia", "note": "", "detail": {"ingredienti": ["500g farina di tipo 0", "300ml acqua", "10g sale", "5g lievito di birra fresco", "200g squaquerone", "8 fiori di zucca freschi", "150g alici sotto sale", "2 cucchiai olio extravergine di oliva"], "procedimento": "Step 1: Sciogliere il lievito in acqua tiepida, aggiungere farina e sale, impastare per 10 minuti fino a ottenere un composto omogeneo e elastico.\nStep 2: Lasciar lievitare l'impasto coperto a temperatura ambiente per 2 ore fino al raddoppio del volume.\nStep 3: Riprendere l'impasto, dividerlo in 2 porzioni e stenderle su carta forno formando due dischi di circa 30cm di diametro.\nStep 4: Distribuire lo squaquerone uniformemente su ogni disco di pizza, lasciando mezzo centimetro di bordo.\nStep 5: Posizionare i fiori di zucca sulla superficie in modo omogeneo e aggiungere le alici dissalate e diliscate, distribuite a raggiera.\nStep 6: Cuocere in forno preriscaldato a 280°C per 12-15 minuti fino a doratura della base.\nStep 7: Estrarre dal forno e completare con un filo di olio extravergine di oliva a crudo.\nStep 8: Servire immediatamente mentre la pizza è ancora calda."}}, {"id": 51, "title": "Fondo di carciofo con baccala mantecato su crema di carciofi e parmigiano", "cat": "Zuppe & Vellutate", "note": "", "detail": {"ingredienti": ["4 carciofi grandi", "300g baccalà desalato", "200ml panna fresca", "100g parmigiano reggiano grattugiato", "1 limone", "50ml olio extravergine di oliva", "Sale e pepe q.b.", "Noce moscata q.b."], "procedimento": "Step 1: Pulire i carciofi eliminando le foglie esterne dure, tagliare a metà e scavare il cuore per ricavare i fondi; lessare i fondi in acqua con succo di limone per 20 minuti fino a renderli teneri.\nStep 2: Mentre cuociono i carciofi, desquamare il baccalà e lessarlo in acqua non salata per 15 minuti, quindi sfilarlo delicatamente con una forchetta rimuovendo eventuali spine.\nStep 3: Estrarre i carciofi lessati, reservarne 2 fondi per la presentazione e frullare il resto con panna, parmigiano, sale, pepe e noce moscata fino a ottenere una crema vellutata.\nStep 4: Mantecate il baccalà in una ciotola aggiungendo gradualmente olio extravergine e un filo di acqua di cottura, lavorando con una frusta fino a renderlo cremoso e spumoso.\nStep 5: Disporre la crema di carciofi al centro di piatti caldi, posizionare un fondo di carciofo sopra, coronarlo generosamente con il baccalà mantecato.\nStep 6: Completare il piatto con il secondo fondo di carciofo, spolverare di parmigiano e drizzare con olio extravergine; servire immediatamente."}}, {"id": 52, "title": "Mezze maniche pancetta croccante, fave e crema di pecorino", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["200g mezze maniche", "150g pancetta affumicata a dadini", "300g fave fresche sgusciate", "150g pecorino romano", "100ml panna fresca", "1 cipollotto", "Sale e pepe nero q.b.", "2 cucchiai olio extravergine"], "procedimento": "Step 1: Portare a ebollizione una pentola d'acqua salata e cuocere le fave per 3-4 minuti, poi scolarle e trasferirle in acqua fredda. Sgusciarle dalla pellicina esterna.\nStep 2: In una padella large, rosolare la pancetta a dadini a fuoco medio-alto fino a renderla croccante, circa 5-6 minuti. Scolare su carta assorbente.\nStep 3: Nella stessa padella, rosolare il cipollotto affettato finemente per 2 minuti, quindi aggiungere le fave e saltare per 3 minuti a fuoco medio.\nStep 4: Cuocere la pasta in acqua salata secondo i tempi indicati sulla confezione, scolarla al dente mantenendo un bicchiere di acqua di cottura.\nStep 5: Mescolare il pecorino romano grattugiato con la panna fresca fino a ottenere una crema omogenea, salare e pepare leggermente.\nStep 6: Trasferire la pasta nella padella con le fave, aggiungere la crema di pecorino e mescolare bene, aggiungendo acqua di cottura se necessario per mantenerla cremosa.\nStep 7: Riportare la pancetta croccante nella padella e mescolare delicatamente.\nStep 8: Impiattare e finire con un filo d'olio extravergine, pepe nero macinato al momento e ulteriore pecorino grattugiato."}}, {"id": 53, "title": "Carpaccio ricciola riccio e wasabi fresco", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["300g filetto di ricciola fresco e sfilettato", "80g riccio di mare fresco", "30g wasabi fresco grattugiato", "3 cucchiai di olio extravergine di oliva", "1 limone", "Sale marino fino", "Pepe nero macinato", "Microgreens per guarnire"], "procedimento": "Step 1: Pulire accuratamente il filetto di ricciola con un coltello ben affilato, eliminando completamente la pelle e le piccole lische rimaste.\nStep 2: Affettare il filetto di ricciola in fette sottilissime (circa 3-4mm) usando un coltello molto tagliente o una mandolina, disponendo le fette su due piatti freddi.\nStep 3: Spremere il limone in una ciotolina e aggiungere l'olio extravergine di oliva, sale marino e pepe nero, creando una emulsione leggera.\nStep 4: Distribuire delicatamente il riccio di mare sopra le fette di ricciola, cercando di mantenerne l'integrità.\nStep 5: Versare la vinaigrette limone-olio intorno al carpaccio con movimenti circolari.\nStep 6: Posizionare piccole porzioni di wasabi fresco grattugiato in vari punti del piatto come contrasto piccante.\nStep 7: Completare la presentazione con una manciata di microgreens e servire immediatamente a temperatura ambiente."}}, {"id": 54, "title": "Aglio olio peperoncino burrata e tartare di gambero rosso", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["320g spaghetti di semola", "120g gamberi rossi freschi", "200g burrata fresca", "100ml olio extravergine di oliva", "3 spicchi d'aglio", "2 peperoncini rossi freschi", "Sale fino q.b.", "Prezzemolo fresco q.b."], "procedimento": "Step 1: Pulire i gamberi rossi eliminando il carapace e l'intestino, quindi tritarli finemente con un coltello affilato. Condire la tartare con 2 cucchiai di olio extravergine, sale e pepe; lasciar riposare in frigorifero per 15 minuti.\nStep 2: Affettare sottilmente l'aglio e tagliare i peperoncini in anelli rimuovendo i semi. Riscaldare l'olio in un tegame a fuoco medio-basso per 3-4 minuti, aggiungere aglio e peperoncino e far infondere senza far bruciare.\nStep 3: Portare a ebollizione l'acqua salata e cuocere gli spaghetti al dente secondo i tempi indicati sulla confezione, circa 9-10 minuti.\nStep 4: Scolare la pasta mantenendo un bicchiere di acqua di cottura. Versarla direttamente nel tegame con l'olio, aglio e peperoncino, mescolando bene e aggiungendo un po' di acqua di cottura per renderla cremosa.\nStep 5: Distribuire gli spaghetti in due piatti warmed, posizionare al centro un quenelle di burrata fresca per ogni piatto.\nStep 6: Adagiare delicatamente la tartare di gambero rosso sopra la burrata, cosparger di prezzemolo fresco tritato e servire immediatamente."}}, {"id": 55, "title": "Panna cotta alle acciughe con pane al burro", "cat": "Dolci & Dessert", "note": "", "detail": {"ingredienti": ["200ml panna fresca", "100ml brodo di pesce", "50g acciughe sotto sale", "2g gelatina in fogli", "50g burro", "4 fette di pane toscano", "Sale e pepe q.b.", "Prezzemolo fresco q.b."], "procedimento": "Step 1: Ammorbidire la gelatina in fogli in acqua fredda per 5 minuti, quindi strizzarla bene.\nStep 2: Sciacquare le acciughe sotto l'acqua corrente per eliminare il sale, quindi tritarle finemente.\nStep 3: Scaldare il brodo di pesce senza farlo bollire, aggiungere la gelatina strizzata e scioglierla completamente, quindi incorporare le acciughe tritate.\nStep 4: In una ciotola, montare leggermente la panna fresca con un cucchiaio, quindi unirla delicatamente al composto di brodo, acciughe e gelatina.\nStep 5: Versare il composto in due bicchieri o coppette e mettere in frigorifero per almeno 4 ore fino a completa solidificazione.\nStep 6: Toastare le fette di pane in forno a 180°C per 5 minuti.\nStep 7: Spalmare il burro morbido su ogni fetta di pane tostato e cospargere di prezzemolo fresco tritato.\nStep 8: Estrarre la panna cotta dal frigorifero e servire accompagnando con il pane al burro."}}, {"id": 56, "title": "Cacio e pepe su bisque di asti
