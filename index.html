ce", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["160g spaghetti o tonnarelli", "1 astice da 500g", "200ml panna fresca", "100ml vino bianco secco", "80g pecorino romano grattugiato", "15g pepe nero in grani", "1 scalogno", "sale e burro q.b."], "procedimento": "Step 1: Lessare l'astice in acqua salata per 15 minuti, quindi estrarre la polpa dal corpo e dalle chele. Tritare il guscio e rosolare in una pentola con burro e scalogno tritato.\nStep 2: Sfumare con vino bianco, aggiungere la panna e far cuocere per 10 minuti. Frullare il composto e passarlo al setaccio per ottenere una bisque liscia e cremosa.\nStep 3: Macinare il pepe nero in grani al momento in un mortaio. Portare l'acqua salata a ebollizione e cuocere la pasta.\nStep 4: In una padella ampia, tostare il pepe macinato per 30 secondi a fuoco medio, quindi versare 150ml di bisque di astice calda.\nStep 5: Scolare la pasta al dente e versarla in padella, mescolando vigorosamente. Aggiungere il pecorino romano grattugiato poco per volta, mantecando energicamente fino a ottenere una cremosità vellutata.\nStep 6: Distribuire nei piatti, guarnire con polpa di astice tagliata a dadini e completare con altre scaglie di pecorino e una macinata di pepe fresco."}}, {"id": 57, "title": "Tacos astice guacamole maionese wasabi insalata", "cat": "Tacos & Street Food", "note": "", "detail": {"ingredienti": ["2 code di astice (circa 300g), bollite", "2 avocado maturi", "3 cucchiai di maionese", "1 cucchiaio di wasabi", "150g insalata mista fresca", "4 tortillas di mais", "1 limone", "Sale e pepe q.b."], "procedimento": "Step 1: Bollire le code di astice in acqua salata per 8-10 minuti, poi farle raffreddare e estrarre la polpa, tagliandola a pezzi.\nStep 2: Preparare il guacamole tagliando gli avocado a metà, togliendo il nocciolo e schiacciando la polpa in una ciotola con succo di limone, sale e pepe.\nStep 3: Mescolare la maionese con il wasabi in una piccola ciotola fino a ottenere una crema omogenea.\nStep 4: Scaldare leggermente le tortillas in una padella per renderle più morbide e malleabili.\nStep 5: Comporre i tacos: stendere un po' di guacamole su ogni tortilla, aggiungere pezzi di astice e un cucchiaio di maionese wasabi.\nStep 6: Completare con un pugno di insalata fresca su ogni taco e servire immediatamente."}}, {"id": 58, "title": "Tacos capasanta guacamole maionese corallo capasanta insalata", "cat": "Tacos & Street Food", "note": "", "detail": {"ingredienti": ["320g capasanta fresca (8 pezzi)", "2 avocado maturi", "100g maionese", "50g bottarga di muggine", "4 tortillas di mais", "150g insalata mista", "1 limone", "Sale e pepe q.b."], "procedimento": "Step 1: Preparare il guacamole schiacciando gli avocado con una forchetta, aggiungere succo di limone, sale e pepe fino a raggiungere una consistenza cremosa.\nStep 2: Preparare la maionese corallo mescolando la maionese con la bottarga grattugiata finemente per ottenere un colore e sapore caratteristico.\nStep 3: Pulire le capasante eliminando il muscolo laterale, asciugarle con carta assorbente e salare leggermente.\nStep 4: Scaldare una padella antiaderente a fuoco vivace e cuocere le capasante 1 minuto per lato fino a doratura, spruzzare con succo di limone.\nStep 5: Scaldare le tortillas in padella per 30 secondi per lato fino a renderle morbide e flessibili.\nStep 6: Comporre i tacos: spalmare guacamole sulla tortilla, aggiungere 2 capasante, insalata mista e un cucchiaio di maionese corallo.\nStep 7: Servire immediatamente i tacos ancora caldi, accompagnati con limone fresco."}}, {"id": 59, "title": "Tacos salmone guacamole insalata salsa teriaky", "cat": "Tacos & Street Food", "note": "", "detail": {"ingredienti": ["300g filetto di salmone fresco", "4 tortillas di grano", "1 avocado maturo", "1 limone", "150g insalata mista", "100ml salsa teriyaki", "1 cipolla rossa", "Sale e pepe q.b."], "procedimento": "Step 1: Tagliare il salmone a strisce e condirlo con sale, pepe e metà della salsa teriyaki. Lasciare marinare 10 minuti.\nStep 2: Preparare il guacamole schiacciando l'avocado in una ciotola, aggiungere il succo di limone e un pizzico di sale, mescolare bene.\nStep 3: Affettare finemente la cipolla rossa e preparare l'insalata mista in una ciotola a parte.\nStep 4: Scaldare una padella antiaderente e cuocere il salmone marinato 3-4 minuti per lato, a fiamma media-alta, bagnando con il restante teriyaki.\nStep 5: Scaldare brevemente le tortillas in una padella asciutta per renderle più morbide e flessibili.\nStep 6: Assemblare i tacos: distribuire il guacamole su ogni tortilla, aggiungere il salmone caldo, l'insalata mista e la cipolla rossa.\nStep 7: Drizzare con un po' di salsa teriyaki di cottura e servire subito."}}, {"id": 60, "title": "Tacos insalata maionese prezzemolo/basilico cipolla marinata aceto e tonno tataki (ricetta fb)", "cat": "Tacos & Street Food", "note": "", "detail": {"ingredienti": ["300g tonno fresco (per tataki)", "4 tortillas di mais", "150g insalata mista", "100g maionese", "1 cipolla rossa media", "80ml aceto di vino bianco", "30g prezzemolo fresco", "15g basilico fresco", "Sale e pepe q.b.", "2 cucchiai olio di sesamo"], "procedimento": "Step 1: Marinare la cipolla rossa affettata sottile in aceto di vino bianco con un pizzico di sale per 15 minuti, mescolando occasionalmente.\nStep 2: Sigillare il tonno in una padella molto calda con olio di sesamo per 30 secondi per lato, mantenendo l'interno crudo. Raffreddare e affettare sottile per il tataki.\nStep 3: Preparare la maionese aromatizzata tritando finemente prezzemolo e basilico, mescolarli alla maionese con sale e pepe.\nStep 4: Riscaldare leggermente le tortillas in padella per renderle morbide e flessibili.\nStep 5: Disporre su ogni tortilla un letto di insalata mista, aggiungere le fettine di tonno tataki e la cipolla marinata sgocciolata.\nStep 6: Spalmare un cucchiaio di maionese alle erbe su ogni taco, aggiungere un'ultima spolverata di basilico fresco e servire subito."}}, {"id": 61, "title": "Tacos insalata (piccante/senape) polpo mayonese acqua polpo zest like/arancia", "cat": "Tacos & Street Food", "note": "", "detail": {"ingredienti": ["400g polpo fresco", "100g maionese", "2 cucchiai di senape piccante", "1 arancia non trattata", "150g insalata mista", "4 tortillas di mais", "1 peperoncino rosso fresco", "Sale e pepe q.b."], "procedimento": "Step 1: Pulire il polpo sotto acqua fredda, eliminando la sacca dell'inchiostro. Cuocerlo in acqua bollente con sale per 45 minuti fino a renderlo tenero, quindi tagliarlo a piccoli pezzi.\nStep 2: Grattugiare finemente la zest dell'arancia e spremere il succo. Mescolare la maionese con la senape piccante e incorporare la zest, regolando il gusto.\nStep 3: Condire il polpo ancora caldo con il succo di arancia fresco, sale, pepe e il peperoncino rosso tagliato finemente. Lasciar riposare per 5 minuti.\nStep 4: Scaldare le tortillas in una padella antiaderente per 30 secondi per lato fino a renderle morbide e pieghevoli.\nStep 5: Comporre i tacos: distribuire l'insalata mista sulla tortilla tiepida, aggiungere il polpo marinato all'arancia e completare con un cucchiaio di maionese alla senape.\nStep 6: Servire subito, eventualmente guarnendo con qualche scaglia di zest d'arancia fresca."}}, {"id": 62, "title": "Tacos polpo patata paprika olive e mayonese di polpo", "cat": "Tacos & Street Food", "note": "", "detail": {"ingredienti": ["400g polpo fresco", "250g patate", "8 olive nere denocciolate", "2 cucchiai di paprika dolce", "150ml maionese", "4 tortillas di mais", "1 limone", "sale e pepe q.b."], "procedimento": "Step 1: Pulire il polpo sotto acqua corrente, eliminare la sacca del nero e gli occhi. Bollire in acqua salata per 45 minuti fino a renderlo tenero.\nStep 2: Tagliare le patate a dadini piccoli e friggerle in olio caldo fino a dorature, condire con sale e pepe.\nStep 3: Tritare finemente il polpo bollito e mescolare con maionese, succo di limone e paprika per ottenere la maionese di polpo.\nStep 4: Tagliare il polpo rimasto in strisce e condire con paprika dolce, sale e pepe.\nStep 5: Scaldare le tortillas in padella per pochi secondi da entrambi i lati.\nStep 6: Assemblare i tacos: distribuire patate fritte sulla tortilla, aggiungere strisce di polpo e olive tagliate a metà.\nStep 7: Completare con un cucchiaio di maionese di polpo e arrotolare.\nStep 8: Servire subito i tacos ancora caldi, accompagnati da spicchi di limone."}}, {"id": 63, "title": "Tacos guacamole tonno al gin e pomodorini al forno (ricetta Instagram)", "cat": "Tacos & Street Food", "note": "", "detail": {"ingredienti": ["200g tonno fresco o in scatola", "1 avocado maturo", "250g pomodorini ciliegia", "4 tortillas di mais", "50ml gin", "1 lime", "Sale e pepe q.b.", "30ml olio extravergine d'oliva"], "procedimento": "Step 1: Preriscaldare il forno a 200°C. Disporre i pomodorini in una teglia, condire con 15ml di olio, sale, pepe e 25ml di gin. Infornare per 15 minuti fino a caramellizzare.\nStep 2: Nel frattempo, tagliare l'avocado a metà, togliere il nocciolo e schiacciare la polpa in una ciotola con il succo di mezzo lime, sale e pepe.\nStep 3: Sgocciolate il tonno e discioglierlo in una ciotola con il succo della seconda metà di lime, 15ml di olio e un pizzico di sale e pepe.\nStep 4: Scaldare le tortillas in padella per 30 secondi per lato fino a renderle flessibili.\nStep 5: Comporre i tacos: stendere un cucchiaio di guacamole su ogni tortilla, aggiungere il tonno condito.\nStep 6: Distribuire i pomodorini al forno ancora caldi sopra il tonno, completare con un filo di olio di cottura dei pomodorini.\nStep 7: Servire subito, preferibilmente con una fetta di lime fresco a lato."}}, {"id": 64, "title": "Tramezzini burro cipolle caramellate fonduta al formaggio (ricetta Facebook)", "cat": "Tacos & Street Food", "note": "", "detail": {"ingredienti": ["4 fette di pane in cassetta", "150g cipolle gialle", "100g burro", "150g formaggio fuso (tipo Emmental o Fontina)", "1 cucchiaio di zucchero", "Sale e pepe q.b.", "1 cucchiaio di vino bianco secco"], "procedimento": "Step 1: Affettare le cipolle in anelli sottili e metterle in una padella con 50g di burro a fuoco medio-basso.\nStep 2: Aggiungere lo zucchero e il sale, mescolare e far cuocere le cipolle per 15-20 minuti fino a quando diventano morbide e caramellate, aggiungendo il vino bianco a metà cottura.\nStep 3: Nel frattempo, spezzettare il formaggio in una ciotola resistente al calore e metterla a bagnomaria, mescolando fino a ottenere una fonduta cremosa.\nStep 4: Tostare leggermente le 4 fette di pane in una padella con i restanti 50g di burro, fino a renderle croccanti e dorate su entrambi i lati.\nStep 5: Spalmare un po' di fonduta di formaggio su due fette di pane.\nStep 6: Distribuire generosamente le cipolle caramellate sulla fonduta, condire con pepe a piacere.\nStep 7: Coprire con le altre due fette di pane tostate burro, formaggio e cipolla verso il basso.\nStep 8: Tagliare i tramezzini in triangoli e servire subito ancora caldi."}}, {"id": 65, "title": "Sorbetto di carciofo", "cat": "Dolci & Dessert", "note": "", "detail": {"ingredienti": ["600g carciofi freschi", "200ml acqua", "150g zucchero", "1 limone (succo)", "50ml vino bianco secco", "1 cucchiaio di miele", "Sale q.b.", "1 foglia di menta fresca"], "procedimento": "Step 1: Pulire i carciofi eliminando le foglie esterne dure, tagliare a metà e rimuovere il fieno interno. Affettarli sottilmente e metterli in acqua fredda con succo di limone per evitare l'ossidazione.\nStep 2: In un pentolino, portare ad ebollizione l'acqua con lo zucchero, aggiungere il vino bianco e il miele. Lasciare raffreddare leggermente lo sciroppo.\nStep 3: Scolare bene i carciofi e aggiungerli allo sciroppo tiepido. Cuocere a fuoco medio per 15-20 minuti fino a quando i carciofi non diventano molto teneri. Salare leggermente.\nStep 4: Frullare il composto con il miele residuo fino a ottenere una crema liscia e omogenea. Passare il tutto attraverso un colino fine per eliminare eventuali fibre.\nStep 5: Raffreddare completamente in frigorifero per almeno 2 ore, preferibilmente una notte.\nStep 6: Versare il composto nella gelatiera e mantecarlo seguendo le istruzioni del vostro apparecchio, per circa 20-25 minuti.\nStep 7: Trasferire il sorbetto in un contenitore e congelare per almeno 3 ore prima del servizio.\nStep 8: Servire il sorbetto in coppette fredde, decorando con una foglia di menta fresca."}}, {"id": 66, "title": "Ravioli ripieni cozze olio prezzemolo limone e peperoncino", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["200g farina tipo 00", "2 uova", "300g cozze fresche", "3 cucchiai olio extravergine di oliva", "1 mazzo prezzemolo fresco", "1 limone", "1 peperoncino rosso fresco", "Sale e pepe nero q.b."], "procedimento": "Step 1: Impastare la farina con le uova e un pizzico di sale fino a ottenere un impasto liscio ed elastico. Avvolgere nella pellicola e riposare 30 minuti a temperatura ambiente.\nStep 2: Pulire le cozze sotto acqua corrente con una spazzola, eliminando barbe e residui. Cuocerle in padella a fuoco alto con un bicchiere d'acqua per 5-6 minuti finché non si aprono, scartando quelle chiuse.\nStep 3: Estrarre le cozze dal guscio, tritarle grossolanamente e metterle in una ciotola. Aggiungere il prezzemolo fresco tritato finemente, la scorza di limone grattugiata e il peperoncino rosso tritato. Regolare di sale e pepe.\nStep 4: Stendere l'impasto con il mattarello fino a ottenere una sfoglia sottile. Posizionare cucchiaini di ripieno a distanza regolare, piegare e sigillare i ravioli con uno stampino o un bicchiere.\nStep 5: Cuocere i ravioli in acqua salata bollente per 3-4 minuti fino a quando salgono in superficie. Scolarli con cura.\nStep 6: Condire i ravioli con olio extravergine di oliva a crudo, aggiungere peperoncino fresco e una spruzzata di succo di limone fresco. Servire immediatamente."}}, {"id": 67, "title": "Gambero pasta kalataifi panna acida e sale grosso", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["250g pasta fresca (tagliatelle o linguine)", "8 gamberi grandi freschi", "150g panna acida", "50g pasta phyllo (kataifi)", "30g burro", "Sale grosso q.b.", "1 spicchio aglio", "Pepe nero macinato"], "procedimento": "Step 1: Pulire i gamberi eliminando il budellino dorsale e lasciarli intatti. Scaldare il burro in padella e rosolare l'aglio schiacciato per 1 minuto.\nStep 2: Aggiungere i gamberi nella padella e cuocerli a fuoco medio-alto per 3-4 minuti fino a farli rosolare su entrambi i lati.\nStep 3: Staccare la pasta kataifi in piccoli mazzetti e tostarla in padella a secco per 2-3 minuti fino a dorarla leggermente, poi metterla da parte.\nStep 4: Portare a ebollizione una pentola di acqua salata e cuocere la pasta secondo i tempi indicati sulla confezione.\nStep 5: Aggiungere la panna acida ai gamberi in padella, mescolare delicatamente e cuocere per 1 minuto senza far bollire.\nStep 6: Scolare la pasta al dente e versarla direttamente nella padella con i gamberi e la panna acida.\nStep 7: Manteccare il tutto per 30 secondi a fuoco basso, regolando di sale e pepe.\nStep 8: Impiattare la pasta nei piatti, distribuire i gamberi in superficie, cospargere di kataifi tostato e una spolverata di sale grosso."}}, {"id": 68, "title": "Ricciola olio di sesamo zenzero ravanello e edamame", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["320g filetto di ricciola fresco", "3 cucchiai di olio di sesamo", "20g zenzero fresco", "8-10 ravanelli", "150g edamame sgranati", "2 cucchiai di salsa di soia", "1 limone", "Sale e pepe q.b."], "procedimento": "Step 1: Sbucciare e grattugiare lo zenzero fresco, quindi setacciarlo per ottenere il succo. In una ciotola mescolare l'olio di sesamo con il succo di zenzero, la salsa di soia e il succo di limone.\nStep 2: Lavare i ravanelli e affettarli molto finemente con un coltello affilato o una mandolina, disponerli in una ciotola con un pizzico di sale per farli leggermente marinare.\nStep 3: Portare a ebollizione una pentola d'acqua salata, calare gli edamame per 3-4 minuti fino a renderli teneri, quindi scolarli e condirli con un cucchiaio della marinata di sesamo e zenzero.\nStep 4: Asciugare bene la ricciola con carta da cucina, quindi tagliarla a fette sottili di circa 5mm, disponerle su un piatto da portata.\nStep 5: Versare il resto della marinata di sesamo e zenzero sulla ricciola, aggiustare di sale e pepe, lasciar riposare 2 minuti.\nStep 6: Completare il piatto disponendo sopra i ravanelli marinati e gli edamame conditi, aggiungendo il loro liquido di condimento.\nStep 7: Lasciare riposare il piatto 3-5 minuti prima di servire affinché i sapori si amalgamino."}}, {"id": 69, "title": "Bruschetta cacio cavallo cipolla caramellata e acciughe", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["1 pane di semola italiano", "200g caciocavallo affumicato", "2 cipolle rosse medie", "8 filetti di acciughe sott'olio", "3 cucchiai di olio extravergine di oliva", "1 cucchiaio di aceto balsamico", "Sale e pepe nero q.b.", "1 spicchio d'aglio"], "procedimento": "Step 1: Affettare le cipolle rosse in anelli sottili e farle rosolare a fuoco medio-basso in padella con 2 cucchiai di olio extravergine per circa 3 minuti.\nStep 2: Aggiungere sale, pepe e aceto balsamico alle cipolle, quindi cuocere a fuoco basso per 20-25 minuti, mescolando occasionalmente, fino a quando diventano caramellate e dolciastre.\nStep 3: Nel frattempo affettare il pane di semola in fette da 1,5cm di spessore e tostarle in forno a 200°C per 5-6 minuti fino a renderle croccanti.\nStep 4: Strofinare ogni fetta tostata con lo spicchio d'aglio su un lato.\nStep 5: Affettare il caciocavallo in scaglie sottili e disporle sulle fette di pane tostate.\nStep 6: Distribuire le cipolle caramellate su ogni bruschetta, poi adagiare i filetti di acciughe sott'olio.\nStep 7: Completare con un filo di olio extravergine di oliva e una macinata di pepe nero fresco.\nStep 8: Servire immediatamente mentre il caciocavallo è ancora leggermente tiepido."}}, {"id": 70, "title": "Pizza bianca provola affumicata cipolla caramellata e acciughe", "cat": "Pizza & Focaccia", "note": "", "detail": {"ingredienti": ["500g farina di tipo 0", "300ml acqua tiepida", "10g sale", "7g lievito di birra secco", "200g provola affumicata", "2 cipolle medie", "8 acciughe sotto sale", "30ml olio extravergine di oliva"], "procedimento": "Step 1: Sciogliere il lievito in acqua tiepida, aggiungere farina e sale, impastare per 10 minuti fino a ottenere un impasto liscio e omogeneo.\nStep 2: Lasciare lievitare l'impasto coperto per 2 ore a temperatura ambiente fino al raddoppio del volume.\nStep 3: Tagliare le cipolle a fette sottili e farle caramellare in padella con 15ml di olio a fuoco basso per 25-30 minuti, mescolando spesso, fino a quando diventano dorate e dolci.\nStep 4: Lavare le acciughe sotto acqua corrente per eliminare l'eccesso di sale, disossarle e dividerle in filetti.\nStep 5: Stendere l'impasto su una teglia rettangolare, cospargere con cipolla caramellata, scaglie di provola affumicata e filetti di acciughe distribuiti uniformemente.\nStep 6: Aggiungere un filo di olio extravergine in superficie e far lievitare per 30 minuti.\nStep 7: Cuocere in forno preriscaldato a 220°C per 15-18 minuti fino a doratura.\nStep 8: Estrarre dal forno, far riposare 5 minuti e servire calda."}}, {"id": 71, "title": "Pizza cacio e pepe", "cat": "Pizza & Focaccia", "note": "", "detail": {"ingredienti": ["500g farina di tipo 0", "325ml acqua tiepida", "10g sale fino", "7g lievito di birra secco", "200g pecorino romano grattugiato", "40g pepe nero macinato grosso", "30ml olio extravergine d'oliva", "50g guanciale a dadini"], "procedimento": "Step 1: Sciogliere il lievito in acqua tiepida, aggiungere farina e sale, impastare per 10 minuti fino a ottenere un impasto omogeneo e elastico.\nStep 2: Dividere l'impasto in 2 porzioni, formare 2 palle, sistemarle in una ciotola con olio e far lievitare 2-3 ore a temperatura ambiente fino al raddoppio del volume.\nStep 3: Stendere ogni porzione di impasto su carta da forno formando due dischi di circa 30cm, condire con un filo d'olio e pepe.\nStep 4: Cuocere in forno preriscaldato a 280°C per 12-15 minuti fino a doratura della base.\nStep 5: Nel frattempo rosolare il guanciale in padella a fuoco medio fino a quando diventa croccante.\nStep 6: A cottura ultimata, distribuire il guanciale croccante sulle pizze.\nStep 7: Cospargere abbondante pecorino romano grattugiato e pepe nero macinato fresco su ogni pizza.\nStep 8: Servire immediatamente in tavola ancora calde."}}, {"id": 72, "title": "Zuppa piccante patate ceci e polpo", "cat": "Secondi Piatti", "note": "", "detail": {"ingredienti": ["300g polpo fresco", "250g patate", "150g ceci secchi (o 400g in scatola)", "1 cipolla media", "3 spicchi aglio", "1 litro brodo di pesce", "1 peperoncino rosso fresco", "4 cucchiai olio extravergine di oliva"], "procedimento": "Step 1: Cuocere i ceci in acqua salata per 1 ora se secchi (saltare se in scatola), quindi scolare e mettere da parte.\nStep 2: Pulire il polpo, eliminare la bocca e gli occhi, quindi farlo bollire in acqua per 45 minuti con mezza cipolla e uno spicchio d'aglio, finché non risulti tenero.\nStep 3: Tagliare il polpo a pezzetti piccoli, mondare e tagliare le patate a cubetti, affettare finemente cipolla e aglio rimanenti, e sminuzzare il peperoncino.\nStep 4: Riscaldare l'olio in una pentola grande, rosolare cipolla, aglio e peperoncino per 2 minuti fino a profumo.\nStep 5: Aggiungere le patate, mescolare bene e cuocere per 3 minuti.\nStep 6: Versare il brodo di pesce, aggiungere i ceci e portare a ebollizione, quindi ridurre il fuoco e cuocere per 15 minuti.\nStep 7: Incorporare il polpo a pezzetti e cuocere ancora 5 minuti per amalgamare i sapori.\nStep 8: Assaggiare, regolare di sale e peperoncino, quindi servire fumante."}}, {"id": 73, "title": "Minestra riso latte castagne/ risotto alle castagne", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["150g riso Arborio", "200g castagne fresche o surgelate", "500ml latte intero", "500ml brodo vegetale", "1 cipolla media", "40g burro", "50g Parmigiano Reggiano grattugiato", "Sale e pepe q.b."], "procedimento": "Step 1: Pelare le castagne facendo un'incisione e cuocerle in acqua bollente per 10 minuti, poi eliminarla la buccia e tagliarle a pezzetti.\nStep 2: Tritare finemente la cipolla e farla rosolare in un pentola con il burro a fuoco medio per 3 minuti fino a renderla trasparente.\nStep 3: Aggiungere il riso e tostarlo per 1 minuto mescolando continuamente, poi versare il brodo caldo un mestolo alla volta.\nStep 4: Quando il riso avrà assorbito metà del brodo (circa 10 minuti), aggiungere le castagne tagliate.\nStep 5: Continuare a mescolare e versare il latte gradualmente, alternandolo al brodo rimasto per altri 8-10 minuti fino a cottura completa del riso.\nStep 6: Il risotto deve risultare cremoso e il riso al dente; se troppo denso, aggiungere un po' di latte caldo.\nStep 7: Mantecare con burro e Parmigiano Reggiano fuori dal fuoco, mescolare energicamente per 1 minuto.\nStep 8: Assaggiare, correggere di sale e pepe, quindi servire subito in piatti caldi."}}, {"id": 74, "title": "Risotto salsiccia Lucanega e porro fritto", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["160g riso Carnaroli", "150g lucanega fresca", "1 porro medio", "500ml brodo di carne", "1 cipolla piccola", "100ml vino bianco secco", "50g burro", "50g Parmigiano Reggiano grattugiato", "Sale e pepe q.b.", "Olio di semi per friggere"], "procedimento": "Step 1: Pulisci il porro, taglia la parte bianca e pallida a rondelle di 2cm, tagliane il resto a fette sottili per il soffritto. Scalda il brodo di carne in un pentolino.\nStep 2: In una padella larga, scalda l'olio di semi e friggi le rondelle di porro fino a renderle dorate e croccanti. Scola su carta assorbente.\nStep 3: Elimina la pelle dalla lucanega e sgretolala con le mani. In una pentola, rosola la cipolla tritata finemente con metà del burro, aggiungi la carne macinata e fai cuocere 3 minuti, mescolando.\nStep 4: Aggiungi il riso e tostalo per 2 minuti mescolando costantemente, poi sfuma con il vino bianco.\nStep 5: Aggiungi il brodo caldo mezzo mestolo alla volta, mescolando frequentemente, per circa 18-20 minuti fino a completa cottura del riso.\nStep 6: Quando il riso è cremoso al dente, manteca con il burro rimasto e il Parmigiano Reggiano. Aggiusta di sale e pepe.\nStep 7: Versa il risotto nei piatti e guarnisci con il porro fritto."}}, {"id": 75, "title": "Cavolo cappuccio viola polpo grigliato mela avocado dressing limone olio e senape", "cat": "Secondi Piatti", "note": "", "detail": {"ingredienti": ["1 polpo di 800g", "300g cavolo cappuccio viola", "1 mela verde", "1 avocado maturo", "3 cucchiai di olio extravergine di oliva", "2 cucchiai di succo di limone", "1 cucchiaio di senape di Digione", "Sale e pepe q.b."], "procedimento": "Step 1: Lessare il polpo in acqua salata per 40 minuti fino a renderlo tenero, quindi lasciarlo raffreddare e tagliarlo a pezzi regolari.\nStep 2: Preparare il dressing emulsionando in una ciotola il succo di limone con la senape, aggiungere l'olio a filo mentre si monta, regolare di sale e pepe.\nStep 3: Affettare finemente il cavolo cappuccio viola con un coltello affilato, poi tagliare la mela a julienne e l'avocado a spicchi.\nStep 4: Scaldare una piastra o griglia a fuoco vivo e cuocere i pezzi di polpo 2-3 minuti per lato fino a ottenere una leggera crosticina.\nStep 5: Disporre il cavolo cappuccio come base nei piatti, aggiungere la mela, l'avocado e il polpo ancora caldo.\nStep 6: Versare il dressing su tutto il piatto e servire immediatamente."}}, {"id": 76, "title": "Castagnaccio", "cat": "Dolci & Dessert", "note": "", "detail": {"ingredienti": ["500g farina di castagne", "650ml acqua", "150ml latte intero", "40ml olio extravergine di oliva", "1 pizzico di sale", "Rosmarino fresco q.b.", "Pinoli q.b.", "Uvetta q.b. (opzionale)"], "procedimento": "Setaccia la farina di castagne in una ciotola capiente per eliminare i grumi. Aggiungi un pizzico di sale.\nVersa l'acqua e il latte a filo mescolando continuamente con una frusta fino a ottenere un composto liscio e senza grumi, della consistenza di una pastella fluida.\nAggiungi 20ml di olio e mescola ancora.\nUngi una teglia bassa e larga (circa 30x40cm) con il restante olio. Versa il composto: deve avere uno spessore di circa 1 cm.\nDistribuisci in superficie i pinoli, qualche ago di rosmarino e, se vuoi, l'uvetta precedentemente ammollata.\nCuoci in forno statico preriscaldato a 170°C per 30-35 minuti, finché la superficie è asciutta e inizia a screpolarsi leggermente.\nSforna, lascia intiepidire e servi a fette."}}, {"id": 77, "title": "Cecina gamberi rossi pomodorini confit e ricotta", "cat": "Secondi Piatti", "note": "", "detail": {"ingredienti": ["200g farina di ceci", "500ml acqua", "8 gamberi rossi medi", "200g pomodorini ciliegia", "100g ricotta fresca", "4 cucchiai olio extravergine d'oliva", "sale e pepe q.b.", "basilico fresco q.b."], "procedimento": "Step 1: Preparare la cecina mescolando la farina di ceci con l'acqua fredda, aggiungere 2 cucchiai di olio, sale e pepe. Lasciar riposare 30 minuti.\nStep 2: Nel frattempo, preparare i pomodorini confit: metterli in una teglia con 1 cucchiaio di olio, sale e pepe, cuocere in forno a 120°C per 45 minuti.\nStep 3: Pulire i gamberi rossi, togliere l'intestino dorsale e condire con sale, pepe e 1 cucchiaio di olio.\nStep 4: Versare l'impasto di cecina in una padella antiaderente unta con olio, cuocere a fuoco medio per 3-4 minuti fino a doratura, poi capovolgere e cuocere altri 2 minuti.\nStep 5: In una padella calda con olio, rosolare i gamberi rossi 2 minuti per lato fino a cottura.\nStep 6: Assemblare il piatto: posizionare la cecina al centro, adagiare i gamberi rossi sopra e contornarli con i pomodorini confit.\nStep 7: Completare con una quenelle di ricotta fresca, qualche foglia di basilico fresco e un filo di olio extravergine."}}, {"id": 78, "title": "Riso/ paccheri nero di seppia, gambero rosso e crema di cima di rapa", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["320g riso carnaroli nero di seppia", "4 gamberi rossi medi", "300g cima di rapa fresca", "200ml panna da cucina", "1 spicchio aglio", "80ml vino bianco secco", "Sale e pepe q.b.", "40g burro"], "procedimento": "Step 1: Pulire i gamberi rossi, staccare le teste e riporle. Sbollentare la cima di rapa in acqua salata per 3 minuti, scolarla e tritarla grossolanamente.\nStep 2: In un tegame, rosolare l'aglio schiacciato nel burro, aggiungere le teste dei gamberi e rosolarlo per 2 minuti, sfumare con vino bianco e far evaporare. Filtrare il brodo ottenuto e metterlo da parte.\nStep 3: Rosolare i gamberi interi in una padella con burro per 2 minuti per lato, salare e pepe, metterli da parte al caldo.\nStep 4: In un'altra padella versare la panna, aggiungere la cima di rapa tritata e far sobbollire per 3 minuti, aggiustare di sale e pepe. Tenere in caldo.\nStep 5: Portare 500ml di acqua salata a ebollizione, tuffare il riso e mantenerlo al dente, aggiungendo il brodo di gambero negli ultimi 2 minuti di cottura.\nStep 6: Manteccare il riso con la crema di cima di rapa, distribuire nei piatti e posizionare i gamberi rossi sopra."}}, {"id": 79, "title": "Passatelli brodetto/ fumetto di pesce, cozze, vongole e gamberi crudi", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["150g pane raffermo grattugiato", "80g parmigiano reggiano grattugiato", "2 uova", "30g burro", "500ml fumetto di pesce", "200g cozze fresche", "150g vongole veraci", "100g gamberi crudi sgusciati", "Sale e pepe q.b.", "Prezzemolo fresco"], "procedimento": "Step 1: Preparare l'impasto dei passatelli mescolando il pane grattugiato, il parmigiano, le uova, il burro ammorbidito e un pizzico di sale fino a ottenere un composto omogeneo.\nStep 2: Scaldare il fumetto di pesce in un pentola a fuoco medio-alto fino al primo bollore.\nStep 3: Passare l'impasto attraverso uno schiacciapatate direttamente nel fumetto bollente, creando i caratteristici filamenti di passatelli.\nStep 4: Cuocere i passatelli per 2-3 minuti finché non affiorano in superficie.\nStep 5: Aggiungere le cozze e le vongole già pulite, lasciando cuocere per 3-4 minuti finché non si aprono.\nStep 6: Incorporare i gamberi crudi negli ultimi 2 minuti di cottura, mescolando delicatamente.\nStep 7: Condire con sale e pepe, aggiustando di sapore e completare con prezzemolo fresco tritato.\nStep 8: Servire immediatamente in ciotole calde con il brodetto fumante."}}, {"id": 80, "title": "Cannolo al nero di seppia baccala mantecato bottarga e limoni salati", "cat": "Secondi Piatti", "note": "", "detail": {"ingredienti": ["200g pasta per cannoli", "150g baccalà dissalato", "50g nero di seppia", "30g bottarga di muggine", "2 limoni salati", "100ml olio extravergine", "50g ricotta di bufala", "Sale e pepe q.b."], "procedimento": "Step 1: Preparare la pasta per cannoli aggiungendo il nero di seppia all'impasto base, lavorare fino a ottenere un composto omogeneo e lasciar riposare 30 minuti.\nStep 2: Stendere la pasta a 2mm, tagliare rettangoli di 10x8cm e friggerli a 170°C avvolti intorno ai coni metallici fino a doratura.\nStep 3: Manteccare il baccalà dissalato con olio extravergine fino a ottenere una crema cremosa, aggiungere la ricotta e mescolare delicatamente.\nStep 4: Tritare finemente i limoni salati privati dei semi e incorporarli al composto di baccalà con pepe macinato fresco.\nStep 5: Trasferire il ripieno in una tasca da pasticcere e farcire i cannoli ancora tiepidi.\nStep 6: Grattugiare abbondante bottarga su ogni cannolo e completare con un filo di olio extravergine.\nStep 7: Servire immediatamente a temperatura ambiente."}}, {"id": 81, "title": "Panino mortadella crema parmigiano carciofo croccante e olio al tartufo", "cat": "Panini & Piadine", "note": "", "detail": {"ingredienti": ["2 panini toscani da 80g l'uno", "150g mortadella di Modena affettata spessa", "100g crema di parmigiano reggiano", "2 carciofi romaneschi medi", "3 cucchiai di olio di semi", "2 cucchiai di olio al tartufo", "Sale e pepe q.b.", "30g burro"], "procedimento": "Step 1: Pulisci i carciofi eliminando le foglie esterne dure e affettali verticalmente in fette sottili di 3mm, eliminando la peluria centrale.\nStep 2: Riscalda l'olio di semi in una padella antiaderente a fuoco alto e friggi i carciofi per 6-8 minuti fino a renderli croccanti e dorati, salando e pepando.\nStep 3: Taglia i panini a metà e spennella leggermente l'interno con il burro, poi tostali in padella per 2 minuti per renderli croccanti.\nStep 4: Spalma la crema di parmigiano reggiano sulle superfici interne del panino tostato.\nStep 5: Disponi la mortadella affettata spessa su uno dei due lati del panino, creando 3-4 strati.\nStep 6: Aggiungi i carciofi croccanti ancora caldi sulla mortadella.\nStep 7: Chiudi il panino e condisci generosamente con l'olio al tartufo sia sulla superficie esterna che all'interno.\nStep 8: Taglia il panino a metà in diagonale e servi subito mentre i carciofi sono ancora croccanti."}}, {"id": 82, "title": "Crema di patate carciofo fritto e bottarga", "cat": "Zuppe & Vellutate", "note": "", "detail": {"ingredienti": ["400g patate", "2 carciofi", "100ml panna fresca", "500ml brodo vegetale", "30g bottarga di muggine", "3 cucchiai olio extravergine di oliva", "Sale e pepe q.b.", "1 spicchio aglio"], "procedimento": "Step 1: Pulire i carciofi eliminando le foglie esterne dure, tagliare a spicchi sottili e immergere in acqua fredda per evitare l'ossidazione.\nStep 2: Pelate e tagliate le patate a dadini di circa 2cm, fatele cuocere nel brodo vegetale con lo spicchio d'aglio per circa 15-18 minuti fino a renderle tenere.\nStep 3: Frittate i carciofi in olio caldo a fuoco medio-alto per 3-4 minuti fino a renderli croccanti e dorati, salate e scolateli su carta assorbente.\nStep 4: Frullate le patate cotte con il brodo di cottura fino a ottenere una crema liscia e vellutata, aggiungete la panna e mescolate bene.\nStep 5: Regolate di sale e pepe, versate la crema in piatti caldi dividendola equamente.\nStep 6: Decorate ciascun piatto con i carciofi fritti al centro e cospargete generosamente di bottarga grattugiata in superficie.\nStep 7: Completate con un filo di olio extravergine di oliva crudo e servite immediatamente."}}, {"id": 83, "title": "Bicchiere composta di frutti di bosco, crema pasticciera al formaggio e lime, crumble", "cat": "Dolci & Dessert", "note": "", "detail": {"ingredienti": ["150g frutti di bosco misti (fragole, mirtilli, lamponi)", "100g zucchero", "100ml latte", "1 tuorlo d'uovo", "20g farina 00", "80g ricotta fresca", "1 lime", "80g burro freddo a dadini", "80g farina 00", "40g zucchero di canna", "1 pizzico di sale"], "procedimento": "Step 1: Preparare la composta: mescolare i frutti di bosco con 50g di zucchero in un pentolino, cuocere a fuoco medio per 8 minuti fino a renderli morbidi, quindi lasciar raffreddare.\nStep 2: Fare il crumble: mescolare 80g di farina con 40g di zucchero di canna e un pizzico di sale, aggiungere il burro freddo e sgranare con le dita fino a ottenere briciole. Cuocere in forno a 180°C per 12 minuti fino a dorare, poi lasciar raffreddare.\nStep 3: Preparare la crema pasticciera: far bollire il latte con la scorza di lime. In una ciotola montare il tuorlo con 50g di zucchero, aggiungere 20g di farina, versare il latte caldo mescolando, cuocere in pentolino a fuoco basso per 3 minuti fino a inspessire.\nStep 4: Fare intiepidire la crema, quindi incorporare la ricotta fresca e il succo di mezzo lime.\nStep 5: Comporre il bicchiere: alternare strati di composta, crema pasticciera al formaggio e crumble, terminando con un cucchiaio di crumble e una foglia di menta."}}, {"id": 84, "title": "Polenta Nero di seppia con calamaretti aglio olio e peperoncino con pomodorini gialli e zest di limone", "cat": "Secondi Piatti", "note": "", "detail": {"ingredienti": ["200g polenta istantanea", "500ml brodo di pesce", "1 bustina (1g) nero di seppia", "300g calamaretti puliti", "200g pomodorini gialli", "3 spicchi aglio", "1 peperoncino rosso fresco", "Zest di 1 limone", "4 cucchiai olio extravergine", "Sale e pepe q.b."], "procedimento": "Step 1: Portare a ebollizione il brodo di pesce in un pentolino. Aggiungere il nero di seppia e mescolare bene fino a scioglierlo completamente, ottenendo un brodo nero uniforme.\nStep 2: Versare la polenta istantanea a pioggia nel brodo bollente, mescolando costantemente con una frusta per evitare grumi. Cuocere per 5 minuti, rimestando frequentemente fino a ottenere una crema densa.\nStep 3: Nel frattempo, affettare sottilmente l'aglio e il peperoncino. In una padella, scaldare 3 cucchiai di olio a fuoco medio-alto e rosolare aglio e peperoncino per 1 minuto.\nStep 4: Aggiungere i calamaretti interi alla padella e cuocere per 3-4 minuti a fuoco vivo, finché non diventano opachi. Aggiustare di sale e pepe.\nStep 5: Inserire i pomodorini gialli tagliati a metà nella padella dei calamaretti e cuocere per altri 2 minuti.\nStep 6: Distribuire la polenta nero di seppia nei piatti, creando una base cremosa.\nStep 7: Condire con i calamaretti, i pomodorini e il sughetto della padella. Finire con lo zest di limone e un filo di olio crudo."}}, {"id": 85, "title": "Polenta baccala mantecato e zuppetta di vongole", "cat": "Secondi Piatti", "note": "", "detail": {"ingredienti": ["200g polenta", "150g baccalà già ammollato", "300g vongole veraci", "1 bicchiere vino bianco secco", "2 spicchi aglio", "1 peperoncino", "Prezzemolo fresco", "Olio extravergine d'oliva"], "procedimento": "Step 1: Portare a ebollizione 500ml di acqua salata, versare la polenta a pioggia mescolando costantemente per 30 minuti fino a cottura completa. Aggiungere 50g di burro.\nStep 2: Nel frattempo, dissalare il baccalà in acqua fredda per 1 ora, poi cuocerlo in acqua bollente per 15 minuti, scolare e mantecarlo con la polenta calda, aggiungendo olio d'oliva a filo.\nStep 3: In una padella, rosolare 1 spicchio d'aglio in olio, aggiungere le vongole e il peperoncino, coprire e farle aprire per 3-4 minuti.\nStep 4: Sfumare con vino bianco, aggiungere l'aglio rimasto tritato e 2 cucchiai di prezzemolo, far cuocere ancora 2 minuti.\nStep 5: Distribuire la polenta mantecata nei piatti, creare un incavo al centro e versarvi sopra la zuppetta di vongole con il suo brodo.\nStep 6: Completare con prezzemolo fresco e un filo d'olio extravergine crudo."}}, {"id": 86, "title": "Passata di ceci, spinaci uvetta e pinoli e baccala alla piastra", "cat": "Secondi Piatti", "note": "", "detail": {"ingredienti": ["400g ceci in scatola", "150g spinaci freschi", "40g uvetta", "30g pinoli", "300g filetto di baccalà dissalato", "3 cucchiai olio extravergine di oliva", "1 spicchio aglio", "Sale e pepe q.b."], "procedimento": "Step 1: Sciacquare i ceci e metterli in un pentolino con 200ml di acqua. Aggiungere uno spicchio di aglio schiacciato e portare a ebollizione per 5 minuti.\nStep 2: Frullare i ceci con il loro brodo fino a ottenere una passata liscia e cremosa. Trasferire in una ciotola, condire con 2 cucchiai di olio, sale e pepe.\nStep 3: In una padella, rosolare gli spinaci freschi con 1 cucchiaio di olio per 2 minuti. Aggiungere uvetta e pinoli, rosolare altri 2 minuti fino a quando i pinoli non iniziano a dorare.\nStep 4: Incorporare gli spinaci saltati nella passata di ceci, mescolare bene e tenere in caldo.\nStep 5: Asciugare il baccalà con carta assorbente e condire con sale e pepe su entrambi i lati.\nStep 6: Scaldare una piastra o griddle a fuoco medio-alto. Cuocere il baccalà 4-5 minuti per lato fino a quando la pelle risulta croccante e la polpa bianca.\nStep 7: Distribuire la passata di ceci negli piatti, adagiare il baccalà alla piastra sopra e servire subito."}}, {"id": 87, "title": "Risotto cavolo nero, gorgonzola/ fontina cozze", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["320g riso Carnaroli", "400g cozze fresche", "150g cavolo nero", "80g gorgonzola", "50g fontina", "1 cipolla piccola", "1l brodo di pesce", "100ml vino bianco secco", "40g burro", "Sale e pepe q.b.", "Olio extravergine d'oliva"], "procedimento": "Step 1: Pulire le cozze sotto acqua corrente, eliminare le incrostazioni e la barba. Farle aprire in padella a fuoco alto con mezzo bicchiere di vino bianco per 3-4 minuti, scartare quelle rimaste chiuse e filtrare il liquido di cottura.\nStep 2: Pulire il cavolo nero eliminando la nervatura centrale, tagliarlo a striscioline sottili e rosolare brevemente in padella con un filo d'olio, salare e tenere da parte.\nStep 3: Tritare finemente la cipolla e farla appassire in una padella con olio extravergine a fuoco medio per 2-3 minuti, aggiungere il riso e tostarlo per 1 minuto mescolando costantemente.\nStep 4: Sfumare con il vino bianco rimasto, quindi aggiungere il brodo di pesce e il liquido filtrato delle cozze, poco alla volta, mescolando frequentemente per 16-18 minuti.\nStep 5: A 2 minuti dalla fine della cottura, aggiungere il cavolo nero rossolato e le cozze sgusciate, continuare la cottura mescolando.\nStep 6: Manteccare il risotto con burro, gorgonzola e fontina tagliati a pezzetti, mescolando vigorosamente fuori dal fuoco fino a ottenere una cremosità omogenea.\nStep 7: Assaggiare e correggere di sale e pepe, trasferire nei piatti e servire subito."}}, {"id": 88, "title": "Tonnarelli cacio pepe e cozze", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["320g tonnarelli", "400g cozze fresche", "100g pecorino romano grattugiato", "20g pepe nero in grani", "100ml vino bianco secco", "1 spicchio aglio", "Sale q.b.", "Prezzemolo fresco (facoltativo)"], "procedimento": "Step 1: Pulire le cozze sotto acqua fredda corrente, eliminando eventuali residui e barbe. Scartare quelle aperte che non si chiudono al tocco.\nStep 2: In una padella ampia, aggiungere l'aglio e il vino bianco. Portare a fuoco vivo, aggiungere le cozze e coprire con un coperchio. Cuocere per 3-4 minuti finché le cozze non si aprono. Scartare quelle rimaste chiuse.\nStep 3: Estrarre le cozze dal guscio, filtrare il liquido di cottura versandolo in una pentola e mantenerlo tiepido. Scartare l'aglio.\nStep 4: Tostare il pepe nero in grani in una padella asciutta per 1 minuto, poi macinarlo grossolanamente.\nStep 5: Portare a ebollizione un'ampia pentola d'acqua salata. Cuocere i tonnarelli secondo i tempi di cottura indicati sulla confezione.\nStep 6: In una padella grande, aggiungere il pepe macinato e 3-4 cucchiai del liquido di cottura della pasta. Mescolare bene il pecorino con un cucchiaio di acqua fredda per evitare grumi.\nStep 7: Scolare i tonnarelli al dente, trasferirli nella padella con il pepe e il liquido. Mescolare rapidamente, aggiungere gradualmente il pecorino mentre continui a mescolare, fino a ottenere una cremosità perfetta. Aggiungere il liquido delle cozze se necessario.\nStep 8: Aggiungere le cozze, mescolare delicatamente, impiattare e decorare con prezzemolo fresco se desiderato."}}, {"id": 89, "title": "Tacos nduja fonduta di scamorza affumicata olive nere e scorza di limone/ cedro cicoria ripassata", "cat": "Tacos & Street Food", "note": "", "detail": {"ingredienti": ["200g scamorza affumicata", "150g nduja calabrese", "8 olive nere denocciolate", "1 limone (scorza)", "300g cicoria ripassata", "4 tortillas di mais", "50ml panna fresca", "Sale e pepe q.b."], "procedimento": "Step 1: Affettare la scamorza affumicata in fette sottili e metterla in un pentolino a fuoco basso con la panna fresca.\nStep 2: Mescolare delicatamente fino a ottenere una fonduta cremosa, aggiungendo sale e pepe, quindi mantenerla al caldo a fuoco molto dolce.\nStep 3: In una padella a parte, fare rosolare la nduja sbriciolata per 2-3 minuti a fuoco medio fino a farla diventare croccante ai bordi, mescolando spesso.\nStep 4: Tritare finemente le olive nere e grattuggiare la scorza del limone, mischiando insieme in una piccola ciotola.\nStep 5: In un'altra padella, saltare la cicoria ripassata per 3-4 minuti in olio d'oliva a fuoco vivo, aggiustando di sale e pepe.\nStep 6: Scaldare leggermente le tortillas di mais in una padella asciutta per 20 secondi per lato.\nStep 7: Comporre i tacos: stendere la fonduta di scamorza sulla tortilla, aggiungere nduja croccante, cicoria salteata e un pizzico di miscela olive-scorza.\nStep 8: Servire immediatamente, ancora caldi, con un filo di olio d'oliva a crudo."}}, {"id": 90, "title": "Tartina di polenta al nero di seppia e baccala mantecato", "cat": "Panini & Piadine", "note": "", "detail": {"ingredienti": ["200g polenta istantanea", "500ml brodo vegetale", "10g nero di seppia", "150g baccalà già ammollato", "100ml olio extravergine d'oliva", "1 limone", "Sale e pepe q.b.", "Prezzemolo fresco q.b."], "procedimento": "Step 1: Portare a ebollizione il brodo vegetale in una pentola, quindi versare la polenta a pioggia mescolando costantemente per evitare grumi.\nStep 2: Continuare la cottura della polenta per 5-7 minuti finché non risulta cremosa, quindi aggiungere il nero di seppia e mescolare bene fino a ottenere un colore nero uniforme.\nStep 3: Versare la polenta su un piano da lavoro bagnato, lasciare raffreddare completamente, quindi tagliare con un coppapasta in dischi regolari e farli dorare leggermente in padella.\nStep 4: Frullare il baccalà ammollato e privato delle spine con 80ml di olio extravergine, il succo di limone e un pizzico di pepe bianco fino a ottenere una crema liscia e mantecata.\nStep 5: Posizionare i dischi di polenta al nero su un piatto, distribuire il baccalà mantecato sopra in modo elegante.\nStep 6: Completare le tartine con un filo di olio extravergine rimasto, pepe nero macinato al momento e prezzemolo fresco tritato finemente."}}, {"id": 91, "title": "Tartina di polenta bianca e seppie", "cat": "Panini & Piadine", "note": "", "detail": {"ingredienti": ["250ml latte", "75g polenta bianca", "250g seppie pulite", "2 cucchiai olio extravergine di oliva", "1 spicchio aglio", "Sale e pepe q.b.", "1 limone", "Prezzemolo fresco q.b."], "procedimento": "Step 1: Portare il latte a ebollizione in un pentolino con un pizzico di sale, poi versare la polenta a pioggia mescolando continuamente per evitare grumi.\nStep 2: Continuare a mescolare la polenta per circa 20 minuti fino a quando diventa cremosa e si stacca dalle pareti; trasferire su un piatto e farla raffreddare completamente.\nStep 3: Tagliare le seppie in piccoli pezzi e farle rosolare in una padella con olio e aglio per 2-3 minuti, poi aggiungere il succo di limone e cuocere per altri 5-7 minuti fino a quando sono tenere.\nStep 4: Condire le seppie con sale, pepe e prezzemolo fresco tritato.\nStep 5: Tagliare la polenta raffreddata in fette dello spessore di 1 cm e tostarle brevemente in una padella calda con un filo d'olio.\nStep 6: Disporre le fette di polenta tostata su un piatto e guarnire con il composto di seppie.\nStep 7: Finire con un filo d'olio extravergine, un'altra spruzzata di prezzemolo e una scorza di limone."}}, {"id": 92, "title": "Tartina di polenta polpo e sua mayonese", "cat": "Panini & Piadine", "note": "", "detail": {"ingredienti": ["200g polenta", "400g polpo fresco", "2 tuorli d'uovo", "150ml olio di semi", "1 limone", "Sale e pepe q.b.", "1 spicchio d'aglio", "Prezzemolo fresco q.b."], "procedimento": "Step 1: Cuocere la polenta in 500ml di acqua salata per 30 minuti, mescolando frequentemente fino a ottenerla cremosa e densa.\nStep 2: Pulire il polpo e cuocerlo in acqua bollente salata con aglio per 40 minuti fino a renderlo tenero, quindi raffreddarlo e tagliarlo in piccoli dadini.\nStep 3: Preparare la maionese montando i tuorli con sale e pepe, aggiungendo lentamente l'olio fino a emulsionare completamente, infine incorporare il succo di limone.\nStep 4: Stendere la polenta calda su un foglio di carta forno in uno strato di 1cm di spessore e farla raffreddare completamente.\nStep 5: Ricavare rettangoli di polenta con un coltello e tostarli leggermente in padella per 2 minuti per lato fino a formare una leggera crosticina.\nStep 6: Disporre le tartine di polenta nel piatto, spalmare la maionese al limone, aggiungere il polpo dadolato e cospargere con prezzemolo fresco tritato."}}, {"id": 93, "title": "Fegatini di pollo", "cat": "Secondi Piatti", "note": "", "detail": {"ingredienti": ["400gr fegatini pollo. Mezza cipolla mezza carota sedano (poco) 2 salvia 4 capperi"], "procedimento": "Soffritto, aggiungi fegatini (10 min risolare), mestolo brodo , sfumare con 1 bicchiere vino bianco secco. Frullate il composto senza sugo. Quando la consistenza giusta si aggiunge la pasta d'acciughe"}}, {"id": 94, "title": "Bruschetta con burro del Chianti", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["1 filone di pane toscano, 200g", "200g burro di qualità", "100ml vino rosso Chianti", "2 spicchi d'aglio", "1 rametto di rosmarino fresco", "Sale e pepe q.b.", "15g salvia fresca", "Olio extravergine di oliva, 2 cucchiai"], "procedimento": "Step 1: Tagliare il filone di pane toscano in fette spesse circa 1,5cm, disporre su una griglia e tostare leggermente in forno a 180°C per 3-4 minuti.\nStep 2: In un pentolino, versare il vino Chianti e portare a ebollizione, lasciare ridurre di due terzi fino a ottenere uno sciroppo denso e concentrato (circa 2 cucchiai).\nStep 3: Togliere il burro dal frigo 20 minuti prima e ridurlo a temperatura ambiente in una ciotola, aggiungere la riduzione di Chianti e mescolare bene con una spatola di legno.\nStep 4: Tritare finemente l'aglio, il rosmarino e la salvia, aggiungerli al burro e mescolare energicamente fino a ottenere un composto omogeneo e cremoso.\nStep 5: Salare e pepare il burro del Chianti secondo il gusto.\nStep 6: Sfregare leggermente le bruschette tostate con uno spicchio d'aglio intero.\nStep 7: Spalmare generosamente il burro del Chianti su ogni fetta di pane.\nStep 8: Servire subito a temperatura ambiente, condire con un filo di olio extravergine di oliva."}}, {"id": 95, "title": "Bruschetta con fonduta di fontina/ gorgonzola", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["200g pane tipo baguette", "150g fontina Valle d'Aosta", "100g gorgonzola dolce", "50ml panna fresca", "2 spicchi aglio", "30g burro", "Sale e pepe q.b.", "1 cucchiaio miele"], "procedimento": "Step 1: Tagliare la baguette in fette oblique di 1,5cm di spessore, strofinare leggermente con uno spicchio d'aglio.\nStep 2: Disporre le fette su una teglia e tostarle in forno a 200°C per 5-6 minuti fino a doratura.\nStep 3: Tagliare la fontina a dadini, sbriciolate il gorgonzola in una ciotola e mescolare insieme.\nStep 4: In un pentolino a fuoco dolce, sciogliere il burro, aggiungere i formaggi misti e la panna, mescolando continuamente per 3-4 minuti fino a ottenere una crema omogenea.\nStep 5: Condire la fonduta con sale, pepo e un filo di miele, mescolando bene.\nStep 6: Distribuire la fonduta calda sulle bruschette tostate, spolverare con pepe nero macinato fresco.\nStep 7: Servire immediatamente mentre la fonduta è ancora calda e cremosa."}}, {"id": 96, "title": "Bruschetta con spuma di mortadella", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["1 filone di pane toscano o pane tipo ciabatta", "200g mortadella di Bologna", "100g mascarpone", "30g parmigiano reggiano grattugiato", "1 cucchiaio di pistacchio tritato", "2 cucchiai di olio extravergine di oliva", "Sale e pepe q.b.", "Pepe rosa per decorazione"], "procedimento": "Step 1: Affetta il pane in fette dello spessore di 1 cm e tostale in forno a 200°C per 5-6 minuti fino a renderle croccanti.\nStep 2: Trita finemente la mortadella e mettila in una ciotola con il mascarpone e il parmigiano reggiano.\nStep 3: Monta gli ingredienti insieme con una frusta manuale fino a ottenere una spuma leggera e ariosa, regolando di sale e pepe.\nStep 4: Stendi uno strato generoso di spuma di mortadella su ogni fetta di pane tostato.\nStep 5: Drizzla un filo di olio extravergine di oliva su ciascuna bruschetta.\nStep 6: Decora con il pistacchio tritato e una manciata di pepe rosa.\nStep 7: Servi subito mentre il pane è ancora croccante."}}, {"id": 97, "title": "Biscotto al cocco bavarese/ cremoso al cioccolato e pop corn al caramello salato", "cat": "Dolci & Dessert", "note": "", "detail": {"ingredienti": ["150g biscotti al cocco sbriciolati", "80g burro fuso", "150g cioccolato fondente 70%", "100ml panna fresca", "50g pop corn", "40g zucchero", "10g burro per il caramello", "5g sale grosso"], "procedimento": "Step 1: Mescola i biscotti al cocco sbriciolati con 80g di burro fuso e compatta il composto sul fondo di 2 bicchieri o coppette.\nStep 2: Sciogli il cioccolato fondente a bagnomaria con 50ml di panna fresca, mescolando fino a ottenere una crema liscia e lucida.\nStep 3: Versa il cioccolato cremoso sui biscotti pressati e lascia riposare in frigorifero per 30 minuti.\nStep 4: Nel frattempo, fai scoppiare il pop corn in una pentola con coperchio a fuoco medio-alto con un cucchiaio d'olio.\nStep 5: In una padella, sciogli 10g di burro con lo zucchero a fuoco medio-alto, mescolando costantemente fino a caramellare leggermente.\nStep 6: Versa il pop corn nel caramello, mescola rapidamente per ricoprirlo, poi spargilo su carta forno e cospargilo con il sale grosso.\nStep 7: Lancia il pop corn caramellato salato sulla crema di cioccolato fredda e decora con eventuali briciole di biscotto al cocco.\nStep 8: Servi subito per mantenere il contrasto tra la cremosità del cioccolato e la croccantezza del pop corn caramellato."}}, {"id": 98, "title": "Pizza zucca guanciale bufala e pepe", "cat": "Pizza & Focaccia", "note": "", "detail": {"ingredienti": ["500g farina di tipo 0", "325ml acqua", "10g sale", "7g lievito di birra secco", "300g zucca butternut", "150g guanciale", "200g mozzarella di bufala", "Pepe nero q.b."], "procedimento": "Step 1: Sciogliere il lievito in acqua tiepida, aggiungere farina e sale. Impastare per 10 minuti fino a ottenere un impasto liscio ed elastico.\nStep 2: Dividere l'impasto in 2 pezzi, farli lievitare in ciotola coperta per 4 ore a temperatura ambiente fino al raddoppio del volume.\nStep 3: Tagliare la zucca a fettine sottili, cuocere in forno a 200°C per 15 minuti con un filo d'olio fino a renderla morbida.\nStep 4: Tagliare il guanciale a dadini piccoli e croccantini, rosolarlo in padella a fuoco medio per 5 minuti, poi scolare su carta assorbente.\nStep 5: Stendere l'impasto su una superficie infarinata creando due dischi di 30cm, posizionarli su carta da forno.\nStep 6: Distribuire la zucca cotta sui dischi, spolverare con pepe nero, aggiungere il guanciale croccante.\nStep 7: Infornare a 250°C per 12-14 minuti fino a doratura della base.\nStep 8: Sfornare, aggiungere mozzarella di bufala a freddo strappata a mano, completare con pepe nero macinato al momento."}}, {"id": 99, "title": "Ravioli ripieni cime di rapa e caciocavallo condimento burro acciughe limone e tarallo sbriciolato", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["250g farina di tipo 00", "2 uova", "300g cime di rapa fresche", "150g caciocavallo affumicato", "80g burro", "6 acciughe sotto sale", "1 limone", "50g tarallo"], "procedimento": "Step 1: Impasta la farina con le uova su un piano di lavoro, lavora l'impasto per 10 minuti fino a renderlo liscio ed elastico, avvolgi nella pellicola e riposa 30 minuti.\nStep 2: Pulisci le cime di rapa e cuocile in acqua salata bollente per 5 minuti, strizzale bene e tritale finemente, grattugia il caciocavallo e mescola con le cime di rapa, aggiusta di sale e pepe.\nStep 3: Stendi l'impasto con il mattarello fino a uno spessore di 1mm, ricava quadrati di 8cm, disponi un cucchiaio di ripieno al centro di metà quadrati, piega l'altra metà formando triangoli e sigilla i bordi.\nStep 4: Porta a ebollizione una pentola d'acqua salata, tuffa i ravioli e cuocili finché non salgono a galla, continua la cottura per 2 minuti ancora.\nStep 5: Lava le acciughe, dissalale e tritale finemente, sciogli il burro in un tegame a fuoco medio, aggiungi le acciughe e fai sciogliere per 1 minuto.\nStep 6: Sbricciola il tarallo con le mani, tosta i frammenti in una padella asciutta per 2 minuti fino a dorarli.\nStep 7: Scolà i ravioli e trasferiscili nel tegame con il burro e acciughe, aggiungi il succo di limone e un pizzico di scorza, mescola delicatamente.\nStep 8: Distribuisci i ravioli nei piatti, cospargili con il tarallo sbriciolato e servi subito."}}, {"id": 100, "title": "Piadina bianca brie/ stracchino carciofini e prosciutto cotto", "cat": "Panini & Piadine", "note": "", "detail": {"ingredienti": ["300g farina 00", "150ml acqua tiepida", "50g strutto", "5g sale", "150g brie o stracchino", "150g carciofini sott'olio", "100g prosciutto cotto", "Pepe nero q.b."], "procedimento": "Step 1: Mescola la farina con il sale, aggiungi lo strutto e l'acqua tiepida. Impasta fino a ottenere un composto liscio e omogeneo, poi lascia riposare 30 minuti coperto.\nStep 2: Dividi l'impasto in 2 porzioni e stendile con il mattarello fino a uno spessore di 3mm, creando due dischi rotondi.\nStep 3: Riscalda una piastra o padella antiaderente a fuoco medio-alto e cuoci la prima piadina per 2-3 minuti per lato fino a doratura.\nStep 4: Trasferisci la piadina cotta su un piatto e spalma metà del formaggio (brie o stracchino) su un lato.\nStep 5: Disponi sopra il formaggio il prosciutto cotto a fette, i carciofini scolati e sgocciolati, e un pizzico di pepe nero.\nStep 6: Piega la piadina a metà e tieni al caldo mentre cuoci la seconda piadina.\nStep 7: Ripeti i passaggi 4-5 con la seconda piadina.\nStep 8: Servi subito le piadine calde, tagliate a metà se desiderato."}}, {"id": 101, "title": "Nachos guacamole, formaggio, jalapenos, yogurt bianco", "cat": "Tacos & Street Food", "note": "", "detail": {"ingredienti": ["200g tortilla chips", "2 avocado maturi", "1 limone", "150g formaggio cheddar grattugiato", "2 jalapeños freschi", "200g yogurt bianco naturale", "1 pizzico di sale", "1 pizzico di pepe nero"], "procedimento": "Step 1: Taglia gli avocado a metà, rimuovi il nocciolo e trasferisci la polpa in una ciotola.\nStep 2: Schiaccia gli avocado con una forchetta, aggiungi il succo di limone, sale e pepe, mescolando fino a ottenere un guacamole cremoso.\nStep 3: Affetta i jalapeños sottilmente, eliminando i semi se preferisci meno piccantezza.\nStep 4: Disponi le tortilla chips su un piatto da portata o su una teglia da forno.\nStep 5: Distribuisci il guacamole sulle chips con un cucchiaio.\nStep 6: Cospargere il formaggio cheddar grattugiato su tutto il piatto.\nStep 7: Aggiungere gli jalapeños affettati e un cucchiaio di yogurt bianco su ogni porzione.\nStep 8: Servi immediatamente mentre i nachos sono croccanti e il formaggio è ancora caldo."}}, {"id": 102, "title": "Cecina e spuma di mortadella", "cat": "Antipasti & Stuzzichini", "note": "", "detail": {"ingredienti": ["200g farina di ceci", "500ml acqua", "150g mortadella di Bologna", "100ml panna fresca", "50g burro", "Sale e pepe q.b.", "2g di gelatina in fogli (facoltativo)", "Olio extra vergine d'oliva"], "procedimento": "Step 1: Sciogliere la gelatina in acqua fredda per 5 minuti, poi portare a temperatura. Nel frattempo, setacciare la farina di ceci in una ciotola e versare gradualmente l'acqua tiepida, mescolando continuamente per evitare grumi.\nStep 2: Aggiungere sale e pepe alla pastella di ceci, quindi versarla in una padella antiaderente unta d'olio. Cuocere a fuoco medio per 8-10 minuti fino a quando la superficie non inizia a indurirsi, mescolando frequentemente.\nStep 3: Trasferire la cecina su un piano di lavoro, lasciarla raffreddare leggermente, quindi tagliarla in forme regolari (quadrati o rettangoli).\nStep 4: Tritare finemente la mortadella e frullarla insieme alla panna fresca fredda e al burro fino a ottenere una spuma leggera e vellutata.\nStep 5: Disporre la cecina nei piatti, aggiungere la spuma di mortadella con una saccapoche o un cucchiaio, condire con un filo d'olio extra vergine e pepe fresco macinato."}}, {"id": 103, "title": "Focaccia crudo burrata/ bufala fico", "cat": "Pizza & Focaccia", "note": "", "detail": {"ingredienti": ["300g farina di tipo 0", "150ml acqua tiepida", "7g sale fino", "3g lievito di birra secco", "30ml olio extravergine di oliva", "100g prosciutto crudo di Parma", "150g burrata fresca", "4 fichi freschi maturi"], "procedimento": "Step 1: Sciogliere il lievito in acqua tiepida e lasciar riposare 5 minuti. In una ciotola mescolare la farina con il sale, aggiungere l'acqua con lievito e 15ml di olio, impastare fino a ottenere un composto omogeneo.\nStep 2: Stendere l'impasto su una teglia unta con olio, coprire con film e far lievitare per 2 ore a temperatura ambiente fino al raddoppio del volume.\nStep 3: Distribuire uniformemente il resto dell'olio sulla superficie della focaccia, pressare delicatamente con le dita per creare piccole fossette caratteristiche.\nStep 4: Infornare a 200°C per 18-20 minuti fino a doratura uniforme. Sfornare e far raffreddare leggermente.\nStep 5: Disporre il prosciutto crudo sulla focaccia ancora tiepida, aggiungere la burrata a pezzetti.\nStep 6: Tagliare i fichi in quarti e distribuirli sulla focaccia insieme alle altre componenti.\nStep 7: Finire con un filo di olio extravergine e una macinata di pepe nero.\nStep 8: Servire tiepida, tagliata in porzioni."}}, {"id": 104, "title": "Tacos acciughe alla povera, cipolla marinata squaquerone peperoncino e insalata iceberg", "cat": "Tacos & Street Food", "note": "", "detail": {"ingredienti": ["8 filetti di acciughe sott'olio, 80g", "2 cipolle rosse medie", "150g squaquerone", "4 tortillas di mais", "150g insalata iceberg", "1 peperoncino rosso fresco", "2 cucchiai di aceto di vino bianco", "Sale e pepe"], "procedimento": "Step 1: Affettare finemente le cipolle rosse e metterle in una ciotola. Coprire con aceto di vino bianco, aggiungere un pizzico di sale e lasciare marinare per almeno 15 minuti.\nStep 2: Tritare finemente il peperoncino rosso fresco, eliminando i semi se si preferisce meno piccantezza, e metterlo in una piccola ciotola.\nStep 3: Strappare l'insalata iceberg a mano in pezzi non troppo piccoli e metterla in una ciotola separata.\nStep 4: Scaldare leggermente le tortillas di mais in una padella antiaderente per 30 secondi per lato, giusto per renderle più morbide e flessibili.\nStep 5: Spalmare un cucchiaio di squaquerone su ogni tortilla calda, distribuendolo in modo omogeneo.\nStep 6: Posizionare 2 filetti di acciughe su ogni tortilla, poi aggiungere una manciata di insalata iceberg.\nStep 7: Aggiungere un cucchiaio di cipolla marinata e un pizzico di peperoncino tritato su ogni taco.\nStep 8: Servire immediatamente, ancora caldi, accompagnati con il liquido di marinatura della cipolla come condimento aggiuntivo."}}, {"id": 105, "title": "Coni di piadina croccante/ polenta mais croccante, tartare di carne/ tonno guacamole pomodorini", "cat": "Tacos & Street Food", "note": "", "detail": {"ingredienti": ["200g farina di mais (polenta)", "100g farina 00", "80ml acqua", "40ml olio evo", "Sale q.b.", "200g carne di manzo freschissima (o tonno)", "1 avocado maturo", "150g pomodorini ciliegini"], "procedimento": "Step 1: Impastare farina di mais, farina 00, acqua, olio evo e sale fino a ottenere un impasto liscio e omogeneo. Lasciare riposare 20 minuti.\nStep 2: Stendere l'impasto con il mattarello fra due fogli di carta forno, ricavare rettangoli di 15x10cm e cuocerli in padella antiaderente a fuoco medio per 2-3 minuti per lato fino a doratura croccante.\nStep 3: Mentre ancora caldi, avvolgere i rettangoli intorno a uno stampo conico (o un cono di carta stagnola) per dargli forma e lasciar raffreddare.\nStep 4: Tritare finemente la carne (o tonno) con coltello, condire con sale, pepe e un filo d'olio evo per la tartare.\nStep 5: Tagliare l'avocado a cubetti, spruzzare di limone e condire delicatamente con sale.\nStep 6: Dimezzare i pomodorini e condire con sale e olio evo.\nStep 7: Riempire i coni croccanti alternando tartare, guacamole e pomodorini.\nStep 8: Servire immediato, decorando con microerbe e un filo di olio evo."}}, {"id": 106, "title": "Tartare di manzo, mousse di ricotta e pane carasau (ricetta Ghedo)", "cat": "Dolci & Dessert", "note": "", "detail": {"ingredienti": ["200g manzo di alta qualità (scamone o controfiletto)", "150g ricotta di pecora fresca", "50g parmigiano reggiano grattugiato", "4 fogli di pane carasau", "30ml olio extra vergine di oliva", "1 limone", "Sale e pepe nero q.b.", "5g erba cipollina fresca"], "procedimento": "Step 1: Selezionare una parte di manzo magra e di ottima qualità, pulirla da tendini e grasso visibile, quindi tagliarla finissima con coltello affilato (o fatela tritare dal macellaio) creando una tartare compatta.\nStep 2: Condire la tartare con sale, pepe nero macinato fresco, il succo di mezzo limone e 15ml di olio extra vergine, amalgamando delicatamente con un cucchiaio.\nStep 3: In una ciotola, lavorare la ricotta con il parmigiano fino a ottenere una mousse cremosa e omogenea, aggiustando di sale e pepe.\nStep 4: Spezzettare il pane carasau in frammenti irregolari e toastarlo leggermente in padella asciutta per renderlo croccante.\nStep 5: Comporre il piatto: disporre la tartare al centro del piatto, aggiungere un quenelle di mousse di ricotta accanto e distribuire i frammenti di pane carasau intorno.\nStep 6: Completare con un filo di olio extra vergine, un grana di sale maldon e erba cipollina tritata fresca."}}, {"id": 107, "title": "Arancina mortadella pistacchio", "cat": "Secondi Piatti", "note": "", "detail": {"ingredienti": ["300g riso arborio", "100g mortadella affettata", "50g pistacchio sgusciato", "2 uova", "50g parmigiano reggiano grattugiato", "80g pangrattato", "Olio di arachide per friggere", "Sale e pepe q.b."], "procedimento": "Step 1: Cuocere il riso in acqua salata per 18 minuti, scolare e versare in una ciotola. Aggiungere il parmigiano, un uovo e mescolare bene fino a raffreddamento completo.\nStep 2: Tritare grossolanamente la mortadella e i pistacchi, quindi mescolarli insieme in una ciotola.\nStep 3: Formare con le mani un guscio di riso delle dimensioni di una noce, inserire al centro un cucchiaio del ripieno di mortadella e pistacchio, quindi chiudere bene il riso intorno al ripieno formando una sfera.\nStep 4: Preparare due ciotole: in una versare l'uovo rimanente leggermente sbattuto, nell'altra il pangrattato.\nStep 5: Passare ogni arancina nell'uovo sbattuto, poi nel pangrattato, premendo leggermente affinché aderisca bene.\nStep 6: Scaldare l'olio di arachide in una padella profonda a 170°C e friggere le arancine per 3-4 minuti fino a doratura uniforme.\nStep 7: Scolare su carta assorbente e servire calde."}}, {"id": 108, "title": "Arancina sarde e finocchietto", "cat": "Secondi Piatti", "note": "", "detail": {"ingredienti": ["300g riso Arborio", "600ml brodo vegetale", "100g ragù di carne", "50g formaggio pecorino grattugiato", "30g finocchietto selvatico fresco", "2 uova", "80g pangrattato", "Olio di semi per friggere", "Sale e pepe"], "procedimento": "Step 1: Portare il brodo a ebollizione e tostare il riso in una pentola con un filo d'olio per 2 minuti, mescolando continuamente.\nStep 2: Aggiungere il brodo gradualmente, mescolando spesso, fino a cottura del riso (circa 18-20 minuti). Il riso deve risultare cremoso. Incorporare il pecorino, il ragù e il finocchietto tritato fine. Salare e pepare.\nStep 3: Trasferire il composto su un piano e lasciare raffreddare completamente per almeno 30 minuti.\nStep 4: Bagnare le mani con acqua fredda e modellare il riso in palline di circa 60g, comprimendo bene.\nStep 5: Preparare due ciotole: una con le uova sbattute, una con il pangrattato. Passare ogni arancina prima nell'uovo e poi nel pangrattato, premendo leggermente.\nStep 6: Scaldare l'olio a 170°C e friggere le arancine fino a doratura totale (circa 3-4 minuti), rigirandole a metà cottura.\nStep 7: Scolare su carta assorbente e servire calde."}}, {"id": 109, "title": "Risotto pecorino fichi e prosciutto croccante", "cat": "Primi Piatti", "note": "", "detail": {"ingredienti": ["160g riso Carnaroli", "8 fichi secchi", "100g prosciutto crudo", "80g pecorino romano", "500ml brodo vegetale", "1 scalogno", "40g burro", "1 bicchiere vino bianco secco"], "procedimento": "Step 1: Scaldare il brodo vegetale in un pentolino e mantenerlo a temperatura costante. Tritare finemente lo scalogno.\nStep 2: In una padella, tostare il riso con lo scalogno per 2 minuti, quindi sfumare con il vino bianco.\nStep 3: Aggiungere il brodo caldo mestolo dopo mestolo, mescolando costantemente per circa 18 minuti finché il riso non raggiunge la giusta cottura.\nStep 4: Mentre il riso cuoce, triturare grossolanamente i fichi secchi e far tostare il prosciutto crudo in una padella fino a renderlo croccante, poi spezzettarlo.\nStep 5: A cottura ultimata, manteccare il risotto con burro e pecorino romano grattugiato, creando una cremosità elegante.\nStep 6: Disporre il risotto nei piatti, guarnire con fichi triturati, prosciutto croccante e scaglie di pecorino romano."}}, {"id": 110, "title": "Pizza zucca provola affumicata/ gorgonzola e speck", "cat": "Pizza & Focaccia", "note": "", "detail": {"ingredienti": ["500g farina tipo 0", "300ml acqua tiepida", "7g lievito di birra secco", "10g sale", "400g zucca butternut", "150g provola affumicata", "100g gorgonzola", "80g speck affettato sottile"], "procedimento": "Step 1: Sciogliere il lievito in acqua tiepida, aggiungere farina e sale, impastare per 10 minuti fino a ottenere un impasto liscio e elastico.\nStep 2: Lasciare lievitare l'impasto coperto per 2 ore a temperatura ambiente fino al raddoppio del volume.\nStep 3: Tagliare la zucca a fette sottili, condire con olio e sale, cuocere in forno a 200°C per 15 minuti fino a caramellare leggermente.\nStep 4: Dividere l'impasto in 2 porzioni, stendere su carta forno in due dischi di 25cm, coprire e far riposare 30 minuti.\nStep 5: Distribuire la zucca cotta su entrambe le pizze, aggiungere dadini di provola affumicata e piccoli pezzi di gorgonzola.\nStep 6: Cuocere in forno preriscaldato a 250°C per 12-14 minuti fino a quando la base è dorata e i formaggi fusi.\nStep 7: Aggiungere lo speck crudo direttamente sulle pizze calde appena sfornate.\nStep 8: Servire immediatamente."}}, {"id": 111, "title": "Pan di Spagna mousse allo yogurt composta di mango con crumble", "cat": "Dolci & Dessert", "note": "", "detail": {"ingredienti": ["3 uova", "50g zucchero", "50g farina 00", "250g yogurt greco", "100g mango fresco", "30g burro", "40g farina integrale", "20g zucchero di canna"], "procedimento": "Step 1: Separare i tuorli dagli albumi. Montare gli albumi a neve ferma, poi aggiungere gradualmente lo zucchero bianco e i tuorli, mescolando delicatamente con la farina setacciata fino a ottenere un composto omogeneo.\nStep 2: Versare il composto in uno stampo rettangolare da 20x15cm foderato di carta forno e cuocere a 180°C per 12-15 minuti fino a doratura. Lasciar raffreddare completamente.\nStep 3: Preparare il crumble mescolando la farina integrale con lo zucchero di canna e il burro freddo a dadini fino a ottenere una consistenza sabbioso-friabile.\nStep 4: Disperdere il crumble su una teglia e tostarlo a 180°C per 8-10 minuti fino a doratura croccante.\nStep 5: Preparare la mousse mescolando lo yogurt greco con il mango fresco tagliato a cubetti.\nStep 6: Tagliare il pan di Spagna in due strati e adagiare il primo su un piatto di portata.\nStep 7: Distribuire la mousse di yogurt e mango sul primo strato, poi sovrapporre il secondo strato di pan di Spagna.\nStep 8: Cospargere il crumble sulla superficie e servire freddo."}}, {"id": 112, "title": "Sable' alla nocciola (doppio anello) bigne chantilly e gianduia arachidi e mousse all'arancia", "cat": "Dolci & Dessert", "note": "", "detail": {"ingredienti": ["150g farina", "75g burro", "50g nocciole tostate e tritate", "1 uovo", "30g zucchero", "1 pizzico di sale", "200ml panna fresca", "100g gianduia", "50g arachidi tostate tritate", "2 arance", "40g zucchero a velo", "4 foglie gelatina"], "procedimento": "Step 1: Preparare l'impasto sablé: cremare burro e zucchero, aggiungere uovo, incorporare farina, nocciole e sale. Avvolgere in film e riposare 30 minuti in frigorifero.\nStep 2: Stendere l'impasto a 3mm, ricavare 2 anelli doppi (uno dentro l'altro) con stampini rotondi. Cuocere a 180°C per 12-14 minuti su carta forno. Raffreddare completamente.\nStep 3: Preparare la mousse all'arancia: succo e zeste di 2 arance in una ciotola, aggiungere gelatina ammollata, scaldare leggermente, raffreddare. Montare 100ml di panna e incorporare delicatamente. Versare in sac à poche.\nStep 4: Preparare la crema chantilly gianduia: fondere gianduia a bagnomaria, aggiungere 100ml di panna montata e arachidi tritate. Versare in sac à poche separata.\nStep 5: Assemblare: posizionare il sablé come base, decorare il centro con gianduia-arachidi a rosetta, aggiungere mousse all'arancia intorno. Completare con secondo anello di sablé sopra.\nStep 6: Spolverare con zucchero a velo e servire freddo."}}, {"id": 113, "title": "Pizza provola affumicata crema di cipolla pecorino e pancetta", "cat": "Pizza & Focaccia", "note": "", "detail": {"ingredienti": ["500g farina di tipo 0", "325ml acqua tiepida", "10g sale", "7g lievito di birra secco", "400g cipolle", "150g pancetta affumicata", "200g provola affumicata", "100g pecorino romano grattugiato"], "procedimento": "Step 1: Sciogliere il lievito in acqua tiepida, aggiungere farina e sale, impastare fino a ottenere un composto omogeneo e lasciar lievitare per 2 ore coperto.\nStep 2: Nel frattempo, affettare finemente le cipolle e farle rosolare in padella con la pancetta affumicata tagliata a cubetti fino a caramellatura, salare e pepare.\nStep 3: Dividere l'impasto in due porzioni e stenderle su una teglia unta, creando due dischi di pizza.\nStep 4: Stendere la crema di cipolla e pancetta su ogni base di pizza, distribuire in modo uniforme.\nStep 5: Affettare la provola affumicata e disporla sulla superficie.\nStep 6: Cospargere con pecorino romano grattugiato.\nStep 7: Infornare a 250°C per 12-15 minuti fino a doratura della base e parziale scioglimento della provola.\nStep 8: Estrarre dal forno, lasciar raffreddare 2 minuti e servire caldo."}}, {"id": 114, "title": "Sorbetto melograno e mousse allo yogurt greco", "cat": "Dolci & Dessert", "note": "", "detail": {"ingredienti": ["300g melograno fresco (o 250ml succo puro)", "200g yogurt greco", "60g zucchero semolato", "30ml acqua", "1 albume", "15g miele", "5g gelatina in polvere", "Mezzo limone (succo)"], "procedimento": "Step 1: Estrarre i semi di melograno e frullarli, quindi passarli al setaccio fine per ottenere 250ml di succo puro. Filtrare accuratamente.\nStep 2: Preparare lo sciroppo versando l'acqua in un pentolino, aggiungere 30g di zucchero e portare a ebollizione. Lasciar raffreddare completamente, poi unire il succo di melograno e il succo di limone.\nStep 3: Versare il composto in una gelatiera e frullare per 20-25 minuti fino a ottenere un sorbetto cremoso. In alternativa, congelare in contenitore rigirando ogni 30 minuti per 2-3 ore.\nStep 4: Sciogliere la gelatina in 2 cucchiai di acqua fredda per 5 minuti, poi scaldare a bagnomaria fino a completo scioglimento.\nStep 5: Montare l'albume a neve ferma, incorporando delicatamente lo zucchero rimasto (30g).\nStep 6: Mescolare lo yogurt greco con il miele e la gelatina sciolta. Incorporare con movimenti dolci l'albume montato.\nStep 7: Distribuire la mousse in due bicchieri o coppette, livellare e refrigerare per almeno 2 ore.\nStep 8: Al momento del servizio, posizionare una quenelle di sorbetto sulla mousse e decorare con semi di melograno fresco."}}, {"id": 115, "title": "Zabaione salato mazzancolla al vapore cialda/ crumble capperi", "cat": "Dolci & Dessert", "note": "", "detail": {"ingredienti": ["4 mazzancolle grandi (circa 320g)", "3 tuorli d'uovo", "80ml vino bianco secco", "40g burro", "30g farina", "25g capperi sottosale", "20g pangrattato", "Sale e pepe q.b."], "procedimento": "Step 1: Preparare lo zabaione salato montando i tuorli con il vino bianco a bagnomaria fino a ottenere una crema spumosa, poi incorporare il burro fuso e regolare di sale e pepe.\nStep 2: Pulire le mazzancolle, rimuovere l'intestino dorsale mantenendo il guscio intatto e posizionarle su un piatto per la cottura al vapore.\nStep 3: Cuocere le mazzancolle al vapore per 6-7 minuti fino a quando la polpa diventa opaca e soda.\nStep 4: Preparare il crumble tritando finemente i capperi sciacquati, mescolarli con pangrattato e farina, quindi rosolarli brevemente in una padella asciutta.\nStep 5: Comporre il piatto: adagiare lo zabaione salato al centro del piatto, posizionare le mazzancolle al vapore sopra e cospargere il crumble di capperi sulla parte superiore.\nStep 6: Servire immediatamente mentre lo zabaione è ancora caldo e cremoso."}}, {"id": 116, "title": "Polenta Nero di seppia e seppie limone e prezzemolo", "cat": "Secondi Piatti", "note": "", "detail": {"ingredienti": ["200g polenta istantanea", "300g seppie fresche", "2 bustine (4g) nero di seppia", "1 limone", "1 mazzo di prezzemolo fresco", "800ml brodo di pesce", "40ml olio extravergine di oliva", "Sale e pepe q.b."], "procedimento": "Step 1: Pulire le seppie eliminando la pelle esterna, l'osso interno e l'inchiostro naturale. Tagliarle a anelli sottili di circa 3mm.\nStep 2: Portare il brodo di pesce a ebollizione in una pentola. Versare la polenta a pioggia mescolando costantemente per evitare grumi. Aggiungere il nero di seppia disciolto in un cucchiaio di brodo freddo.\nStep 3: Continuare a mescolare la polenta per 5-7 minuti finché non diventa cremosa e si stacca dalle pareti della pentola. Condire con sale e pepe.\nStep 4: In una padella, scaldare l'olio e rosolare le seppie a fuoco vivace per 2-3 minuti finché non diventano opache. Mantenerle al dente.\nStep 5: Sfumare le seppie con il succo del limone e aggiungere il prezzemolo fresco tritato. Salare e pepare secondo il gusto.\nStep 6: Distribuire la polenta nera nei piatti, disporvi le seppie al limone con tutto il sugo in superficie."}}, {"id": 117, "title": "Pizza crema di zucca provola e guanciale piccante", "cat": "Pizza & Focaccia", "note": "", "detail": {"ingredienti": ["500g farina di tipo 00", "10g sale", "7g lievito di birra secco", "320ml acqua tiepida", "400g zucca mantovana", "150g provola affumicata", "100g guanciale", "1 peperoncino rosso fresco"], "procedimento": "Step 1: Sciogliere il lievito in acqua tiepida, aggiungere farina e sale, impastare per 10 minuti fino a ottenere un impasto liscio e elastico.\nStep 2: Lasciar lievitare l'impasto in ciotola coperta per 2 ore a temperatura ambiente fino al raddoppio del volume.\nStep 3: Cuocere la zucca a forno a 180°C per 30 minuti, frullarla con un cucchiaio di acqua di cottura fino a ottenere una crema omogenea, salare e pepare.\nStep 4: Dividere l'impasto in 2 panetti, stendere su carta forno creando due dischi di pizza da 30cm circa.\nStep 5: Distribuire la crema di zucca su entrambe le pizze, lasciando 1cm di bordo libero.\nStep 6: Affettare il guanciale sottile e disporlo sulla crema insieme a pezzi di provola, cospargere con peperoncino tagliato sottile.\nStep 7: Cuocere a forno preriscaldato a 250°C per 12-14 minuti finché la base risulta croccante e i bordi dorati.\nStep 8: Estrarre dal forno, completare con un filo d'olio di oliva extra vergine e servire subito."}}, {"id": 118, "title": "Pizza crema di zucca gorgonzola castagne e nocciole tritate",
